phase_6_live_validation_harness:
  status: planning_approved_implementation_not_yet_dispatched
  planning_authority: "dev/planning-and-building/phase6-live-validation-harness-plan.md"
  scope: "Automate every existing C03 through F03 live-validation package as an internal plugin/runtime validation harness, retaining bounded resumable human checkpoints only where the operating system/provider boundary cannot credibly be controlled from inside Obsidian."
  external_ui_automation:
    appium_required: false
    policy: "Do not introduce Appium or another external mobile UI-automation platform for this work unless a later explicit decision finds a material validation requirement that the internal harness plus bounded human checkpoints cannot satisfy."
  approved_modules:
    - validation_scenario_runner
    - validation_safety_sandbox
    - fixture_manager
    - production_path_driver
    - plan_assertion_engine
    - cross_device_coordinator
    - deterministic_fault_injection_layer
    - state_and_convergence_verifier
    - evidence_recorder
    - human_checkpoint_resume_controller
  production_path_rule: "The harness must drive the same production planner/executor/state/local-vault/Google-Drive semantics used by real synchronization. It must not implement a second synchronization engine or a production bypass."
  safety_rule: "Harness mutations are restricted to provably harness-owned disposable fixtures, disposable validation state/remotes explicitly required by a scenario, and non-secret validation coordination/evidence metadata."
  suite_scope:
    first: C03
    last: F03
    scenario_count: 23
  human_checkpoint_scenarios:
    D05: "real offline/reconnect action where platform control is unavailable"
    D06: "actual stale-device condition; remain BLOCKED if it cannot be safely induced without forging production state"
    E01: "real Obsidian termination/restart"
    E06: "real authentication revocation/restoration where required by the live provider-bound subcase"
    F03: "disable/uninstall/reinstall/device-unlink lifecycle actions"
  build_decomposition:
    H0: "repository grounding and harness contract foundation"
    H1: "safety sandbox and fixture subsystem"
    H2: "production driver and plan assertions"
    H3: "state verifier and evidence recorder"
    H4: "fault-injection adapters"
    H5: "cross-device coordination and checkpoint/resume"
    H6: "harness core integration"
