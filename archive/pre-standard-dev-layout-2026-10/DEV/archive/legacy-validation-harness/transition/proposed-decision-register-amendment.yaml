remove_from_deferred_engineering:
  - "Exact harness coordination transport and persistence representation, subject to DEC-307 and the no-additional-scope/no-external-backend constraints."
  - "Exact validation-mode activation mechanism and concrete module/type/file layout, subject to DEC-301 through DEC-310 and repository grounding."

add_to_deferred_engineering:
  - "Exact typed declarative scenario DSL syntax and private step-handler decomposition within DEC-314 and the fixed complexity budgets."
  - "Exact stateful in-memory adapter data structures and deterministic time/fault primitives within DEC-313."
  - "Exact validation-only build/entrypoint composition mechanism that preserves DEC-312 shipping separation."
  - "Exact minimal cross-device command-mailbox/desktop-relay representation within DEC-316."
  - "Exact canonical scenario evidence serialization within DEC-317, subject to existing privacy/secret constraints."