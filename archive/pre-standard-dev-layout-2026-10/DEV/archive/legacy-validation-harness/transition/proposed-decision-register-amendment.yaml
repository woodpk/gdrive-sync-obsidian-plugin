    status: superseded
    earlier: "DEC-301 through DEC-310: the Phase-6 internal plugin/runtime validation-harness architecture, including its scenario runner, modular harness decomposition, internal cross-device coordinator, harness-owned checkpoint/evidence orchestration, and production validation-mode surface."
    superseded_by:
