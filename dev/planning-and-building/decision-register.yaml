    decision: "Always expose a clear current synchronization status, such as idle, syncing, offline, authentication-required, conflict-blocked, recovery-required, or error."
  - id: DEC-225
    status: locked
    category: observability
    decision: "Provide a dedicated conflict/recovery management UI for unresolved conflicts, preserved alternates, blocked destructive plans, and recovery-required states."
  - id: DEC-226
    status: locked
    category: notifications
    decision: "User notifications are reserved for meaningful events such as conflicts, blocked destructive plans, authentication failure, recovery mode, or repeated sync errors; avoid routine notification noise."
  - id: DEC-227
    status: locked
    category: audit
    decision: "Keep bounded, user-visible sync history/audit information covering planned/executed operations, conflicts, errors, deletions, and recovery events."
  - id: DEC-228
    status: locked
    category: audit
    decision: "Audit/history records contain metadata and operations, not full note text or binary payloads."
  - id: DEC-229
    status: locked
    category: audit
    decision: "Audit/history retention has configurable bounded limits sufficient for recovery and diagnostics without unbounded growth."
  - id: DEC-230
    status: locked
    category: sync_controls
    decision: "Support safe cancellation of an active sync: finish or rollback the current atomic operation as appropriate, stop starting new operations, checkpoint accurately, and resume/reconcile later."

  - id: DEC-240
    status: locked
    category: obsidian_config
    decision: ".obsidian synchronization is selective, not all-or-nothing."
  - id: DEC-241
    status: locked
    category: obsidian_config
    decision: "Portable settings/configuration may synchronize when safe across Windows and iOS."
  - id: DEC-242
    status: locked
    category: obsidian_config
    decision: "Device-specific workspace state, caches, authentication tokens/secrets, and platform-unsafe configuration are excluded from synchronization."
  - id: DEC-243
    status: locked
    category: obsidian_config
    decision: "Exact inclusion/exclusion rules must be explicit and visible; secrets and authentication data must never synchronize."
  - id: DEC-244
    status: deferred_engineering
    category: obsidian_config
    decision: "Exact file/path-level Obsidian configuration inclusion/exclusion list is an engineering-maintained explicit safe policy; unknown configuration remains excluded until portability/safety is established."

  - id: DEC-250
    status: locked
    category: offline_network
    decision: "Fully support offline local editing and reconcile changes later when Google Drive connectivity returns."
  - id: DEC-251
    status: locked
    category: offline_network
    decision: "Use bounded retry with exponential backoff and jitter for transient network/API failures, then defer cleanly if unavailable."
  - id: DEC-252
    status: locked
    category: offline_network
    decision: "Handle Drive API rate limits proactively using bounded concurrency, backoff, and server quota or Retry-After guidance."
  - id: DEC-253
    status: locked
    category: resource_failures
    decision: "On Google Drive quota/storage exhaustion, preserve all local changes, stop affected remote writes, and surface an actionable error; never use a destructive fallback."
  - id: DEC-254
    status: locked
    category: mobile_behavior
    decision: "Automatic sync may defer expensive work under constrained mobile conditions; manual sync remains available and correctness is never compromised."

  - id: DEC-260
    status: locked
    category: transfer_integrity
    decision: "Verify transferred content integrity before committing sync state; a successful API response alone does not prove correct bytes were transferred."
  - id: DEC-261
    status: locked
    category: transfer_integrity
    decision: "Hash/content validation is part of transfer verification."
  - id: DEC-262
    status: locked
    category: transfer_integrity
    decision: "Downloads should use atomic replacement where feasible."
  - id: DEC-263
    status: locked
    category: transfer_integrity
    decision: "The system must remain restart-safe and idempotent around partially uploaded/downloaded content and interrupted runs."

  - id: DEC-270
    status: locked
    category: privacy
    decision: "No external telemetry by default; diagnostics/logging remain local unless the user explicitly exports or shares them."
  - id: DEC-271
    status: locked
    category: security
    decision: "Do not add custom application-level encryption in the initial product; rely on Google account/Drive security unless the user later establishes a requirement for plugin-controlled end-to-end encryption."
  - id: DEC-272
    status: locked
    category: privacy
    decision: "Diagnostic/audit logs must not contain full note contents or binary payloads."

  - id: DEC-280
    status: locked
    category: brain_asset_boundary
    decision: "ChatGPT Work continues to perform its existing scoped BRAIN asset-processing workflow; the sync plugin does not subsume that workflow."
  - id: DEC-281
    status: locked
    category: brain_asset_boundary
    decision: "The sync plugin synchronizes vault filesystem state, including binary files, without semantic asset processing."
  - id: DEC-282
    status: locked
    category: brain_asset_boundary
    decision: "A binary independently dropped into 00-Inbox is an ordinary vault file for synchronization purposes and is synchronized byte-for-byte until another workflow changes or deletes it."
  - id: DEC-283
    status: locked
    category: brain_asset_boundary
    decision: "If a binary is physically embedded inside another file, such as inside a DOCX, the plugin treats the containing file as one opaque file and does not extract or reinterpret embedded assets."
  - id: DEC-284
    status: locked
    category: brain_asset_boundary
    decision: "If Obsidian materializes an attachment as a separate vault object referenced by a note, the plugin synchronizes the note and attachment as separate ordinary vault files."
  - id: DEC-285
    status: locked
    category: brain_asset_boundary
    decision: "The plugin does not perform AI/semantic sensitivity screening, asset classification, externalization, Drive-link insertion, or other ChatGPT Work semantic duties."
  - id: DEC-286
    status: locked
    category: brain_asset_boundary
    decision: "The existing Google Drive BRAIN asset repository is strictly outside the synchronization engine's management boundary; the plugin must not enumerate, reconcile, rename, delete, or otherwise manage it as part of vault synchronization."
  - id: DEC-287
    status: locked
    category: brain_asset_boundary
    decision: "When ChatGPT Work externalizes an asset and deletes the corresponding vault binary, that vault deletion propagates across distributed vault instances and the plugin's sync-remote representation."
  - id: DEC-288
    status: locked
    category: brain_asset_boundary
    decision: "A vault deletion must never be interpreted as deletion of the separately externalized canonical Google Drive BRAIN asset copy."
  - id: DEC-289
    status: locked
    category: brain_asset_boundary
    decision: "The Google Drive BRAIN asset repository and the plugin's Google Drive BRAIN Sync remote are logically distinct storage domains even if both exist in the same Google account."

  - id: DEC-290
    status: locked
    category: performance_optimization
    implementation_status: complete_through_current_phase6_latency_workstream
    scheduled_after: "iPhone integration/setup is complete and the iPhone client is working correctly"
    decision: "The synchronization performance optimization program is explicitly planned and must preserve correctness, crash safety, provenance, integrity verification, recovery semantics, fail-closed uncertainty handling, and mobile resource safety."
  - id: DEC-291
    status: locked
    category: performance_optimization
    decision: "Add per-run caching/reuse of invariant Google account/pairing validation and managed-root/content-domain/portable-config-domain discovery, with explicit invalidation/revalidation boundaries whenever relevant remote state can have changed."
  - id: DEC-292
    status: locked
    category: performance_optimization
    decision: "Cache Drive folder IDs, resolved logical paths, parent chains, and parent-folder lookup/creation results within a run so sibling files do not repeatedly traverse or query the same remote directory hierarchy."
  - id: DEC-293
    status: locked
    category: performance_optimization
    decision: "Batch or consolidate Drive metadata/path queries where the Drive API permits, eliminating avoidable N+1 child lookups and repeated parent traversal without weakening identity/provenance validation."
  - id: DEC-294
    status: locked
    category: performance_optimization
    decision: "Use the Google Drive Changes API/change cursor and persistent synchronization state as the ordinary steady-state discovery path; reserve full remote-tree reconciliation for required startup, recovery, integrity, configured periodic, or explicit Verify/Reconcile cases."
  - id: DEC-295
    status: locked
    category: performance_optimization
    decision: "Reuse canonical local hash/content evidence when an unchanged stable observation token proves cached evidence remains valid, avoiding unnecessary rereads/rehashes while preserving required transfer integrity verification."
  - id: DEC-296
    status: locked
    category: performance_optimization
    decision: "Remove or coalesce provably redundant duplicate precondition validation when a validated result can safely remain authoritative across the journal/mutation boundary; stale-plan rejection must remain whenever evidence may have changed."
  - id: DEC-297
    status: locked
    category: performance_optimization
    decision: "Pipeline independent metadata and transfer-preparation work where safe while preserving per-operation crash-safe journaling, deterministic state commits, retry/idempotency behavior, and cancellation semantics."
  - id: DEC-298
    status: locked
    category: performance_optimization
    decision: "Introduce bounded concurrency for independent non-destructive uploads/downloads rather than strictly serial file transfer, using configurable/platform-aware limits, Drive rate/quota backpressure, and tighter iOS resource limits. This does not permit overlapping whole synchronization runs."
  - id: DEC-299
    status: locked
    category: platform_containment
    decision: "Local-vault containment is platform-specific while preserving one safety outcome. Windows retains desktop-only physical external-reference inspection using lstat and canonical realpath containment. On iOS, the active Obsidian mobile DataAdapter namespace plus strict vault-relative path validation and enumeration-child provenance is the approved filesystem capability boundary. Mobile code must not bypass that boundary into arbitrary native filesystem paths or Node/Electron APIs; malformed, escaping, unsupported, or unprovable individual paths remain blocked and produce incomplete evidence. The absence of desktop lstat/realpath on iOS is not grounds to disable all normal iOS vault synchronization."
  - id: DEC-300
    status: locked
    category: synchronization_execution
    decision: "A path-local blocked, conflicting, or transiently unstable operation must be isolated with any operation whose dependency on it cannot be disproven, while unrelated independently safe operations continue in both automatic and reviewed runs. Path attention is not run-wide execution authority: recovery/untrusted state, invalid managed-remote or authentication authority, stale-plan authority, and checkpoint-gated suspicious destruction remain global gates. Successfully committed safe operations retain normal crash-safe authoritative state; skipped paths remain uncommitted and retryable; partial runs do not advance an incompletely incorporated Drive cursor or complete the first-sync trust gate. Current skipped paths are recorded in a bounded device-local attention ledger with CSV export, outside vault synchronization scope and ordinary diagnostics."

  - id: DEC-301
    status: superseded
    superseded_by: DEC-311
    category: phase6_validation_automation
    decision: "Automate every remaining ordinary Phase 6 live-validation package from C03 through F03 through an internal BRAIN validation harness running inside the supported Obsidian/plugin runtimes. Appium or another external mobile UI-automation platform is not required for this plan and must not be introduced unless a later explicit decision establishes a material unmet need."
  - id: DEC-302
    status: superseded
    superseded_by: DEC-311
    category: phase6_validation_automation
    decision: "The validation harness must drive the same production planner, authoritative executor, synchronization-state authority, local-vault boundary, and Google Drive synchronization seams used by ordinary product synchronization. It must not implement an alternate synchronization engine, shadow policy, or production mutation bypass."
  - id: DEC-303
    status: superseded
    superseded_by: DEC-311
    category: phase6_validation_architecture
    decision: "The harness is decomposed into single-responsibility modules: scenario runner, validation safety sandbox, fixture manager, production-path driver, plan assertion engine, cross-device coordinator, deterministic fault-injection layer, state/convergence verifier, evidence recorder, and human checkpoint/resume controller. Shared harness contracts must be frozen before dependent parallel implementation."
  - id: DEC-304
    status: superseded
    superseded_by: DEC-311
    category: phase6_validation_safety
    decision: "Harness mutation authority is restricted to provably harness-owned disposable fixtures, explicitly disposable validation state/remotes required by a scenario, and non-secret validation coordination/evidence metadata. Ambiguous ownership fails closed; the harness may not mutate unrelated BRAIN content, canonical external BRAIN assets, credentials, or primary authoritative state merely to manufacture a test."
  - id: DEC-305
    status: superseded
    superseded_by: DEC-311
    category: phase6_validation_execution
    decision: "Before executing a harness-driven synchronization plan, the harness must assert the actual production plan against the scenario's allowed operation/safety contract. Any unexpected mutation, duplicate, conflict, destructive action, blocked operation, or recovery condition causes a pre-mutation hard stop unless that condition is explicitly expected by the scenario."
  - id: DEC-306
    status: superseded
    superseded_by: DEC-311
    category: phase6_validation_faults
    decision: "Deterministic fault injection may be implemented only through test-only adapters/fault points at existing boundaries and only while explicit validation mode is active. Injected causes must never fabricate stronger physical-effect certainty than the production system actually has; uncertain remote effects remain uncertain until physical reality is observed. Fault controls must be unreachable from ordinary product execution."
  - id: DEC-307
    status: superseded
    superseded_by: DEC-311
    category: phase6_validation_coordination
    decision: "Cross-device validation is coordinated by the internal harness without a developer-hosted automation backend or additional OAuth scope. Coordination metadata must be logically outside ordinary synchronized vault content, run-scoped, non-secret, resumable, and unable to become synchronization authority for the fixture under test."
  - id: DEC-308
    status: superseded
    superseded_by: DEC-311
    category: phase6_validation_human_checkpoints
    decision: "Genuine OS/provider-bound actions remain bounded resumable human checkpoints rather than justification for Appium: real offline/reconnect where necessary, actually stale-device conditions that cannot be forged, real Obsidian termination/restart, genuine authentication restoration where required, and disable/uninstall/reinstall/device-unlink lifecycle actions. The harness automates setup, evidence, verification, and resumption around those checkpoints."
  - id: DEC-309
    status: superseded
    superseded_by: DEC-311
    category: phase6_validation_evidence
    decision: "Every harness scenario must produce objective machine-readable and human-readable evidence sufficient to determine PASS/FAIL/BLOCKED from actual plan, effect, state, identity, content/hash, convergence, fault/checkpoint, and terminal-run observations. Missing required proof is not PASS, and diagnostics/evidence must preserve existing privacy/secret rules."
  - id: DEC-310
    status: superseded
    superseded_by: DEC-311
    category: phase6_mobile_validation
    decision: "For Phase 6 validation, iPhone and iPad are interchangeable mobile participants unless a scenario explicitly depends on a device-class-specific capability. Battery/charging-driven switching is allowed only at safe durable scenario boundaries/checkpoints; the harness/evidence must record the actual installation/device identity performing each step and must not merge distinct device authority."

  - id: DEC-311
    status: locked
    category: phase6_validation_architecture
    decision: "Replace the oversized internal Phase-6 validation harness with the BRAIN Verification Platform (BVP): an external repository-controlled test platform that uses deterministic virtual-world execution for most synchronization semantics and a thin validation-only live-device agent only for behavior that genuinely requires installed Windows/iOS Obsidian runtimes."

  - id: DEC-312
    status: locked
    category: phase6_validation_architecture
    decision: "Physically separate verification infrastructure from production: replacement platform code lives under top-level test-platform/**; production src/** must not import test-platform/**; ordinary production bundles must exclude the platform, scenarios, live validation agent, cross-device control, and validation-only UI. Any production-only BVP seam is explicitly enumerated and tightly budgeted."

  - id: DEC-313
    status: locked
    category: phase6_validation_execution
    decision: "Use stateful deterministic in-memory implementations of local-vault, Google Drive, device-local state, cursor/tombstone, time/order, and fault boundaries to run the real production planner/executor/state semantics for automated multi-device verification. Simulated boundaries model external reality and must not implement alternate synchronization policy."

  - id: DEC-314
    status: locked
    category: phase6_validation_scenarios
    decision: "Ordinary verification scenarios are typed declarative step definitions interpreted by one common external runner. Scenario-specific orchestration classes, scenario-specific production code, and scenario-specific PowerShell verification scripts are prohibited."

  - id: DEC-315
    status: locked
    category: phase6_validation_live_devices
    decision: "The external BVP runner owns scenario sequence, checkpoint state, assertions, evidence, and verdicts. A validation-only device agent may execute bounded addressed commands through the production path and return observations/results, but it must not contain a general scenario state machine or durable distributed suite orchestration."

  - id: DEC-316
    status: locked
    category: phase6_validation_coordination
    decision: "Live cross-device validation may use a minimal run/device/sequence command mailbox or relay within existing user-owned infrastructure, without a developer-hosted automation backend, token export, or additional Google OAuth scope. Coordination records are test control metadata and never synchronization authority or ordinary vault content."

  - id: DEC-317
    status: locked
    category: phase6_validation_evidence
    decision: "Verification verdicts derive from objective observations of production plans/results, content/hash/identity, authoritative state, remote reality, conflicts, and required platform outcomes. Production execution exposes a narrow authoritative run receipt or equivalent terminal observation when needed; diagnostics corroborate evidence but are not the test-control authority protocol."

  - id: DEC-318
    status: locked
    category: validation_anti_drift
    decision: "The BVP architecture is mechanically enforced by a machine-readable boundary manifest, repository-controlled PowerShell architecture guard, and architecture metrics. A failed architecture guard blocks acceptance regardless of functional test results."

  - id: DEC-319
    status: locked
    category: validation_anti_drift
    decision: "Initial hard complexity budgets are fixed until explicit user-approved architecture change: production BVP-only seam <=350 logical LOC across <=4 production files; BVP framework core <=4000 logical TypeScript LOC; live-device agent subset <=750 logical TypeScript LOC; ordinary declarative scenario hard maximum 200 logical LOC with <=120 target; zero scenario-specific PowerShell scripts; BVP PowerShell governance/verification <=4 scripts and <=1500 logical LOC combined; zero scenario-specific production files. Tests are not subject to a LOC ceiling."

  - id: DEC-320
    status: superseded
    superseded_by: DEC-323
    category: verification_execution
    decision: "GitHub Actions are not used for BVP build/test/CI-like verification or evidence collection. Repository-controlled PowerShell scripts under dev/scripts/ perform required local verification, capture commands/results/exit codes/architecture metrics, and write canonical evidence to dev/_ca-output.md; each local workflow also provides a small paste-ready PowerShell bootstrap that delegates to the committed verifier."

  - id: DEC-321
    status: locked
    category: project_authority
    decision: "All active dev/** material whose purpose is the superseded internal validation harness is moved under dev/archive/legacy-validation-harness/** during the first environment-preparation session. Archived material is historical/non-authoritative and excluded from normal task discovery and implementation grounding unless a supervisor explicitly requests historical evidence."

  - id: DEC-322
    status: superseded
    superseded_by: DEC-324
    category: validation_anti_drift
    decision: "Architecture-boundary manifest, architecture guard, metrics script, and canonical BVP verifier are supervisor-owned frozen surfaces after establishment. Ordinary coding agents may not weaken or change them. Every implementation session runs guard/metrics, and after no more than two implementation sessions the supervisor must perform a repository-level architecture review before further dispatch. New runner/router/distributed-state/coordination/evidence/persistence architectures or complexity-budget increases require explicit architecture approval before implementation."

  - id: DEC-323
    status: locked
    category: verification_execution
    decision: "GitHub Actions are prohibited for BVP verification. The canonical local CI/acceptance system is the installed PHX-CI deployed runtime selected by the consumer branch's exact phx-ci.json framework SHA. Coding-agent task branches and primary-stage integration heads are authoritatively verified through the deployed-runtime scripts/Invoke-PhxCi.ps1 operator front door with evidence publication when authorized. PHX-CI owns exact target/base/change-set resolution, detached verification worktrees, full test/build/repository/artifact gates, race protection, and canonical dev/_ca-output.md / dev/test-results evidence. Project-specific BVP guard/metrics logic remains repository-controlled, but task-specific verifier scripts are prohibited."

  - id: DEC-324
    status: locked
    category: validation_anti_drift
    decision: "After BVP governance establishment, the architecture boundary, architecture guard, architecture metrics, PHX-CI consumer pin/integration, and complexity budgets are frozen for ordinary work. Every implementation child session must pass PHX-CI; every primary BVP stage must also pass an integrated PHX-CI acceptance gate. Architecture guard/metrics must execute inside the repository check used by PHX-CI. After no more than two implementation child sessions, the supervisor performs a repository-level architecture review before further dispatch. New runner/router/distributed-state/coordination/evidence/persistence architecture or any complexity-budget increase requires explicit architecture approval before implementation."

  - id: DEC-325
    status: locked
    category: construction_session_control
    decision: "BVP-S01 through BVP-S09 are primary Stage-2A work packages, not presumed one-turn coding sessions. Each is decomposed into bounded child sessions. A later child-session task file may be pre-generated only as PREPLANNED / NOT-YET-EXECUTABLE; immediately before execution the supervisor must inspect the actual accepted repository, bind the exact predecessor SHA, exact writable-path allowlist, exact relevant interfaces/tests, and PHX-CI branch-verification facts, and then mark the prompt EXECUTABLE. If the expected work spans more than one new platform-level contract family, more than six substantive non-test implementation files, or approximately 1000 net new non-test LOC, the supervisor must split it further before dispatch, except for mechanical deletion/move work and declarative-scenario batches."

  - id: DEC-326
    status: locked
    category: validation_anti_drift
    decision: "Coding agents do not receive authority to classify ambiguous repository surfaces when supervisor repository inspection can resolve them. Executable BVP prompts must state an exact writable-path allowlist and supervisor-decided retain/delete boundaries. If implementation appears to require an unlisted path, additional production seam, broader architecture, or reclassification, the agent must return BLOCKED to the supervisor rather than deciding, preserving, deleting, or expanding scope on its own."

