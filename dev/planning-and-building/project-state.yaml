phase_6_live_validation_blocker:
  status: confirmed_blocking_product_defect
  validation_session: "2026-09-07T0010-P6LIVE"
  evidence_source: "user-supplied live-validation archive; session-summary.md reviewed first, followed by test-results and focused diagnostics/state evidence"
  failing_gate:
    test_id: "P6-LIVE-A03"
    scenario: "Baseline Verify/Reconcile on real Windows installation before fixture mutations"
    observed_product_status: recovery-required
    plan_created: false
    execution_started: false
    physical_sync_mutation_started: false
    iphone_testing_started: false
  install_and_environment_findings:
    release_identity: PASS
    installed_main_js_hash: PASS
    installed_manifest_hash: PASS
    device_identity_present: true
    vault_identity_present: true
    managed_remote_pairing_present: true
    authentication_functional: true
    firstSyncCompleted: false
    recoveryInProgress: false
  persisted_state_findings:
    legacy_trusted_state_present: true
    authorityMigrationRequired: true
    base_entry_count: 8
    remote_mapping_count: 8
    historical_operation_count: 9
    known_device_count: 1
    authority_schema_marker_present: false
  defect_classification: "upgrade-state compatibility / legacy trusted-state to writable v1.1 authority transition missing"
  causal_finding: "The live installation contains non-empty legacy trusted synchronization state created before durable authoritySchemaVersion state. Current production can load that state through the legacy state interface, but the writable SynchronizationStateAuthorityAdapter delegates loadAuthority() to PersistentSynchronizationStateStore, which rejects the legacy document as non-authoritative. The existing explicit migrateAuthorityV1ToV1_1() handles authority schema v1 -> v1.1 only; it does not migrate pre-authority trusted state. The product therefore fail-closes at recovery-required with no successful user-facing migration/reconstruction transition."
  safety_assessment: "Fail-closed behavior is correct and prevented unsafe mutation. The defect is the missing safe upgrade/recovery transition, not the refusal to synchronize without authority."
  out_of_scope_mutation_detected: false
  ordinary_brain_content_mutated_by_test: false
  oauth_causal: false
  google_drive_transport_causal: false
  iphone_causal: false
  prohibited_workarounds:
    - "Do not delete IndexedDB synchronization state."
    - "Do not delete or reset data.json."
    - "Do not deauthorize or clear pairing merely to escape the gate."
    - "Do not set firstSyncCompleted=true by hand."
    - "Do not discard legacy BASE/mappings/cursor/tombstones."
    - "Do not treat missing authority metadata as deletion authority."
    - "Do not silently force a fresh-install/empty-state path."
  secondary_observability_finding: "Verify/Reconcile currently does not allocate the same diagnostic runId path used by manual Sync now, which reduces run-level trace correlation. This is secondary and not causal to the blocker."

phase_6_required_repair:
  status: required_before_any_further_live_sync_testing
  objective: "Provide a safe, deterministic transition for an existing installed legacy trusted synchronization state into the current writable v1.1 authority model, or an explicit backup-first reconstruction flow when exact migration cannot be proven."
  required_properties:
    - "Backup legacy durable state before replacement."
    - "Use atomic compare-and-swap or equivalent race-safe replacement."
    - "Preserve vault identity, device identity, trustworthy BASE, remote mappings, tombstones, change cursor, and known-device facts where representable and valid."
    - "Derive semantic generation and BASE/path authority deterministically only from evidence that is actually present and exact."
    - "Do not manufacture authority for ambiguous/incomplete legacy facts."
    - "Do not carry non-terminal/ambiguous legacy operation state into destructive authority; fail closed into explicit reconstruction where necessary."
    - "Never infer deletion authority from missing legacy metadata."
    - "Produce a valid authoritySchemaVersion=2 durable document before normal writable-authority synchronization proceeds."
    - "Do not mark firstSyncCompleted merely because migration occurred; trustworthy baseline establishment remains its own gate."
    - "Add an end-to-end regression fixture matching the live legacy-state shape: non-empty BASE/mappings, completed historical operations, paired identities, firstSyncCompleted=false, then upgrade into current runtime without recovery dead-end or unsafe mutation."
    - "Preserve existing v1 -> v1.1 authority migration behavior and all frozen safety semantics."
  likely_owned_surfaces:
    - "src/state/persistent-state-store.ts"
    - "src/product/synchronization-adapters.ts"
    - "src/product/runtime.ts only if required for safe migration invocation/user-visible gating"
    - "targeted state/product integration tests"
  contracts_change_expected: false

