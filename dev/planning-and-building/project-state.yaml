    status: active_bvp_transition
    integration_branch: "phase6-integration"
    completion_gate: not_yet_satisfied

bvp_transition:
  bvp_s01_start_sha: "efb9a0bb88084d706dc535f2826e4df956cfd57d"
  branch: "phase6-integration"
  status: persisted_pending_local_verification
  legacy_architecture: superseded
  legacy_dev_material: "moved to dev/archive/legacy-validation-harness/**"
  next_session_after_s01_acceptance: "BVP-S02 — remove legacy executable harness and production coupling"
  hard_rule: "No replacement BVP implementation begins until BVP-S01 local archive/authority verification passes."

anti_drift:
  boundary_manifest: "dev/governance/testing-platform-boundary.yaml"
  enforcement_start: "BVP-S03 installs the architecture guard, metrics, and canonical verification foundation before substantive replacement-platform growth."
  no_github_actions: true
  local_verification: "Repository-controlled PowerShell under dev/scripts/; canonical evidence in dev/_ca-output.md."
  frozen_after_establishment:
    - architecture_boundary_manifest
    - architecture_guard
    - architecture_metrics
    - canonical_bvp_verifier
  approval_required_for:
    - new_runner_or_router_architecture
    - new_distributed_test_state_machine
    - new_coordination_or_persistence_architecture
    - complexity_budget_increase
    - production_test_seam_expansion_beyond_manifest

hard_boundaries:
  - "Do not redefine the BRAIN target system or frozen synchronization safety/authority contracts to simplify testing."
  - "Production src/** must not import test-platform/**."
  - "Ordinary production bundles must exclude BVP platform/scenario/live-agent code."
  - "Archived legacy harness material is not current authority."
  - "GitHub Actions must not be used for build/test/verification/evidence workflows."
  - "Do not begin Stage 3 while material Phase 6 evidence remains incomplete."

next_action:
  stage: "Stage 2A"
  phase: phase_6
  action: "Run the committed BVP-S01 local PowerShell verification/bootstrap. If it passes and evidence is committed to phase6-integration, expand and dispatch BVP-S02 against that exact verified repository state."
