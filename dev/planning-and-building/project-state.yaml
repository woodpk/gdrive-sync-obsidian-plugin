post_iphone_sync_performance_optimization:
  status: planned_not_implemented
  implementation_status: "NOT IMPLEMENTED — current synchronization remains correctness-first, highly serialized, and network-chatty."
  scheduling_gate: "Begin immediately after iPhone integration/setup is complete and the iPhone client is working correctly. This is the next planned engineering work before final Phase 6 closure and before Stage 3."
  objective: "Reduce unnecessary Google Drive API round trips, repeated local/remote validation work, and strictly serial transfer latency without weakening crash safety, stale-plan detection, provenance, integrity verification, recovery semantics, or mobile resource safety."
  planned_optimizations:
    - id: PERF-01
      plan: "Cache and reuse invariant Google account/pairing, managed-root, content-domain-root, and portable-config-domain-root validation within a synchronization run, with explicit invalidation/revalidation when relevant remote state can have changed."
    - id: PERF-02
      plan: "Cache Drive folder IDs, resolved logical paths, parent chains, and parent-folder lookup/creation results within a run so sibling files do not repeatedly walk and query the same remote directory hierarchy."
    - id: PERF-03
      plan: "Batch or consolidate Drive metadata/path queries where the Drive API permits, eliminating avoidable N+1 child lookups and repeated parent traversal."
    - id: PERF-04
      plan: "Use the Drive Changes API/change cursor and persistent sync journal/state as the ordinary steady-state discovery path, reserving full remote-tree reconciliation for required startup/recovery/integrity cases and configured/on-demand full verification."
    - id: PERF-05
      plan: "Reuse canonical local hash/content evidence when an unchanged stable observation token proves the cached evidence is still valid; avoid unnecessary rereads/rehashes while preserving required pre-transfer and post-transfer integrity checks."
    - id: PERF-06
      plan: "Remove or coalesce provably redundant duplicate precondition validation where a validated result can safely remain authoritative across the journal/mutation boundary; preserve stale-plan rejection whenever evidence may have changed."
    - id: PERF-07
      plan: "Pipeline independent metadata and transfer preparation work where safe while preserving per-operation crash-safe journaling, deterministic state commits, and cancellation semantics."
    - id: PERF-08
      plan: "Introduce bounded concurrency for independent non-destructive uploads/downloads instead of strictly serial file transfer, with configurable/platform-aware limits, Drive rate/quota backpressure, and tighter iOS resource limits. This must not permit overlapping whole synchronization runs."
  acceptance_constraints:
    - "No optimization may weaken canonical content verification, durable pending journaling, verified-success state commit, recovery-required behavior, or fail-closed uncertainty handling."
    - "Remote/account/root/path caches must have explicit invalidation boundaries and may not convert stale or uncertain observations into authority."
    - "Concurrency must be bounded, cancellation-safe, retry-safe, and compatible with Drive rate limiting and iOS memory constraints."
    - "Measure representative first-sync and steady-state wall-clock time, Drive API round trips, transfer throughput, and resource use before/after optimization using local diagnostic evidence only; no external telemetry is introduced."

