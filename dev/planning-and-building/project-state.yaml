controlled_clean_state_reset:
  status: authorized_current_action
  objective: "Remove only the obsolete persisted synchronization current-state authority record so release 0.1.8 initializes its current synchronization architecture from an uninitialized state, while preserving data.json, OAuth/secret-storage authentication, vault identity, device identity, remote-root pairing, user settings, diagnostics, and ordinary vault content."
  runtime_basis:
    state_database_name: "brain-google-drive-sync:<vaultIdentity>:<deviceIdentity>"
    object_store: "sync-state"
    active_state_key: "current-state"
    state_context_rule: "firstSyncCompleted=false AND recoveryInProgress=false => expectation=new-installation"
    current_live_evidence_meets_rule: true
  required_safety:
    - "Back up the existing IndexedDB current-state bytes before deletion without exposing their contents."
    - "Prefer one atomic IndexedDB read-write transaction that copies current-state to a uniquely named reset-backup key and deletes only current-state."
    - "Do not delete the IndexedDB database itself."
    - "Do not delete unrelated backup keys."
    - "Do not delete or edit data.json as part of the reset."
    - "Verify data.json is byte-for-byte unchanged across the reset while Obsidian/plugin persistence is quiescent."
    - "Do not clear Obsidian SecretStorage or OAuth tokens."
    - "Do not deauthorize Google Drive."
    - "Do not clear vaultIdentity, deviceIdentity, remoteRootId, oauthClientId, or oauthRedirectUri."
    - "Do not change ordinary BRAIN vault files as part of the reset."
    - "Leave the separately keyed text-version cache intact unless later evidence independently proves it causal; retained text is hash/size validated and is not the current blocker."
    - "After reset, reinitialize/reload the plugin and verify authentication/pairing continuity before any synchronization execution."
    - "Re-run P6-LIVE-A01 through P6-LIVE-A03. Continue the live campaign only if A03 no longer enters recovery-required and the preview is safe."

