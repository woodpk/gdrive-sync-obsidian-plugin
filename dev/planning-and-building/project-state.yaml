  current_scope: "The R4 Codex review accepted the controller-authority/generation model but found one remaining multi-device acquisition rollback race: per-device locks were released after each activation, allowing another same-run executor to reuse an earlier device before a failing acquisition rolled it back. R5 fixes exactly that defect by acquiring every required device lock first in deterministic order, mutating authority only after the full lock set is held, and performing any rollback while the full set remains locked. A later-device lock failure therefore cannot create or expose partial earlier-device authority. Focused S08E coverage also proves a failed multi-device attempt leaves the earlier device unactivated and that a successful same-run authority with a pending command still blocks a foreign run. PHX-CI remains pending and exclusive; S09 and Stage 3 remain prohibited."
  required_end_state: "One exact reviewed and PHX-CI-accepted BVP candidate is reconciled with the exact frozen current master; the exact merged candidate passes PHX-CI and is promoted to master under expected-SHA protection; durable closure/milestone/cleanup is complete; only then is S09 rebound to that exact master SHA."
