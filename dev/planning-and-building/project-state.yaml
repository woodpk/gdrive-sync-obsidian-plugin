phase_6_current_live_blocker:
  status: confirmed_blocking_product_defect
  test_id: "P6-LIVE-A03"
  title: "Clean uninitialized first-sync planning incorrectly enters recovery-required"
  live_observation: "After the controlled reset, diagnostics correctly report {status: uninitialized}. Re-enabling reaches idle-ready. Verify/Reconcile immediately changes to recovery-required without producing a plan."
  causal_repository_finding:
    - "PersistentSynchronizationStateStore.load() correctly returns uninitialized when StateLoadContext.expectation is new-installation and no state bytes exist."
    - "ProductController authorityLearningAssembler wraps normal assembly and unconditionally invokes recoverOutstandingDurableIntents before the base controller can plan."
    - "DurableEffectLifecycleCoordinator.loadAuthority() intentionally converts every non-trusted authority result, including uninitialized, into recovery-required."
    - "Therefore a legitimate clean first-sync state is routed through restart-recovery logic that presupposes existing durable authority."
    - "SynchronizationStateAuthorityAdapter.saveTrusted() already contains the intended current-architecture initialization path: when authority is uninitialized it creates and persists createInitialAuthorityState(...) with authoritySchemaVersion=2."
    - "ProductControllerBase.ensureTrustedState() invokes stateStore.saveTrusted(...) only at reviewed plan execution, so first-sync preview can remain non-mutating while execution establishes current authority."
  defect_scope: "current first-sync orchestration only; not legacy migration"
  required_repair:
    - "A genuinely uninitialized first-sync assembly must reach normal safe-union planning and preview without durable-intent recovery being treated as required."
    - "Do not create or write synchronization authority merely to display the preview."
    - "At reviewed execution, retain the existing adapter-mediated atomic initialization into current v1.1 authority before any authoritative mutation proceeds."
    - "Continue running durable-intent recovery before planning when current writable authority is trusted/existing; do not weaken restart recovery for an existing installation."
    - "Recovery-required/corrupt/missing-existing-state semantics remain fail-closed."
    - "Add a regression that begins with truly absent state bytes/new-installation and proves Verify/Reconcile produces a first-sync plan instead of recovery-required."
    - "Add/retain proof that first-sync preview itself does not persist state and that reviewed execution establishes current authority before physical mutation."
  likely_primary_file: "src/product/product-controller.ts"
  directly_related_files:
    - "src/product/operation-isolation.ts (behavioral dependency; change only if mechanically necessary)"
    - "src/product/product-controller-base.ts (execution initialization path; change only if mechanically necessary)"
    - "targeted product/integration tests"
  contracts_change_expected: false

