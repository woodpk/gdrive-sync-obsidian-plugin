    category: verification_execution
    supersedes: DEC-334
    decision: "GitHub Actions are prohibited for BVP verification. The canonical local CI/acceptance system is the installed PHX-CI deployed runtime selected by the consumer branch's exact phx-ci.json framework SHA. Authoritative verification uses the deployed PHX-CI operator front door and PHX-CI owns exact target/base/change-set resolution, detached verification worktrees, full test/build/repository/artifact gates, race protection, and canonical evidence publication. Historical PHX-CI run output MUST be stored under dev/test-results/<exact-runId>/ with result.md, result.json, terminal.log, and optional artifacts/. dev/_ca-output.md remains only the current coding-agent/work-unit evidence and handoff surface where required; it is not the historical run archive, and dev/_ca-output.json is not a standard root artifact. Project-specific guard/metrics logic remains repository-controlled and PHX-CI-consumed; task-specific independent verifier scripts are prohibited."


  - id: DEC-339
    status: locked
    category: remote_metadata_inventory_architecture
    decision: "BRAIN will evolve its existing device-local synchronization state into a compact, persistent, incrementally maintained metadata inventory for every in-scope vault file and folder, with stable Google Drive identities, parent relationships, relevant content/revision/provenance evidence, and explicit observation/coverage status. A verified baseline plus Google Drive Changes API observations maintain each device's own inventory. Inventory can optimize repeated discovery and support targeted verification but never independently authorizes destructive or uncertain mutation, replaces trustworthy BASE, or bypasses required precondition, uniqueness, managed-root, convergence, and recovery proofs. Missing, stale, partial, ambiguous or corrupt inventory fails closed and triggers scoped revalidation or full reconciliation. Google Drive names are not unique within a parent; pre-generated IDs protect retries but do not establish name/path uniqueness. Exact schema, IndexedDB/local storage choice, migrations and optimization mechanics require subsequent design and PHX-CI evidence. This is planning approval only, not implementation or S09A physical-mutation authorization."

  - id: DEC-340
    status: locked
    category: build_provenance_and_artifact_promotion
    decision: "The owner's updated shared operating protocol (sections 5.1, 21.2 and 22) distinguishes newly generated development artifact SHA-256 observations from separately approved release/promotion identities. For this bounded DEC-339 integration, explicit BRAIN_ARTIFACT_PURPOSE=development is permitted only in PHX-CI verification context with authorized-governance classification; development verification records the generated main.js SHA without comparing it against historical approved release digests. Promotion/default verification retains fail-closed exact-hash enforcement against the existing three owner-approved artifacts, which are not changed or expanded. All package identity, artifact presence/readability, architecture, shipping/test isolation, source/runtime provenance and PHX-CI gates remain applicable. An observed development hash is not release approval. This is a bounded implementation of the owner's express request to adopt the updated SHA policy, and does not authorize DEC-339 release, installation, activation, S09 physical execution, Stage 3, or master integration."

  - id: DEC-341
    status: locked
    category: owner_review_exception_and_risk_acceptance
    decision: "The owner explicitly accepts limited deferral of independent combined-integration finding DEC-340-01 (MAJOR): test-platform/src/repository-check.ts accepts caller-controlled development-mode flags and a structurally valid but unauthenticated verification-context JSON file, allowing a forged development-observation PASS for an unapproved main.js hash. This finding is CONFIRMED, NOT FIXED, and the independent combined review remains REJECT; neither the reviewer nor PHX-CI is represented as having approved the development-identity control. The owner accepts the bounded verification-integrity risk for preparation and consideration of a separate owner-controlled DEC-339 software master-promotion gate only. The exact combined source 5861b8b2861f9c38ea659be7c7cfcf78527da4d7 has genuine PHX-CI PASS run ad77ffcc-cf2b-4f99-8d08-97170bb0be2f with independent SUT review otherwise green; source/test changes are not authorized under this deferral. This decision waives the local requirement for unconditional independent combined-review APPROVE solely to PREPARE AND PRESENT Gate 4; it does NOT authorize a merge, approve a production artifact hash, substitute developer flags as evidence of approval, or authorize installation, release, live Drive/vault operations, DEC-339 activation, S09 physical completion, or Stage 3. Any subsequent merge requires a separate explicit owner decision with DEC-340-01 and the REVIEW REJECT status prominently disclosed. Artifact release/promotion requires its own exact-artifact approval and fail-closed SHA-256 enforcement; the previously approved hashes are unchanged. Track DEC-340-01 for remediation before relying on development-mode context as trusted approval evidence."

  - id: DEC-342
    status: locked
    category: owner_controlled_master_promotion
    decision: "The owner, after being told that independent combined DEC-339/DEC-340 review is REJECT solely because of the confirmed unfixed MAJOR test-infrastructure DEC-340-01 defect (with the actual DEC-339 system under test GREEN), separately and explicitly authorized merging draft PR #151 into master for SOFTWARE PROMOTION ONLY. On 2026-10-14 GitHub merged PR #151 using an ancestry-preserving merge commit 04a3976441be6309cf864c21870a27f1e77a07a9 with first parent 429c4b947a2ec6b50f4c25c1f363665125286f6e and second parent 8d35bb5d64c56626376fb1cc21f57c3a09f45fd6. Merge tree 7cbe765e710c8cde6936fea2432712b8ab102ef9 exactly matches the approved second-parent tree, with no merge-induced file modifications. Exact verified software remains source SHA 5861b8b2861f9c38ea659be7c7cfcf78527da4d7, source tree f062ce0606c042e3a9284f1a66582b0070bb453f, PHX-CI PASS run ad77ffcc-cf2b-4f99-8d08-97170bb0be2f, pinned runtime 69c4aa077d4a1a46d1e85e59f39d36285be99e83 and evidence commit 8491318b4e8d6901d810fa753be6dec16b8c8afb. DEC-341 risk deferral and independent review REJECT remain in force; no repair or independent review approval is claimed. Development artifact main.js SHA-256 57c33f8920fe6b46635e9ad01598f1ea06cd2477789ec4ec046e2be66997818c is OBSERVED ONLY, NOT APPROVED FOR RELEASE. This software code merge does not authorize installation, release, live synchronization, Drive/vault actions, DEC-339 inventory activation/cutover, S09 physical acceptance or Stage 3. Unresolved S09/data.json integrity and immutable artifact release approval are independent remaining gates; do not auto-activate or assume that code on master is safe to deploy."

  - id: DEC-343
    status: locked
    category: development_artifact_observation_scope
    amends: DEC-340
    decision: "Owner directed a bounded correction to the development-artifact verification gate during S09 G1 mitigation. For PHX-CI-coordinated DEVELOPMENT builds of ordinary code, explicit BRAIN_ARTIFACT_PURPOSE=development and structurally valid PHX_VERIFICATION_CONTEXT_PATH permit observing the actual main.js SHA-256 without comparison against historical release-approved digests. BVP_CHANGE_CLASS=ordinary remains ordinary and must enforce frozen-surface controls. authorized-governance is for explicitly approved frozen-surface changes, including this bounded supervisor-owned repository-check correction. Default/promotion modes retain exact historical SHA enforcement. Package identity, artifact presence/readability, guard/architecture budgets, full PHX-CI gates and real evidence remain required. This amends DEC-340's development change-class limitation ONLY; it neither repairs the separately deferred DEC-340-01 unauthenticated-context finding nor authorizes using fabricated standalone check output as PHX-CI evidence. No new production artifact is release-approved and no installation, activation, physical S09, live Drive/vault operation or Stage 3 is authorized. G1 correction plus this frozen check require new exact-source PHX-CI and independent review."


  - id: DEC-344
    status: locked
    category: owner_accepted_residual_verification_context_spoofing_risk
    relates_to: [DEC-340, DEC-341, DEC-342, DEC-343]
    decision: "On 2026-10-14, after review of the exact DEC-340-01 mechanism, the human software owner explicitly accepted the residual risk that an untrusted actor could supply forged verification-context data and flags to the standalone BVP repository check, producing a misleading local check PASS. This is a potential spoofing vulnerability, NOT evidence that any genuine PHX-CI run or SUT result was falsified. DEC-340-01 remains CONFIRMED and UNFIXED, but this specific risk is NON-BLOCKING for continued BRAIN software implementation, genuine PHX-CI verification, independent reassessment and consideration of separately owner-authorized SOFTWARE-ONLY integration, including the S09 G1 + DEC-343 candidate and its G1-01 corrective descendant. No immediate authenticated-context remediation is a prerequisite solely because of DEC-340-01. This prospective owner disposition supersedes the prior candidate-limited BLOCKING treatment of DEC-340-01 only; it does not rewrite DEC-341/DEC-342 history, erase an independent REJECT finding, authorize an untrusted or fabricated verification result, weaken any PHX-CI checks or frozen architecture guards, approve a new production artifact/hash, or itself approve a merge. Every newly changed SUT must receive its own genuine PHX-CI PASS, and any independent review must disclose the remaining risk, assess all other deficiencies, and keep its own honest verdict. A later merge requires separate owner authorization. Release, installation, activation, live Drive/vault operations, physical S09 acceptance, historical data.json loss/corruption investigation and Stage 3 remain independently blocked until their respective gates are satisfied."

  - id: DEC-345
    status: locked
    category: bvp_physical_phxci_fixed_runtime_integration_scope
    relates_to: [DEC-312, DEC-314, DEC-315, DEC-317, DEC-319, DEC-336, DEC-337, DEC-338]
    decision: "On 2026-10-20 the human Owner expressly prohibited ANY changes to the PHX-CI project/tool in the upcoming BRAIN BVP physical-testing integration: no modifications to woodpk/phx-ci source, scripts, schemas, taskfiles, runtime, releases, or to BRAIN's currently pinned phx-ci.json/PHX-CI integration settings. PHX-CI is an unchanged external verification tool, used solely through its existing approved runtime and interfaces. The BRAIN Builder owns all consumer-side integration architecture, code, tests, checkpoint/attempt transport and documentation inside woodpk/gdrive-sync-obsidian-plugin. The original BVP scenario/agent/runner/checkpoint/recovery engines must be reused; no competing validation authority, standalone BVP evidence publisher, GitHub Actions, PHX framework enhancement, alternative PHX pin or retired battery launcher may be created. The Owner delegated full detailed design, planning and BRAIN-side software construction under the existing build/PHX-CI/independent-review gates; this is not a claim that the proposed transport is already implemented, PHX-CI-qualified, independently accepted or authorized for physical execution. Any proven inability to meet required integrity/continuation behavior using fixed PHX-CI interfaces is BLOCKED and returned for a new Owner scope decision; agents must not silently change PHX-CI or weaken accepted protections. Existing WS-07 architecture budget/frozen guards, BVP S09G1 software closeout and handoff-count remain unchanged. Installation, physical Windows/iOS activity, personal vault/Drive operations, release, and Stage 3 remain separately gated."
  - id: DEC-346
    status: locked
    category: bvp_powershell_primary_interface
    relates_to: [DEC-314, DEC-317, DEC-336, DEC-337, DEC-338, DEC-345]
    decision: "On 2026-10-23 the Owner directed creation of the smallest maintainable repository-controlled PowerShell LIBRARY as the sole primary human/operator interface for running BVP. The library MUST discover, inventory, and expose EVERY currently available BVP API endpoint, command, operation, and supported argument/mode, including deterministic scenarios, simulated device operations, live/battery controls where applicable, results, diagnostics, evidence, checkpoints, and recovery; parity must be proven against the source-derived complete API inventory, with explicit unsupported classifications rather than silently missing functions. PowerShell is a thin typed adapter to existing BVP capabilities, not a second runner, independent correctness oracle, new transport, or scenario-specific verifier. It MUST standardize source/installed-artifact/version and device identity reconciliation, valid configuration, safety preflight, repeatable/idempotent operator entry, precise errors/exit codes, and secret-safe output to prevent previously observed version and routing mistakes. All substantive code resides in the repository and is available after local checkout/update; owner-facing launchers may remain short. For OPERATIONAL BVP TEST EXECUTION, invoke BVP directly and NEVER route it through PHX-CI; the existing Windows-only PHX-CI engineering build/change-verification gate, when otherwise required, remains distinct and is not an operator front door for BVP testing. This later explicit Owner decision takes precedence over conflicting earlier PHX-CI-as-BVP-runner instructions without authorizing a competing software build verification authority. Preserve existing frozen architecture and code/PowerShell budgets unless a separately documented Owner approval changes them."

  - id: DEC-347
    status: locked
    category: bvp_windows_first_simulated_device_testing
    relates_to: [DEC-312, DEC-313, DEC-314, DEC-315, DEC-316, DEC-345, DEC-346]
    decision: "On 2026-10-23 the Owner directed that ALL current BVP testing shall be run on Windows, exercising the Windows Obsidian product or the EXISTING BVP Windows-hosted iPhone/iPad simulation, as applicable. Every test/scenario that requires iPhone or iPad interaction MUST be connected to and executed through that existing simulator as the default target, with a complete inventory/coverage mapping and honest test capability classification; reuse the current deterministic virtual-world and existing runner/ports rather than building a competing simulator. A Windows simulation result must be labeled SIMULATED, never described as actual iOS hardware/OS evidence; unsupported device/OS-specific behavior remains explicitly unresolved rather than fabricating coverage or treating missing physical proof as PASS. Physical iPhone/iPad operation, Google Drive mailbox testing against real mobile devices, and physical S09 dispatch are DEFERRED; none may be pursued without a subsequent explicit Owner decision that physical equipment is genuinely necessary after feasible Windows simulation paths are exhausted. This supersedes earlier physical-first S09 operational priorities and any claim that hardware tests are mandatory prerequisites to begin the new Windows-first campaign; existing historical physical plans/evidence remain intact."

  - id: DEC-348
    status: locked
    category: bvp_error_reporting_diagnostics
    relates_to: [DEC-317, DEC-338, DEC-345, DEC-346, DEC-347]
    decision: "On 2026-10-23 the Owner required material improvement to BVP error communication and diagnostic reporting across deterministic simulation, Windows Obsidian/live interfaces, device command/relay/mailbox, scenario execution, runner entrypoints, and PowerShell interface. Every failed or blocked operation MUST provide a stable, meaningful reason/classification, the stage and last confirmed boundary, run/scenario/step/correlation identity, actionable operator guidance where known, whether effects or delivery are UNKNOWN, and a truthful exit/verdict; a generic unclassified-error is not an acceptable routine result. Preserve privacy by redacting secrets, vault content, raw device IDs, OAuth data and sensitive filesystem paths from shared/canonical evidence while retaining sufficient safely classified local diagnostics. Never infer a failed send or missing response merely from a generic controller exception, never turn lack of proof into PASS, and never automatically re-dispatch an uncertain effect. Build contract-driven fault injection/regression tests including early preflight, simulator, relay, mailbox, timeouts, malformed/correlation-mismatched receipts, and safe result persistence; keep existing BVP engines and architecture guards."


  - id: DEC-349
    status: locked
    category: owner_authorized_bvp_diagnostic_architecture_budget_amendment
    amends: [DEC-319, DEC-345]
    relates_to: [DEC-314, DEC-317, DEC-338, DEC-346, DEC-347, DEC-348]
    decision: "On 2026-10-23 the Owner explicitly selected OPTION 2, a controlled increase to the frozen BVP architecture code-size ceilings, to complete the DEC-348 diagnostic/error-communication upgrade while keeping clear maintainable code instead of artificial compression. This is explicit Owner authorization for a bounded authorized-governance amendment of dev/authority/governance/locks/testing-platform-boundary.yaml: framework-core maximum 4,000 -> 4,500 logical TypeScript source lines (+500; 12.5%), and live-device agent/relay maximum 750 -> 950 logical TypeScript source lines (+200; 26.7%). The original exact-source PHX-CI R1 measured 4,079 core / 778 live, so the increase provides 421 / 172 logical lines of additional space for still-required stage-aware instrumentation, redaction, and recovery diagnostics; remaining unused allowance is a ceiling, NOT a feature target. These two and ONLY these two budgets are amended. All other hard limits, source ownership rules, scenario/PowerShell budgets, private-data protections, architecture guard semantics, PHX-CI consumer pin, product source, and two-agent qualification/review requirements remain unchanged. Update the authoritative boundary manifest and corresponding architecture documentation/tests to enforce the new numerical limits, preserving the guard's strict PASS-within/FAIL-above behavior. Qualification of the frozen-manifest change MUST use BVP_CHANGE_CLASS=authorized-governance under real unchanged PHX-CI on Windows; do not represent an ordinary change as authorized governance absent this decision. No GitHub Actions, physical iPhone/iPad, live vault/Drive dispatch, verification bypass, reviewer acceptance, product installation, release, or merge is granted by this decision."

  - id: DEC-350
    status: locked
    category: bvp_existing_node_operator_runbook_and_session_continuity
    relates_to: [DEC-346, DEC-347, DEC-348, DEC-349]
    decision: "On 2026-10-24 the Owner accepted direct operation of BVP's existing TypeScript/compiled JavaScript interfaces through carefully reviewed PowerShell terminal commands instead of continuing construction of the speculative comprehensive PowerShell API/library merely to run BVP. The planned Bvp.psm1/Bvp.psd1 operator-library implementation is PAUSED and is not a prerequisite for using source-confirmed existing deterministic Node CLI batteries. Where a requested behavior has no real public CLI, the Builder must identify the exact gap and, only if needed, propose the smallest safe native TypeScript accessibility change under normal test-first PHX-CI software qualification; no PowerShell API clone, second BVP runner or unfounded public CLI flags. For reliable chat-session continuity, persist the canonical BVP operator procedure at dev/planning/03-verification/bvp-operator-runbook.md, source audit at dev/research/bvp-operator-api-audit-2026-10-24.md, require repository-root AGENTS.md to direct every authorized BVP Builder/operator session to freshly read both and verify current source, and place a pointer in dev/state/current-state.yaml and dev/scripts/README.md. Do NOT edit the shared external session-inits. The static initializer cannot itself ensure a repo file is read before a new session is grounded; explicitly ground AGENTS.md in each BRAIN assignment/handoff. This decision supersedes DEC-346's requirement to first implement a full PowerShell module as the primary human interface, but PRESERVES direct BVP operation, strict source/identity/preflight, privacy, safe diagnostics, simulated-versus-live honesty, all frozen architecture budgets, physical/Drive/vault prohibition and PHX-CI exclusivity for changed-software qualification and independent final review. This documentation/audit step creates no acceptance PASS or live operation permission."


  - id: DEC-351
    status: locked
    category: bvp_public_deterministic_scenario_id_cli
    relates_to: [DEC-311, DEC-313, DEC-314, DEC-315, DEC-346, DEC-347, DEC-348, DEC-349, DEC-350]
    decision: "On 2026-10-24 the Owner authorized planning and subsequent bounded Builder implementation of a PUBLIC direct BVP deterministic scenario-ID command-line interface, using the existing exported DeterministicScenarioRunner.canonical().run(scenario) without changing the underlying runner. The current method accepts a ScenarioDefinition object and is already public within TypeScript; the actual missing surface is a CLI that resolves exact stable IDs from a source-backed deterministic scenario catalog and passes the existing definition to the existing runner. Provide one compact general-purpose Node/TypeScript executable under test-platform/**, a complete static deterministic scenario-ID lookup with read-only discovery, strict required argument and mode validation, canonical BVP result/evidence/diagnostic/exit propagation and privacy-safe files/stdout; reject unknown, duplicate, malformed or live-only IDs without any scenario dispatch. Every existing and newly added deterministic scenario must be mapped and traced in tests, and an individual selected scenario must run without invoking unrelated scenarios. A small interface/catalog and tests are intended for one Builder coding session; actual PHX-CI code-change qualification and independent Reviewer acceptance are separate required gates. Existing Node battery CLI and test selection remain valid and must not regress. No second runner, scenario-specific PowerShell script, general plugin/module router, new production seam, new third-party simulator, physical/live dispatch, GitHub Actions, PHX-CI change, budget increase or weakening of frozen architecture guard is authorized. Keep Windows-first, simulated-versus-real-device distinctions and external third-party iPhone simulator integration questions separate and unresolved; current in-memory virtual devices do not prove an external iOS simulator is installed or integrated. This planning decision does not authorize an ungrounded executable prompt: immediately before coding the Builder must rebind exact fresh remote source SHA, current authorization, allowed writable paths and applicable fresh original operating protocol per root AGENTS.md. The durable task is dev/planning/02-workstreams/WS-07-brain-verification-platform/tasks/bvp-direct-scenario-id-cli-2026-10-24.md. No implementation or verification is claimed from the decision entry."


  - id: DEC-352
    status: locked
    category: bvp_device_runtime_error_observability
    relates_to: [DEC-316, DEC-345, DEC-347, DEC-348, DEC-349, DEC-350, DEC-351]
    decision: "On 2026-10-25 the Owner directed a bounded BVP validation-only error-observability repair before continued physical iPhone command testing. BVP command polling, active-run discovery, installed-build measurement, result publication, relay pumping and asynchronous handler failures must never be silently discarded. Persist privacy-safe structured error events on the originating device independently of Google Drive availability, coalesce repetitive identical failures with attempt counts, keep an observable failure/recovery boundary and retain pending reports across plugin restart; deliver pending error records via the EXISTING BVP Google Drive mailbox when possible and enable the Windows BVP relay to persist received diagnostic records without converting them to passing command results. Preserve existing diagnostic contract and command identity/sequence semantics; never use production BRAIN synchronization to transport BVP telemetry. When local persistence or remote delivery itself fails, surface a safe explicit fallback rather than claiming delivery or PASS. Do not log raw exception messages, URLs, credentials, content, device identities or filesystem paths. This authorizes planning, test-driven BVP-only implementation and local verification through unchanged PHX-CI, but does not itself approve unqualified binary installation, physical dispatch, product synchronization, release publication, promotion or Reviewer acceptance. New Windows installation / GitHub prerelease scripts must enforce exact source/build hashes, be owner-executed, and remain unusable for promotion until substantive PHX-CI PASS, independent final Reviewer acceptance and separate explicit Owner release authorization. All unchanged complexity budgets, frozen architecture guard, two-agent and no-GitHub-Actions requirements remain binding."


  - id: DEC-353
    status: locked
    category: bvp_dec352_owner_architecture_budget_amendment
    relates_to: [DEC-349, DEC-352]
    decision: "On 2026-10-25 the Owner authorized a read-only historical-run and unbound-device diagnostic extension to the existing authenticated BVP mailbox without historical command authority. The Owner separately approved increasing only the BVP framework-core logical TypeScript maximum from 4500 to 4550. Live-device agent/relay maximum remains 950. All other budgets and verification, safety and product boundaries remain unchanged. This decision does not authorize bypassing the architecture guard, software qualification, Reviewer acceptance, physical-device tests, live Drive/vault operations, merge or release."

  - id: DEC-354
    status: locked
    category: bvp_dec352_remote_diagnostic_verified_archival_retention
    relates_to: [DEC-352, DEC-353]
    decision: "On 2026-10-25 the Owner explicitly selected Option B for BVP validation-only remote diagnostic retention. Limit ACTIVE remote diagnostic history to 5000 records per device and a 90-day active-history window. For eligible acknowledged/resolved records, create durable archival evidence and verify its integrity before deleting the original ACTIVE record; never delete unresolved or unacknowledged diagnostic evidence. Fail closed, retain evidence and report an explicit unavailable condition when archival, integrity verification, acknowledgment or safe eligibility cannot be established. Archived evidence remains retrievable, privacy-safe and traceable to its originating run/device/event. Owner approval does not authorize deletion of unresolved records, physical-device/live personal Drive/vault operations, additional verification authority, architecture budget changes, production sync changes, merge or release. If limits cannot be enforced without losing protected evidence, preserve evidence and block new archival/retirement rather than silently discarding it."

  - id: DEC-355
    status: locked
    category: bvp_dec354_owner_architecture_budget_amendment
    relates_to: [DEC-349, DEC-352, DEC-353, DEC-354]
    decision: "On 2026-10-25 the Owner explicitly approved increasing BOTH frozen BVP TypeScript ceilings by 300 logical lines each for DEC-354 verified archival and diagnostic remote-retention implementation: framework-core from 4550 to 4850, and live-device agent/relay from 950 to 1250. This is additional headroom, not authorization to consume it gratuitously, relax the guard, weaken tests, alter shipping src, use GitHub Actions, change the PHX-CI runtime/pin, delete unresolved/unacknowledged evidence, deploy, invoke physical devices or live personal Google Drive/vault, merge or release. The same authoritative metrics guard and exact at-limit and one-line-over rejection tests must use the amended 4850/1250 ceilings. Corrections remain unqualified until a fresh exact-source Windows PHX-CI PASS and independent final Reviewer acceptance."


  - id: DEC-356
    status: locked
    category: bvp_dec354_event_resolution_and_serialized_admission
    relates_to: [DEC-352, DEC-354, DEC-355]
    decision: "On 2026-10-25 the Owner expressly approved the bounded DEC-354 R4 correction design: (1) only an explicitly authorized Windows BVP controller/operator may attest an exact diagnostic event acknowledged or resolved, with proof bound to immutable originating device/run/event and diagnostic content hash; mere inbox observation, diagnostic delivery or archive-copy success is never acknowledgment; (2) after independently verifying this event-specific attestation and archive integrity, retirement may reclassify the original ACTIVE record as non-ACTIVE while preserving its original bytes and recoverable archival evidence; missing, forged, mismatched, ambiguous or stale proof must leave unresolved/unacknowledged ACTIVE evidence protected; (3) ACTIVE admission is owned by one authoritative serialized Windows controller, not independently by competing device publishers; device reporters retain pending diagnostics until authorized admission, and duplicate/unknown controller ownership or uncertain global capacity fails closed; (4) preserve immutable architecture ceilings 4850 framework-core / 1250 live agent-and-relay, pinned PHX-CI runtime, validation-only BVP, and all DEC-352/354/355 physical, shipping, merge, installation, publication and release prohibitions. Build adversarial transition, forged-proof, failure/recovery and two-publisher boundary tests first; use only existing authenticated BVP transport and unchanged PHX-CI software qualification. This approval does not itself prove Google Drive offers an atomic count/lease primitive, does not permit a self-asserted acknowledgment or unsafe deletion, and does not authorize any execution outside existing software-only constraints."

