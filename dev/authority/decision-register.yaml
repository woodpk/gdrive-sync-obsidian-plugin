  - id: DEC-046
    status: locked
    category: sync_initiation
    decision: "Startup, local-change, and periodic automatic-sync controls are independently configurable per device."
  - id: DEC-047
    status: locked
    category: sync_initiation
    decision: "Automatic sync remains disabled during initial setup until the first preview is reviewed and the first synchronization completes successfully."
  - id: DEC-048
    status: locked
    category: mobile_behavior
    decision: "Do not promise true background synchronization on iOS; sync on startup/resume and while Obsidian is active, and safely resume/defer after suspension."
  - id: DEC-049
    status: locked
    category: mobile_behavior
    decision: "Mobile cellular-data behavior is configurable per device, including a Wi-Fi-only option for automatic sync and large transfers."
  - id: DEC-050
    status: locked
    category: sync_controls
    decision: "Provide explicit per-device pause/resume of remote synchronization without impairing local vault use."
  - id: DEC-051
    status: locked
    category: sync_execution
    decision: "Debounce and coalesce bursts of local filesystem events instead of launching a sync for every event or keystroke."
  - id: DEC-052
    status: locked
    category: sync_execution
    decision: "Never allow overlapping sync runs on the same device; serialize execution and coalesce additional triggers into a later run."
  - id: DEC-053
    status: locked
    category: sync_execution
    decision: "Prevent multiple local plugin instances from concurrently manipulating the same vault sync state through a vault-level coordination/lease mechanism."
  - id: DEC-054
    status: locked
    category: sync_execution
    decision: "Startup reconciliation waits until Obsidian has sufficiently initialized the vault and configuration; never reconcile against partial startup state."

  - id: DEC-060
    status: locked
    category: first_sync
    decision: "First synchronization uses a safe-union initialization policy."
  - id: DEC-061
    status: locked
    category: first_sync
    decision: "On first sync, content present on only one side is copied to the missing side; identical content is a no-op; divergent same-path content is preserved and surfaced rather than silently overwritten."
  - id: DEC-062
    status: locked
    category: first_sync
    decision: "No deletion propagation is permitted until a trustworthy synchronization base exists; an empty side must never erase a populated side merely because initialization state is absent."
  - id: DEC-063
    status: locked
    category: onboarding
    decision: "Initial setup is guided and explicit: Google auth, remote creation/pairing, vault identity confirmation, exclusions, and first-sync preview occur before automatic sync."
  - id: DEC-064
    status: locked
    category: pairing
    decision: "Pairing to an existing remote requires explicit validated pairing; never adopt an arbitrary similarly named Drive folder automatically."
  - id: DEC-065
    status: locked
    category: identity
    decision: "Assign BRAIN a stable synchronization identity so the wrong local vault cannot be paired silently with the remote BRAIN tree."
  - id: DEC-066
    status: locked
    category: identity
    decision: "Assign each plugin installation a stable random device ID for conflict provenance, audit history, and diagnostics; do not use hardware fingerprinting."
  - id: DEC-067
    status: locked
    category: identity
    decision: "Support explicit device removal/deauthorization without deleting shared vault data or disrupting other devices."
  - id: DEC-068
    status: locked
    category: identity
    decision: "Detect restored/cloned installations conservatively so copied device identity or stale sync state cannot silently impersonate the original device."
  - id: DEC-069
    status: locked
    category: authentication
    decision: "Changing Google accounts requires explicit re-pairing and must not silently reuse prior account remote identity/state."
  - id: DEC-070
    status: locked
    category: lifecycle
    decision: "Disabling or uninstalling the plugin must never automatically delete local vault content, remote sync data, or recovery state."

  - id: DEC-080
    status: locked
    category: remote_structure
    decision: "Use a dedicated plugin-created BRAIN Sync folder/tree in the user's Google Drive, clearly separated from the existing BRAIN asset repository."
  - id: DEC-081
    status: locked
    category: remote_structure
    decision: "The Google Drive sync-remote area is plugin-managed infrastructure, not a general user-editable working copy; direct manual editing is not a supported normal workflow."
  - id: DEC-082
    status: locked
    category: remote_structure
    decision: "Unexpected external modifications to sync-remote data must be reconciled conservatively and surfaced when suspicious, not casually assumed valid."
  - id: DEC-083
    status: locked
    category: remote_detection
    decision: "Use Google Drive Changes API for incremental remote change detection after the initial baseline."
  - id: DEC-084
    status: locked
    category: remote_detection
    decision: "Supplement incremental change tracking with periodic full reconciliation/integrity checks instead of repeatedly enumerating the entire remote tree during ordinary operation."
  - id: DEC-085
    status: locked
    category: verification
    decision: "Provide an on-demand full Verify/Reconcile Vault operation independent of incremental change tracking."
  - id: DEC-086
    status: locked
    category: verification
    decision: "Periodic full reconciliation cadence is configurable with a conservative default."
  - id: DEC-087
    status: locked
    category: remote_structure
    decision: "Version the remote synchronization structure/schema explicitly; upgrades must be controlled and backward-aware."
  - id: DEC-088
    status: locked
    category: recovery
    decision: "If the remote BRAIN Sync folder is missing or deleted, treat it as a critical recovery condition; do not silently recreate/repopulate it, and require explicit recovery/re-pairing."
  - id: DEC-089
    status: locked
    category: recovery
    decision: "If remote synchronization state is lost, rebuild conservatively from local and Drive reality and suspend destructive propagation until a trustworthy baseline is reconstructed and previewed."
  - id: DEC-090
    status: locked
    category: recovery
    decision: "If remote identity/path mapping becomes duplicated or ambiguous, preserve data and block ambiguous operations rather than guessing."
  - id: DEC-091
    status: locked
    category: recovery
    decision: "Google Drive version/trash history is an additional recovery layer, not the primary correctness mechanism."

  - id: DEC-100
    status: locked
    category: oauth
    decision: "Use Google's least-privilege drive.file authorization model as the required baseline."
  - id: DEC-101
    status: locked
    category: oauth
    decision: "Do not broaden Google Drive scope merely for convenience; any proven need for broader access is a product-level reconsideration requiring explicit user approval."
  - id: DEC-102
    status: locked
    category: oauth
    decision: "Use the user's own Google Cloud project/OAuth client; do not depend on developer-owned OAuth credentials/infrastructure for this private plugin."
  - id: DEC-103
    status: locked
    category: oauth
    decision: "Every supported device, including iPhone, must be able to authenticate independently using only that device."
  - id: DEC-104
    status: locked
    category: oauth
    decision: "Desktop-assisted token transfer is not permitted as a required mobile authentication flow."
  - id: DEC-105
    status: locked
    category: oauth
    decision: "Prefer direct on-device/system-browser OAuth with no hosted callback if technically feasible in Obsidian."
  - id: DEC-106
    status: locked
    category: oauth
    decision: "If a hosted OAuth callback/bridge is required, use Azure Static Web Apps Free as the preferred hosting platform; the callback is authentication infrastructure only, not synchronization infrastructure."
  - id: DEC-107
    status: locked
    category: oauth
    decision: "A hosted callback must not handle vault data and should avoid server-side token persistence unless a later proven requirement makes it necessary."
  - id: DEC-108
    status: locked
    category: oauth
    decision: "Authentication tokens/credentials are device-local and never synchronized; use the strongest storage mechanism available on each supported platform."
  - id: DEC-109
    status: locked
    category: oauth
    decision: "On authentication failure/revocation, fail closed for remote operations while preserving local use; surface reauthentication clearly and validate sync state before destructive reconciliation resumes."

  - id: DEC-120
    status: locked
    category: sync_state
    decision: "Maintain persistent synchronization base/state sufficient to distinguish never-seen content from intentional deletion and to remember previously agreed state."
  - id: DEC-121
    status: locked
    category: change_detection
    decision: "Timestamps are never authoritative change truth; use sync state, stable file identity, hashes/content evidence, and Drive metadata, with timestamps advisory only."
  - id: DEC-122
    status: locked
    category: interruption_safety
    decision: "Synchronization operations must be idempotent or safely retryable."
  - id: DEC-123
    status: locked
    category: interruption_safety
    decision: "Persistent sync state must never claim an operation succeeded until the underlying change is durably complete."
  - id: DEC-124
    status: locked
    category: interruption_safety
    decision: "Interrupted runs must resume or safely recompute without losing or unintentionally duplicating data."
  - id: DEC-125
    status: locked
    category: interruption_safety
    decision: "Partially completed runs must preserve enough information to distinguish completed, pending, and uncertain operations."
  - id: DEC-126
    status: locked
    category: recovery
    decision: "Detect missing, malformed, inconsistent, or otherwise untrusted sync state and enter safe recovery mode."
  - id: DEC-127
    status: locked
    category: recovery
    decision: "Untrusted sync state must never be interpreted as evidence of deletion; destructive propagation pauses while state is rebuilt/reconciled."
  - id: DEC-128
    status: locked
    category: recovery
    decision: "Ambiguous recovery cases are surfaced rather than guessed."
  - id: DEC-129
    status: locked
    category: sync_state
    decision: "Keep authoritative per-device sync state outside ordinary user-editable vault content where practical, with explicit backup/migration support."
  - id: DEC-130
    status: locked
    category: sync_state
    decision: "Sync-state migrations may run automatically only when provably safe; checkpoint/back up prior state first and refuse unsafe upgrade/downgrade paths."
  - id: DEC-131
    status: locked
    category: compatibility
    decision: "Incompatible plugin/sync-protocol versions block affected synchronization rather than risking shared-state corruption."
  - id: DEC-132
    status: locked
    category: sync_state
    decision: "Provide explicit backup/export capability for synchronization metadata and diagnostics sufficient for recovery/troubleshooting without exposing credentials."
  - id: DEC-133
    status: locked
    category: deletion_state
    decision: "Retain deletion/tombstone history for a bounded period sufficient to distinguish legitimate deletion from stale-device reintroduction."
  - id: DEC-134
    status: locked
    category: deletion_state
    decision: "Tombstone retention duration is conservatively configurable and must not expire while a known device is still too stale to reconcile safely."
  - id: DEC-135
    status: locked
    category: recovery
    decision: "A device returning after a long offline interval must reconcile before its stale state can authorize destructive propagation."
  - id: DEC-136
    status: locked
    category: transfer_safety
    decision: "If a local file changes during transfer, invalidate the stale transfer; do not mark it synchronized, and recompute/retry safely."
  - id: DEC-137
    status: locked
    category: sync_execution
    decision: "Remote changes detected during an active sync invalidate and re-plan affected operations rather than allowing stale-plan execution."
  - id: DEC-138
    status: locked
    category: sync_execution
    decision: "Local changes occurring during an active sync are reconciled in a subsequent pass rather than unpredictably mutating the executing plan."
  - id: DEC-139
    status: locked
    category: change_detection
    decision: "Device clock skew cannot affect correctness; timestamps remain advisory metadata only."

  - id: DEC-150
    status: locked
    category: conflicts
    decision: "For safely recognized text files changed on both sides from the same base, use BASE + LOCAL + REMOTE three-way merge."
  - id: DEC-151
    status: locked
    category: conflicts
    decision: "If a three-way merge is clean, accept the merged result."
  - id: DEC-152
    status: locked
    category: conflicts
    decision: "If a true or ambiguous text conflict remains, preserve both versions and surface the conflict."
  - id: DEC-153
    status: locked
    category: conflicts
    decision: "Never use newest-timestamp-wins for concurrent text changes."
  - id: DEC-154
    status: locked
    category: conflicts
    decision: "Three-way merge applies to safely recognized plain-text formats such as .md and .txt; unknown/binary formats are handled conservatively."
  - id: DEC-155
    status: locked
    category: conflicts
    decision: "If the same binary or opaque vault file is independently modified on multiple devices, preserve both versions and surface the conflict; never automatically choose one."
  - id: DEC-156
    status: locked
    category: conflicts
    decision: "In deletion-vs-modification conflict, preserve the modified version and surface the conflict; a concurrent delete must never silently erase independently modified content."
  - id: DEC-157
    status: locked
    category: conflicts
    decision: "Unresolved conflicts block only affected paths while unrelated safe synchronization continues, unless overall system/state integrity is uncertain."
  - id: DEC-158
    status: locked
    category: conflicts
    decision: "Conflict copies are placed predictably near the original file with deterministic naming including device/source and timestamp, and are listed in the conflict UI."
  - id: DEC-159
    status: locked
    category: conflicts
    decision: "Preserved conflict copies are never automatically deleted."
  - id: DEC-160
    status: locked
    category: conflicts
    decision: "Conflict UI exposes explicit actions appropriate to the conflict: keep local, keep remote, keep both, accept clean merge, or manually resolve."
  - id: DEC-161
    status: locked
    category: conflicts
    decision: "An explicit user conflict resolution becomes new authoritative vault content and propagates normally to all devices."
  - id: DEC-162
    status: locked
    category: files
    decision: "Unknown or unsupported file types synchronize conservatively as opaque binary data; do not reject or reinterpret a file merely because its format is unknown."

  - id: DEC-170
    status: locked
    category: rename_move
    decision: "Treat renames/moves as identity-preserving operations wherever safely possible."
  - id: DEC-171
    status: locked
    category: rename_move
    decision: "Preserve Google Drive file IDs and remote object history across renames/moves where possible; avoid delete/recreate semantics unless no safe alternative exists."
  - id: DEC-172
    status: locked
    category: rename_move
    decision: "Use synchronization/path/history evidence to distinguish rename/move from delete-plus-create."
  - id: DEC-173
    status: locked
    category: vault_scope
    decision: "Sync the entire vault by default except explicit exclusions and protected or device-specific .obsidian content."
  - id: DEC-174
    status: locked
    category: filesystem
    decision: "Preserve empty directories as part of synchronized vault structure."
  - id: DEC-175
    status: locked
    category: filesystem
    decision: "Hidden/dotfiles synchronize by default unless explicitly excluded."
  - id: DEC-176
    status: locked
    category: exclusions
    decision: "Support explicit path/pattern exclusions with conservative defaults; exclusions are visible/configurable and never silently applied."
  - id: DEC-177
    status: locked
    category: exclusions
    decision: "Exclude known non-vault noise by default, including .git, OS metadata, lock/temp files, and plugin caches; make defaults visible and safely overridable."
  - id: DEC-178
    status: locked
    category: filesystem
    decision: "Do not follow or synchronize symlink, junction, or external filesystem-reference targets; surface them rather than allowing synchronization to escape the vault boundary."
  - id: DEC-179
    status: locked
    category: paths
    decision: "Normalize Unicode/path representations for comparison while preserving original names when safe; Unicode-equivalent or platform-incompatible names become conflicts rather than duplicate logical paths."
  - id: DEC-180
    status: locked
    category: paths
    decision: "Detect unsafe Windows/iOS case/path collisions and block only affected operations rather than silently normalizing or overwriting."
  - id: DEC-181
    status: locked
    category: paths
    decision: "Preflight path-length and filename compatibility before execution; invalid/unsafe paths block only affected operations."
  - id: DEC-182
    status: locked
    category: filesystem
    decision: "Synchronize file content, names, paths, and necessary identity/timestamp metadata, but not OS-specific ACLs, permissions, or extended attributes."
  - id: DEC-183
    status: locked
    category: filesystem
    decision: "Do not automatically deduplicate separately named or path-addressed user files merely because their bytes are identical."
  - id: DEC-184
    status: locked
    category: transfer_safety
    decision: "Wait for files to become stable before transfer; avoid synchronizing transient intermediate states while Obsidian or another process is still writing."
  - id: DEC-185
    status: locked
    category: large_files
    decision: "Support large files using bounded/streamed processing and configurable safeguards rather than an arbitrary small file-size limit."
  - id: DEC-186
    status: locked
    category: transfer_safety
    decision: "Use atomic local writes/replacements wherever possible; never expose a partial download/rewrite as valid vault content."
  - id: DEC-187
    status: locked
    category: resource_failures
    decision: "On local disk-space exhaustion, preserve existing valid data, stop affected downloads/writes, and surface an actionable error; never partially replace a valid file."
  - id: DEC-188
    status: locked
    category: error_isolation
    decision: "Isolate repeatedly failing individual paths and continue unrelated safe work rather than allowing one bad file to halt the entire vault permanently."

  - id: DEC-200
    status: locked
    category: deletion
    decision: "Normal deletion semantics are recoverable by default: use Obsidian/local trash and Google Drive trash where feasible rather than immediate hard deletion."
  - id: DEC-201
    status: locked
    category: deletion
    decision: "Ordinary low-risk deletions propagate automatically without per-item confirmation."
  - id: DEC-202
    status: locked
    category: deletion
    decision: "Never automatically empty Google Drive trash; permanent purge is outside ordinary synchronization."
  - id: DEC-203
    status: locked
    category: deletion
    decision: "Never automatically purge local trash/recovery copies; Obsidian, OS, or user retention policy governs permanent removal."
  - id: DEC-204
    status: locked
    category: destructive_safety
    decision: "Include a mass-deletion/destructive-operation circuit breaker."
  - id: DEC-205
    status: locked
    category: destructive_safety
    decision: "Before unusually large or suspicious destructive plans execute automatically, halt and require explicit user review/approval."
  - id: DEC-206
    status: locked
    category: destructive_safety
    decision: "Circuit-breaker detection considers percentage of vault affected, absolute destructive-operation count, abnormal divergence from normal behavior, and synchronization-state integrity/rebuild conditions."
  - id: DEC-207
    status: deferred_engineering
    category: destructive_safety
    decision: "Exact circuit-breaker thresholds and policy parameters will be specified/tested later; existence and protective intent are fixed."
  - id: DEC-208
    status: locked
    category: destructive_safety
    decision: "Unusually destructive operations must have a practical recoverable checkpoint in addition to trash and the circuit breaker."
  - id: DEC-209
    status: locked
    category: destructive_safety
    decision: "Do not provide a global destructive force-sync command that casually bypasses core deletion, conflict, or integrity safeguards."

