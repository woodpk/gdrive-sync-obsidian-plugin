schema_version: 2
status: authoritative_frozen_after_bvp_s01_persistence
name: BRAIN Verification Platform architecture boundary

roots:
  production:
    - src/
  test_platform: test-platform/
  active_dev: dev/
  archive: archive/

import_rules:
  production_must_not_import:
    - test-platform/
  test_platform_may_import_production_only_through_allowlist: true
  scenario_specific_production_code_allowed: false

shipping_rules:
  production_bundle_must_exclude:
    - test-platform/
  production_validation_ui_allowed: false
  validation_device_agent_must_be_separate_artifact_or_entrypoint: true

production_seam:
  allowlist_required: true
  approved_imports:
    - src/product/local-vault-boundary-seam.ts
    - src/product/run-receipt-seam.ts
    - src/product/live-validation-control-seam.ts
  max_logical_loc: 350
  max_files: 4
  may_expose:
    - frozen production boundary contracts and pure deterministic policy helpers explicitly enumerated in approved_imports for virtual-world adapter fidelity
    - read-only production run/result receipt
    - bounded invocation of already-authorized production actions for validation build composition
  must_not_expose:
    - scenario orchestration
    - test persistence
    - cross-device coordination
    - evidence aggregation
    - alternate synchronization policy
    - test-only production mutation bypass

complexity_budgets:
  test_platform_framework_core_logical_ts_loc_max: 4000
  live_device_agent_logical_ts_loc_max: 750
  ordinary_scenario_logical_loc_target: 120
  ordinary_scenario_logical_loc_hard_max: 200
  scenario_specific_powershell_scripts_max: 0
  bvp_powershell_scripts_max: 4
  bvp_powershell_combined_logical_loc_max: 1500
  scenario_specific_production_files_max: 0
  tests_loc_budget: null

forbidden_without_explicit_architecture_approval:
  - second_general_scenario_runner
  - durable_distributed_scenario_state_machine
  - platform_module_router_or_plugin_system
  - second_cross_device_coordination_protocol
  - second_evidence_schema_family
  - general_test_persistence_subsystem
  - alternate_synchronization_engine
  - new_production_testing_bypass
  - complexity_budget_increase
  - architecture_guard_weakening

normal_scenario_change_surface:
  allowed:
    - test-platform/scenarios/**
    - test-platform/fixtures/**
    - test-platform/test/**
  core_change_requires_supervisor_architecture_review: true

supervisor_owned_frozen_surfaces:
  - dev/authority/governance/locks/testing-platform-boundary.yaml
  - dev/scripts/Test-TestingArchitectureGuard.ps1
  - dev/scripts/Get-TestingArchitectureMetrics.ps1
  - phx-ci.json
  - Taskfile.phx-ci.yml
  - test-platform/src/repository-check.ts
  - src/product/local-vault-boundary-seam.ts
  - bounded PHX-CI include block in Taskfile.yml

dispatch_policy:
  preplanned_prompt_executable_without_supervisor_rebind: false
  exact_predecessor_sha_required: true
  exact_writable_path_allowlist_required: true
  worker_may_expand_scope: false
  worker_may_reclassify_files: false
  unexpected_out_of_scope_dependency_result: BLOCKED
  new_platform_contract_families_per_child_session_max: 1
  substantive_non_test_files_split_threshold: 6
  net_new_non_test_loc_split_threshold: 1000
  split_threshold_exemptions:
    - mechanical deletion or move work
    - declarative scenario batches

archive_policy:
  archive_is_non_authoritative: true
  exclude_from_normal_grounding: true
  active_docs_must_not_depend_on_archived_prompts: true

verification:
  github_actions_allowed: false
  canonical_system: PHX-CI
  consumer_pin_file: phx-ci.json
  deployed_runtime_root: "%LOCALAPPDATA%/PHX-CI/runtimes/<framework.sha>/"
  operator_entrypoint: scripts/Invoke-PhxCi.ps1
  task_branch_acceptance_publication_mode: push
  canonical_evidence: dev/_ca-output.md
  structured_evidence: dev/Test-Results/<runId>/result.json
  evidence_history: dev/Test-Results/
  architecture_guard_required_every_session_after_bvp_s03: true
  metrics_required_every_session_after_bvp_s03: true
  primary_stage_phx_ci_gate_required: true
  supervisor_architecture_review_after_max_implementation_sessions: 2