name: foundation-v1-3-t3-builder

on:
  push:
    branches:
      - foundation-v1-3-t3-builder

permissions:
  contents: write

jobs:
  append-evidence-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase6-sync-foundation-v1.3-failure-provenance
          fetch-depth: 0
      - name: Append T3 evidence closure only
        shell: bash
        run: bash <(git show origin/foundation-v1-3-t3-builder:dev/agents/foundation-v1-3-t3-evidence-builder.sh)
