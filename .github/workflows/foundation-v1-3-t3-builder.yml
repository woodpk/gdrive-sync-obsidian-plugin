  const result: ExecutionResultV1_3 = { status: "retryable-failure", reason: "verified rejection", operationalFailure: { kind: "transient-failure", source: "google-drive" }, retrySafety: { status: "verified-no-unresolved-effect", basis: "verified-not-applied", verificationEvidenceRef: "proof-1" } };
  assert.deepEqual(executionDispositionV1_3(result), { primary: "deferred", physicalReconciliationRequired: false, physicalRedispatchSafe: true, retryMode: "ordinary-retry", mutationRedispatchAuthorized: false });
});

test("foundation v1.3 T3 C9: safe rate limit preserves exact timing while remaining deferred", () => {
  const result: ExecutionResultV1_3 = { status: "retryable-failure", reason: "429 verified not applied", operationalFailure: { kind: "rate-limited", source: "google-drive", retryAfterMs: 5000 }, retrySafety: { status: "verified-no-unresolved-effect", basis: "verified-not-applied" } };
  assert.equal("retryAfterMs" in result, false);
  assert.deepEqual(executionDispositionV1_3(result), { primary: "deferred", physicalReconciliationRequired: false, physicalRedispatchSafe: true, retryMode: "ordinary-retry", retryAfterMs: 5000, mutationRedispatchAuthorized: false });
});

test("foundation v1.3 T3 C10: uncertain transient/rate-limit never gain physical safety or redispatch authority", () => {
  const transient = executionDispositionV1_3({ status: "uncertain", reason: "unknown", operationalFailure: { kind: "transient-failure", source: "google-drive" } });
  const rate = executionDispositionV1_3({ status: "uncertain", reason: "unknown", operationalFailure: { kind: "rate-limited", source: "google-drive", retryAfterMs: 5000 } });
  assert.equal(transient.physicalReconciliationRequired, true);
  assert.equal(transient.physicalRedispatchSafe, false);
  assert.equal(transient.mutationRedispatchAuthorized, false);
  assert.equal(rate.physicalReconciliationRequired, true);
  assert.equal(rate.physicalRedispatchSafe, false);
  assert.equal(rate.retryAfterMs, 5000);
  assert.equal(rate.mutationRedispatchAuthorized, false);
});

test("foundation v1.3 T3 C11: recovery-required physical state cannot be erased by operational metadata", () => {
  const disposition = executionDispositionV1_3({ status: "recovery-required", reason: "durable physical recovery required", operationalFailure: { kind: "recovery-required", source: "google-drive", detail: "cursor invalid" } });
  assert.deepEqual(disposition, { primary: "recovery-required", physicalReconciliationRequired: true, physicalRedispatchSafe: false, retryMode: "reconcile-before-redispatch", mutationRedispatchAuthorized: false });
});

test("foundation v1.3 T3 C12: predecessor approved contract/document bytes remain exact immutable prefixes", () => {
  for (const [file, predecessorSize, predecessorBlobSha] of predecessorPrefixes) {
    const current = readFileSync(file);
    assert.ok(current.length > predecessorSize, `${file} must append successor material`);
    assert.equal(gitBlobSha1(current.subarray(0, predecessorSize)), predecessorBlobSha, `${file} predecessor prefix changed`);
  }
  assert.equal(gitBlobSha1(readFileSync("src/contracts/synchronization-foundation.ts")), "fde30f9ed2b13b878476759c3c0f4d7ddbbc5af6");
});

test("foundation v1.3 T3 C13: documentation successor begins after predecessor byte boundaries", () => {
  const freeze = readFileSync("dev/planning-and-building/phase6-sync-contract-freeze.md");
  const architecture = readFileSync("dev/planning-and-building/phase6-sync-architecture-foundation.md");
