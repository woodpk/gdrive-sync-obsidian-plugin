/** V1.3 operational provenance types used by successor mutation/execution seams. */
type OperationalFailureProvenanceV1_3 = import("./common").OperationalFailureProvenanceV1_3;
export type AuthenticationOperationalFailureV1_3 = Extract<OperationalFailureProvenanceV1_3, { readonly kind: "authentication-required" }>;
export type RetryableOperationalFailureV1_3 = Extract<OperationalFailureProvenanceV1_3, { readonly kind: "transient-failure" | "rate-limited" }>;
export type BlockingOperationalFailureV1_3 = Extract<OperationalFailureProvenanceV1_3, { readonly kind: "permission-denied" | "quota-exhausted" }>;
export type RecoveryOperationalFailureV1_3 = Extract<OperationalFailureProvenanceV1_3, { readonly kind: "recovery-required" | "unclassified" }>;

/** Physical proof that no unresolved may-have-dispatched effect exists. */
export type RetrySafePhysicalAuthorityV1_3 =
  | { readonly status: "verified-no-unresolved-effect"; readonly basis: "pre-dispatch-rejection" }
  | { readonly status: "verified-no-unresolved-effect"; readonly basis: "verified-not-applied"; readonly verificationEvidenceRef?: string };

/** V1.3 successor preserves predecessor physical distinctions and adds provenance only where defined. */
export type RemoteMutationOutcomeV1_3 =
  | Extract<import("./synchronization-foundation").RemoteMutationOutcome, { readonly status: "verified-effect" }>
  | Extract<import("./synchronization-foundation").RemoteMutationOutcome, { readonly status: "conflict-preserved" }>
  | { readonly status: "verified-not-applied"; readonly reason: string; readonly operationalFailure?: OperationalFailureProvenanceV1_3 }
  | { readonly status: "outcome-unknown"; readonly reason: string; readonly operationalFailure?: OperationalFailureProvenanceV1_3 };

export interface ReliableRemoteMutationPortV1_3 {
  reserveFileCreateIdentity(root: import("./google-drive").ManagedRemoteIdentity, intentId: import("./common").MutationIntentId, path: import("./common").VaultPath, intendedContent: import("./synchronization-foundation").CanonicalFileContentProof): Promise<import("./google-drive").DriveResult<Extract<import("./synchronization-foundation").RemoteMutationIdentity, { readonly kind: "reserved-file-create" }>>>;
  reserveFolderCreateIdentity(root: import("./google-drive").ManagedRemoteIdentity, intentId: import("./common").MutationIntentId, path: import("./common").VaultPath): Promise<import("./google-drive").DriveResult<Extract<import("./synchronization-foundation").RemoteMutationIdentity, { readonly kind: "reserved-folder-create" }>>>;
  createReserved(identity: Extract<import("./synchronization-foundation").RemoteMutationIdentity, { readonly kind: "reserved-file-create" | "reserved-folder-create" }>, content?: import("./common").BinaryContentSource, cancellation?: import("./synchronization-foundation").SynchronizationCancellationSignal): Promise<RemoteMutationOutcomeV1_3>;
  updateExisting(identity: Extract<import("./synchronization-foundation").RemoteMutationIdentity, { readonly kind: "existing-file-content-update" }>, content: import("./common").BinaryContentSource, cancellation?: import("./synchronization-foundation").SynchronizationCancellationSignal): Promise<RemoteMutationOutcomeV1_3>;
  moveExisting(identity: Extract<import("./synchronization-foundation").RemoteMutationIdentity, { readonly kind: "identity-preserving-move" }>, cancellation?: import("./synchronization-foundation").SynchronizationCancellationSignal): Promise<RemoteMutationOutcomeV1_3>;
  trashExisting(identity: Extract<import("./synchronization-foundation").RemoteMutationIdentity, { readonly kind: "trash" }>, cancellation?: import("./synchronization-foundation").SynchronizationCancellationSignal): Promise<RemoteMutationOutcomeV1_3>;
}

export type CoherentRemoteDownloadV1_3 =
  | Extract<import("./synchronization-foundation").CoherentRemoteDownload, { readonly status: "coherent" }>
  | { readonly status: "changed-during-transfer"; readonly reason: string }
  | { readonly status: "outcome-unknown"; readonly reason: string; readonly operationalFailure?: OperationalFailureProvenanceV1_3 };

export interface CoherentRemoteReadPortV1_3 {
  downloadVersion(remoteObjectId: import("./common").RemoteObjectId, expectedRevision: import("./common").RemoteRevisionId, expectedEvidence: import("./common").ContentEvidence, cancellation?: import("./synchronization-foundation").SynchronizationCancellationSignal): Promise<import("./google-drive").DriveResult<CoherentRemoteDownloadV1_3>>;
}

export type LocalTransactionResultV1_3 =
  | { readonly status: "staged-verified" | "committed" | "recovered"; readonly transaction: import("./synchronization-foundation").LocalMutationTransaction; readonly resultingObservationToken?: import("./common").ObservationToken }
  | { readonly status: "stale" | "blocked"; readonly reason: string; readonly transaction: import("./synchronization-foundation").LocalMutationTransaction }
  | { readonly status: "outcome-unknown"; readonly reason: string; readonly transaction: import("./synchronization-foundation").LocalMutationTransaction; readonly operationalFailure?: OperationalFailureProvenanceV1_3 };

export interface LocalTransactionalMutationPortV1_3 {
  stageAndVerify(transaction: import("./synchronization-foundation").LocalMutationTransaction, content: import("./common").BinaryContentSource, cancellation?: import("./synchronization-foundation").SynchronizationCancellationSignal): Promise<LocalTransactionResultV1_3>;
  commitVerifiedStage(transaction: import("./synchronization-foundation").LocalMutationTransaction, cancellation?: import("./synchronization-foundation").SynchronizationCancellationSignal): Promise<LocalTransactionResultV1_3>;
  recover(transaction: import("./synchronization-foundation").LocalMutationTransaction, cancellation?: import("./synchronization-foundation").SynchronizationCancellationSignal): Promise<LocalTransactionResultV1_3>;
}

/** V1.3 execution result keeps operational cause and physical certainty orthogonal. */
export type ExecutionResultV1_3 =
  | { readonly status: "durable-verified-success"; readonly receipt: VerifiedExecutionReceipt }
  | { readonly status: "authentication-required"; readonly reason: string; readonly operationalFailure: AuthenticationOperationalFailureV1_3; readonly effectSafety: RetrySafePhysicalAuthorityV1_3 }
  | { readonly status: "retryable-failure"; readonly reason: string; readonly operationalFailure: RetryableOperationalFailureV1_3; readonly retrySafety: RetrySafePhysicalAuthorityV1_3 }
  | { readonly status: "stale-precondition"; readonly reason: string; readonly failed?: readonly OperationPrecondition[] }
  | { readonly status: "blocking-failure"; readonly reason: string; readonly operationalFailure?: BlockingOperationalFailureV1_3; readonly effectSafety: RetrySafePhysicalAuthorityV1_3 }
  | { readonly status: "uncertain"; readonly reason: string; readonly operationalFailure?: OperationalFailureProvenanceV1_3 }
  | { readonly status: "recovery-required"; readonly reason: string; readonly operationalFailure?: RecoveryOperationalFailureV1_3 }
  | { readonly status: "cancelled"; readonly reason?: string };

export interface AuthoritativeSynchronizationExecutorV1_3 {
  validatePreconditions(operation: ExecutablePlannedOperation): Promise<AuthorityCompletePreconditionValidationResult>;
  execute(operation: ExecutablePlannedOperation): Promise<ExecutionResultV1_3>;
}

export type ExecutionDispositionV1_3 = {
  readonly primary: "success" | "authentication-required" | "deferred" | "blocking-failure" | "recovery-required" | "stale-precondition" | "cancelled";
  readonly physicalReconciliationRequired: boolean;
  readonly physicalRedispatchSafe: boolean;
  readonly retryMode: "none" | "ordinary-retry" | "reauthenticate-then-retry" | "reauthenticate-then-reconcile" | "reconcile-before-redispatch";
  readonly retryAfterMs?: number;
  /** Authorized to dispatch now after physical and operational gates, not merely safe for a future retry. */
  readonly mutationRedispatchAuthorized: boolean;
};

/** Complete V1.3 disposition derived from physical execution state plus operational gates. */
export function executionDispositionV1_3(result: ExecutionResultV1_3): ExecutionDispositionV1_3 {
  switch (result.status) {
    case "durable-verified-success":
      return { primary: "success", physicalReconciliationRequired: false, physicalRedispatchSafe: false, retryMode: "none", mutationRedispatchAuthorized: false };
    case "stale-precondition":
      return { primary: "stale-precondition", physicalReconciliationRequired: false, physicalRedispatchSafe: false, retryMode: "none", mutationRedispatchAuthorized: false };
    case "cancelled":
      return { primary: "cancelled", physicalReconciliationRequired: false, physicalRedispatchSafe: false, retryMode: "none", mutationRedispatchAuthorized: false };
    case "blocking-failure":
      return { primary: "blocking-failure", physicalReconciliationRequired: false, physicalRedispatchSafe: true, retryMode: "none", mutationRedispatchAuthorized: false };
    case "authentication-required":
      return { primary: "authentication-required", physicalReconciliationRequired: false, physicalRedispatchSafe: true, retryMode: "reauthenticate-then-retry", mutationRedispatchAuthorized: false };
    case "retryable-failure": {
      const retryAfterMs = result.operationalFailure.kind === "rate-limited" ? result.operationalFailure.retryAfterMs : undefined;
      return {
        primary: "deferred",
        physicalReconciliationRequired: false,
        physicalRedispatchSafe: true,
        retryMode: "ordinary-retry",
        ...(retryAfterMs === undefined ? {} : { retryAfterMs }),
        mutationRedispatchAuthorized: false,
      };
    }
    case "recovery-required":
      return { primary: "recovery-required", physicalReconciliationRequired: true, physicalRedispatchSafe: false, retryMode: "reconcile-before-redispatch", mutationRedispatchAuthorized: false };
    case "uncertain": {
      const provenance = result.operationalFailure;
      if (!provenance) return { primary: "recovery-required", physicalReconciliationRequired: true, physicalRedispatchSafe: false, retryMode: "reconcile-before-redispatch", mutationRedispatchAuthorized: false };
      switch (provenance.kind) {
        case "authentication-required":
          return { primary: "authentication-required", physicalReconciliationRequired: true, physicalRedispatchSafe: false, retryMode: "reauthenticate-then-reconcile", mutationRedispatchAuthorized: false };
        case "transient-failure":
          return { primary: "deferred", physicalReconciliationRequired: true, physicalRedispatchSafe: false, retryMode: "reconcile-before-redispatch", mutationRedispatchAuthorized: false };
        case "rate-limited":
          return { primary: "deferred", physicalReconciliationRequired: true, physicalRedispatchSafe: false, retryMode: "reconcile-before-redispatch", ...(provenance.retryAfterMs === undefined ? {} : { retryAfterMs: provenance.retryAfterMs }), mutationRedispatchAuthorized: false };
        case "permission-denied":
        case "quota-exhausted":
          return { primary: "blocking-failure", physicalReconciliationRequired: true, physicalRedispatchSafe: false, retryMode: "reconcile-before-redispatch", mutationRedispatchAuthorized: false };
        case "recovery-required":
        case "unclassified":
          return { primary: "recovery-required", physicalReconciliationRequired: true, physicalRedispatchSafe: false, retryMode: "reconcile-before-redispatch", mutationRedispatchAuthorized: false };
      }
    }
  }
}
EOF

