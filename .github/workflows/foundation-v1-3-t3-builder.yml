## 12. V1.3 APPEND-ONLY FAILURE-PROVENANCE SUCCESSION CANDIDATE

Candidate identity: `phase6-sync-foundation-v1.3-failure-provenance`

Predecessor approved foundation: `96b4541b15012ac4ce0d81243b73ef779efd343e`

Predecessor approved contract tree: `4deb82e382f7957c731ef78db52b4164571d57a3`

This section is appended succession material. Every byte above this heading remains predecessor contract history and compatibility authority.

### 12.1 Succession and deprecation

Deprecation does not delete or rewrite predecessor contract history. After independent V1.3 approval/adoption, new or resumed affected workstreams use `RemoteMutationOutcomeV1_3`, `ReliableRemoteMutationPortV1_3`, `CoherentRemoteDownloadV1_3`, `CoherentRemoteReadPortV1_3`, `LocalTransactionResultV1_3`, `LocalTransactionalMutationPortV1_3`, `ExecutionResultV1_3`, and `AuthoritativeSynchronizationExecutorV1_3` in place of the corresponding predecessor seams where operational failure provenance must survive.

New V1.3 shared surfaces include `OperationalFailureProvenanceV1_3`, `OperationalFailureErrorV1_3`, `operationalFailureProvenanceFromErrorV1_3`, `operationalFailureFromDriveSignalV1_3`, `AuthenticationOperationalFailureV1_3`, `RetrySafePhysicalAuthorityV1_3`, `ExecutionDispositionV1_3`, and `executionDispositionV1_3`.

### 12.2 Orthogonal authority invariant

Physical-effect certainty and operational-failure provenance are orthogonal. Operational provenance never proves non-application, converts `outcome-unknown` to `verified-not-applied`, authorizes blind redispatch, advances BASE/path convergence, or becomes semantic synchronization authority.

`RetrySafePhysicalAuthorityV1_3` proves only that there is no unresolved may-have-dispatched physical effect. It does not prove that operational scheduling, authentication, or rate-limit gates permit dispatch now.

### 12.3 Authentication states

V1.3 preserves two distinct authentication truths:

- physically safe authentication failure -> `status: "authentication-required"`, required `effectSafety`, no physical reconciliation, `physicalRedispatchSafe: true`, `retryMode: "reauthenticate-then-retry"`, current redispatch authorization false;
- uncertain authentication -> `status: "uncertain"` with authentication provenance, physical reconciliation required, `physicalRedispatchSafe: false`, `retryMode: "reauthenticate-then-reconcile"`, current redispatch authorization false.

### 12.4 Retry scheduling versus current authorization

`ExecutionDispositionV1_3.mutationRedispatchAuthorized` means authorized to dispatch now after both physical and operational gates. A static failure disposition never pre-authorizes a future dispatch.

For safe transient/rate-limit failure, `physicalReconciliationRequired` is false and `physicalRedispatchSafe` is true, but `primary` is deferred and `mutationRedispatchAuthorized` is false. A later scheduler opportunity may authorize retry. Rate-limit timing has exactly one authority: `OperationalFailureProvenanceV1_3.kind === "rate-limited"`.

### 12.5 Contextual Drive-signal rule

`operationalFailureFromDriveSignalV1_3` maps authentication-required, transient-failure, rate-limited, permission-denied, quota-exhausted, and explicit recovery-required only. `not-found` and `conflict` remain contextual and return `undefined` from the context-free mapper.

### 12.6 Downstream migration requirements

A maps Drive/lazy failures into V1.3 provenance and successor remote seams. B consumes the lazy carrier/extractor without fabricating remote provenance for generic local I/O. C gains no new persistence authority. D emits V1.3 execution results while keeping physical retry safety distinct from current dispatch authorization. G proves uncertain failures never gain redispatch authority. H/UI consumes `executionDispositionV1_3` rather than reason strings.

No downstream implementation is authorized by this candidate.
