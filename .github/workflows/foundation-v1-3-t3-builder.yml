## 17. V1.3 APPEND-ONLY OPERATIONAL-FAILURE PROVENANCE ARCHITECTURE

This entire section is successor architecture. Sections 1–16 above are preserved byte-for-byte from the approved predecessor foundation.

### 17.1 Two-dimensional failure model

V1.3 keeps physical-effect certainty independent from operational cause. Authentication-required, transient transport failure, and rate limiting can coexist with either verified no-unresolved-effect authority or an unresolved may-have-dispatched physical state.

### 17.2 Safe versus uncertain authentication

A token/authentication rejection known to occur pre-dispatch or otherwise verified not applied is represented by the dedicated `ExecutionResultV1_3.status === "authentication-required"` member with required `RetrySafePhysicalAuthorityV1_3`. It requires reauthentication before a future retry but does not manufacture physical reconciliation.

Authentication discovered after a mutation may have dispatched remains `uncertain` plus authentication provenance. That path requires reauthentication then physical reconciliation before any redispatch.

### 17.3 Physical retry safety is not current authorization

`physicalRedispatchSafe` answers only whether unresolved physical reconciliation blocks a future retry. `mutationRedispatchAuthorized` answers whether dispatch is authorized now after physical and operational gates.

Safe transient and rate-limited failures therefore produce deferred dispositions with `physicalRedispatchSafe: true` and `mutationRedispatchAuthorized: false`. Rate-limit timing is copied solely from structured provenance. Safe authentication similarly yields `reauthenticate-then-retry`, not `reauthenticate-then-reconcile`.

### 17.4 Contextual semantics and restart authority

`not-found` and `conflict` remain contextual rather than global operational recovery classifications. Operational provenance does not become durable semantic synchronization authority; predecessor durable physical intent/stage/effect/recovery state remains authoritative across restart.

### 17.5 Succession boundary

The predecessor seams remain physically present for compatibility. After independent V1.3 approval/adoption, affected new/resumed work uses the explicitly versioned successors. This candidate authorizes no downstream implementation or integration.
