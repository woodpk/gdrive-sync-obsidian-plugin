name: PR 31 Cloud Continuation Closure

on:
  push:
    branches: [phase6-alpha-plan-errors-stability]

permissions:
  contents: write

jobs:
  verify-and-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase6-alpha-plan-errors-stability
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Full test suite
        run: |
          npm test | tee /tmp/pr31-full.tap
          grep -q '^# tests 358$' /tmp/pr31-full.tap
          grep -q '^# pass 358$' /tmp/pr31-full.tap
          grep -q '^# fail 0$' /tmp/pr31-full.tap
      - name: Focused PR 31 repair tests
        run: |
          node --test .test-build/test/phase6-alpha-mixed-plan-isolation.test.js .test-build/test/phase6-alpha-plan-errors-stability.test.js | tee /tmp/pr31-focused.tap
          grep -q '^# tests 35$' /tmp/pr31-focused.tap
          grep -q '^# pass 35$' /tmp/pr31-focused.tap
          grep -q '^# fail 0$' /tmp/pr31-focused.tap
      - name: Production build
        run: npm run build | tee /tmp/pr31-build.log
      - name: Explicit build verification
        run: npm run verify:build | tee /tmp/pr31-verify-build.log
      - name: Diff whitespace check
        run: git diff --check
      - name: Record continuation evidence
        env:
          AGENT_ID: agt-CA-P6-ALPHA-PLAN-ERRORS-STABILITY-CLOUD-CONT-01
          INHERITED_HEAD: 51b270225b94ced2f66e626b97e00853bfdb9218
          IMPLEMENTATION_SHA: ece64f993ed50de4c2bc3810639d942e597ef7e0
        run: |
          MAIN_SIZE="$(wc -c < main.js | tr -d ' ')"
          MAIN_SHA="$(sha256sum main.js | awk '{print $1}')"
          MANIFEST_SIZE="$(wc -c < manifest.json | tr -d ' ')"
          MANIFEST_SHA="$(sha256sum manifest.json | awk '{print $1}')"
          export MAIN_SIZE MAIN_SHA MANIFEST_SIZE MANIFEST_SHA
          python - <<'PY'
          from pathlib import Path
          import os

          agent = os.environ['AGENT_ID']
          inherited = os.environ['INHERITED_HEAD']
          implementation = os.environ['IMPLEMENTATION_SHA']
          run_id = os.environ['GITHUB_RUN_ID']
          workflow_commit = os.environ['GITHUB_SHA']
          main_size = os.environ['MAIN_SIZE']
          main_sha = os.environ['MAIN_SHA']
          manifest_size = os.environ['MANIFEST_SIZE']
          manifest_sha = os.environ['MANIFEST_SHA']

          section = f'''\n\n---\n\n## PR #31 cloud continuation closure — `{agent}`\n\nThis section continues the existing repair from inherited branch head `{inherited}`. The continuation agent directly inspected the C1/C2 production lifecycle and hard-restart regression coverage and found no remaining implementation defect requiring another source or test change. The last product/test implementation commit therefore remains `{implementation}`; the inherited commit after it was evidence-only.\n\n### C1 — crash-safe CSV relocation verification\n\nPASS by direct implementation and adversarial test inspection. Pending relocation state is durably journaled with exact source and destination paths; restart reconstructs both visible/operational exclusions before scheduler activity; destination establishment/validation precedes the active-location transition; the source remains until the destination and active setting are durable; source cleanup precedes journal clearing; all three hard-restart boundaries converge while preserving prior records and unrelated user exclusions; pending relocation failure leaves both locations protected.\n\n### C2 — crash-safe CSV replacement/recovery verification\n\nPASS by direct implementation and adversarial test inspection. Stage/backup paths are deterministic (`.brain-sync-stage` / `.brain-sync-backup`); recovery runs before absent/blank initialization; a valid canonical wins and stale residue is cleaned; canonical-missing + backup restores committed history; canonical-missing + valid stage with no backup promotes stage; unrecoverable residue fails safely instead of fabricating blank authoritative history; genuinely residue-free first initialization may create the empty/header CSV; relocation uses the same recovery semantics.\n\n### Hard-restart regression verification\n\nThe existing tests construct restart residue directly rather than depending on an exception handler completing. They cover canonical missing + backup + stage, canonical present + stale residue, canonical missing + valid stage only, unrecoverable residue, relocation restart after journal creation, after destination creation, and after active-location change, both locations excluded throughout the pending transaction, prior error-record preservation, and unrelated user-exclusion preservation. No test addition was required.\n\n### Continuation verification\n\nOne-shot GitHub/Linux continuation workflow run `{run_id}` executed from workflow-creation commit `{workflow_commit}` against the unchanged product/test tree:\n\n- `npm ci`: PASS\n- `npm run typecheck`: PASS\n- `npm test`: **358/358 PASS**, 0 fail\n- focused repair command (run after the full suite establishes the repository test harness): `node --test .test-build/test/phase6-alpha-mixed-plan-isolation.test.js .test-build/test/phase6-alpha-plan-errors-stability.test.js` — **35/35 PASS**, 0 fail\n- `npm run build`: PASS\n- `npm run verify:build`: PASS\n- `git diff --check`: PASS\n- `BUILD_VERIFY_ENTRYPOINT=PASS`\n- `BUILD_VERIFY_SYNTAX=PASS`\n- `BUILD_VERIFY_LOCAL_RUNTIME_DEPENDENCIES=PASS`\n- `BUILD_VERIFY_MOBILE_EVALUATION=PASS`\n- `BUILD_VERIFY_PACKAGE_SHAPE=PASS`\n- `main.js`: `{main_size}` bytes; SHA-256 `{main_sha}`\n- `manifest.json`: `{manifest_size}` bytes; SHA-256 `{manifest_sha}`\n\nThe exact-head artifact independently downloaded from prior successful run `33268831441` / job `99143544637` matches the continuation product tree for `main.js`: `404546` bytes / `c98eb80d9c6d7e90baa925ed8fd8e72e5ca771c0720813e9b8f2fb1e6e42ef01`. Its Linux-checkout `manifest.json` is `275` bytes / `79127c33d5e7df64776f0bdd076cf58d37ac53f20de1e4bd533f750273c3e547`. Earlier prose that used a different final-head `main.js` identity is superseded. The historical `283`-byte / `fd4cd2d...` manifest identity is not used as the exact GitHub/Linux final-head artifact identity.\n\nInherited local Windows verification remains **356/358 qualified PASS**. It was not re-executed by this cloud continuation agent. The only two inherited failures are the established Windows drive-prefix expectation mismatches for the direct-missing-child and nested-missing-target portable-collision assertions; no new Windows failure is claimed.\n\n### Continuation change boundary and limitations\n\n- additional implementation changes required: **NO**\n- additional source/test files changed by this continuation: **none**\n- continuation repository changes: this append to the two required evidence files plus a session-transient verification workflow that is removed before final-head review\n- no new branch or PR was created\n- PR #31 remains required to stay open and unmerged against `phase6-integration`\n- no `phase6-integration`, `master`, tag, release, OAuth/Azure behavior, physical device, synchronization, Phase 6 completion, or Stage 3 state was modified\n- final evidence/cleanup commit is necessarily subsequent to this text and cannot contain its own Git SHA; the exact final pushed PR head is recorded in PR #31 metadata and the completion response after GitHub returns it\n\nPhysical iPhone validation: NOT AVAILABLE IN THIS SESSION\n'''

          for raw in [
              'dev/evidence/_ca-output.md',
              'dev/evidence/_ca-output-agt-CA-P6-ALPHA-PLAN-ERRORS-STABILITY-01.md',
          ]:
              path = Path(raw)
              path.write_text(path.read_text(encoding='utf-8') + section, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/evidence/_ca-output.md dev/evidence/_ca-output-agt-CA-P6-ALPHA-PLAN-ERRORS-STABILITY-01.md
          git diff --cached --check
          git commit -m "docs: append PR 31 cloud continuation evidence"
          git push origin HEAD:phase6-alpha-plan-errors-stability
