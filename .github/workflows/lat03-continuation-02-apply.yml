name: LAT-03 Continuation 02 Apply

on:
  push:
    branches: [phase6-latency-opt-03-run-scoped-local-evidence]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase6-latency-opt-03-run-scoped-local-evidence
          fetch-depth: 0
      - name: Apply bounded LAT-03 race repair and deterministic tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          source_path = Path('src/local/obsidian-local-vault.ts')
          source = source_path.read_text()
          new_method = '''  private async reusableReadOnlyObservation(path: VaultPath, expectedToken: ObservationToken): Promise<LocalObservation | undefined> {
            const safe = await this.safePath(path, "observe");
            const key = String(safe);
            const cached = this.reusableStableObservations.get(key);
            if (!cached || cached.epoch !== this.observationEpoch || cached.token !== expectedToken) return undefined;
            const generation = this.generationFor(safe);
            if (generation !== cached.generation) {
              this.reusableStableObservations.delete(key);
              return undefined;
            }
            const discardCachedIfSame = (): void => {
              if (this.reusableStableObservations.get(key) === cached) this.reusableStableObservations.delete(key);
            };
            let current: Stat | null;
            try {
              current = await this.adapter.stat(key);
            } catch {
              discardCachedIfSame();
              return undefined;
            }
            const currentGeneration = this.generationFor(safe);
            if (
              this.observationEpoch !== cached.epoch ||
              currentGeneration !== cached.generation ||
              this.reusableStableObservations.get(key) !== cached ||
              !current ||
              current.type !== "file" ||
              !sameStat(current, cached.stat) ||
              statToken(key, current, currentGeneration) !== expectedToken
            ) {
              discardCachedIfSame();
              return undefined;
            }
            return cached.observation;
          }
          '''
          pattern = re.compile(
              r'  private async reusableReadOnlyObservation\(path: VaultPath, expectedToken: ObservationToken\): Promise<LocalObservation \| undefined> \{.*?\n  \}\n\n(?=  private async writeIncremental)',
              re.S,
          )
          source, count = pattern.subn(new_method, source, count=1)
          if count != 1:
              raise SystemExit(f'expected one reusableReadOnlyObservation method, replaced {count}')
          source_path.write_text(source)

          test_path = Path('test/obsidian-local-vault-evidence-reuse.test.ts')
          test = test_path.read_text()

          test, count = re.subn(
              r'interface Runtime \{',
              'interface StatBarrier {\n  readonly entered: Promise<void>;\n  release(): void;\n}\n\ninterface Runtime {',
              test,
              count=1,
          )
          if count != 1:
              raise SystemExit('failed to insert StatBarrier')

          test, count = re.subn(
              r'(  fireRename\(oldPath: string, newPath: string\): void;\n)',
              r'\1  blockNextStat(path: string): StatBarrier;\n',
              test,
              count=1,
          )
          if count != 1:
              raise SystemExit('failed to add blockNextStat to Runtime')

          test, count = re.subn(
              r'(  let renameObserver: \(\(from: string, to: string\) => void\) \| undefined;\n)',
              r'\1  let nextStatBarrier: { readonly path: string; entered(): void; readonly waitForRelease: Promise<void> } | undefined;\n',
              test,
              count=1,
          )
          if count != 1:
              raise SystemExit('failed to add stat barrier state')

          stat_pattern = re.compile(
              r'    stat: async \(path: string\): Promise<Stat \| null> => \{.*?\n    \},\n(?=    list:)',
              re.S,
          )
          stat_replacement = '''    stat: async (path: string): Promise<Stat | null> => {
                adapterCalls.push(`stat:${path}`);
                const barrier = nextStatBarrier?.path === path ? nextStatBarrier : undefined;
                if (barrier) {
                  nextStatBarrier = undefined;
                  barrier.entered();
                  await barrier.waitForRelease;
                }
                const entry = entries.get(path);
                if (!entry) return null;
                return {
                  type: entry.type,
                  ctime: entry.ctime,
                  mtime: entry.mtime,
                  size: entry.type === "file" ? (entry.bytes?.byteLength ?? 0) : 0,
                };
              },
          '''
          test, count = stat_pattern.subn(stat_replacement, test, count=1)
          if count != 1:
              raise SystemExit('failed to replace stat seam')

          test, count = re.subn(
              r'(    fireRename: \(oldPath, newPath\) => emit\("rename", \{ path: newPath \}, oldPath\),\n)',
              r'''\1    blockNextStat: path => {
                if (nextStatBarrier) throw new Error("a stat barrier is already armed");
                let markEntered!: () => void;
                let release!: () => void;
                const entered = new Promise<void>(resolve => { markEntered = resolve; });
                const waitForRelease = new Promise<void>(resolve => { release = resolve; });
                nextStatBarrier = { path, entered: markEntered, waitForRelease };
                return { entered, release };
              },
          ''',
              test,
              count=1,
          )
          if count != 1:
              raise SystemExit('failed to add blockNextStat runtime implementation')

          marker = 'test("create modify and delete events invalidate same-path reusable evidence by generation", async () => {\n'
          inserted = '''test("generation invalidation while fast-path stat is pending rejects the stale token", async () => {
            const value = runtime({ "note.bin": { type: "file", bytes: bytes(1, 2, 3, 4), mtime: 7, ctime: 1 } });
            const adapter = local(value);
            const token = tokenFrom(await adapter.enumerate(), "note.bin");
            const before = statCount(value, "note.bin");
            const barrier = value.blockNextStat("note.bin");
            const pendingRead = adapter.readFile(vp("note.bin"), token);
            await barrier.entered;
            value.fire("modify", "note.bin");
            barrier.release();

            await assert.rejects(pendingRead, LocalStaleObservationError);
            assert.equal(statCount(value, "note.bin") - before, 3,
              "invalidated pending fast-path stat must fall back to the full two-stat stale check rather than returning cached evidence");
            adapter.dispose();
          });

          test("observation epoch replacement while fast-path stat is pending cannot return the prior cached proof", async () => {
            const value = runtime({ "note.bin": { type: "file", bytes: bytes(1, 2, 3, 4), mtime: 7, ctime: 1 } });
            const adapter = local(value);
            const token = tokenFrom(await adapter.enumerate(), "note.bin");
            const before = statCount(value, "note.bin");
            const barrier = value.blockNextStat("note.bin");
            const pendingRead = adapter.readFile(vp("note.bin"), token);
            await barrier.entered;

            const refreshed = await adapter.enumerate();
            assert.equal(tokenFrom(refreshed, "note.bin"), token, "epoch refresh may preserve the opaque token when generation/stat are unchanged");
            barrier.release();
            const read = await pendingRead;

            assert.equal(read.observationToken, token);
            assert.equal(statCount(value, "note.bin") - before, 5,
              "pending old proof plus epoch refresh must be followed by a fresh two-stat fallback, not acceptance of the pre-epoch cached object");
            adapter.dispose();
          });

          test("mid-stat generation invalidation rejects before any resource bytes are fetched", async () => {
            const value = runtime({ "note.bin": { type: "file", bytes: bytes(1, 2, 3, 4), mtime: 7, ctime: 1 } });
            const adapter = local(value);
            const token = tokenFrom(await adapter.enumerate(), "note.bin");
            const read = await adapter.readFile(vp("note.bin"), token);
            const barrier = value.blockNextStat("note.bin");
            const pendingCollect = collect(read.content);
            await barrier.entered;
            value.fire("modify", "note.bin");
            barrier.release();

            await assert.rejects(pendingCollect, LocalStaleObservationError);
            assert.equal(value.fetchCalls.length, 0, "resource fetch must not begin under evidence invalidated while the live stat was pending");
            adapter.dispose();
          });

          '''
          if marker not in test:
              raise SystemExit('test insertion marker not found')
          test = test.replace(marker, inserted + marker, 1)
          test_path.write_text(test)
          PY

          git checkout 8dae25d3ea620f4fb676b46e72f9fda7fc361e25 -- .github/workflows/phase6-alpha-diagnostic-ci.yml
          rm .github/workflows/lat03-continuation-02-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "LAT-03 continuation 02: close async invalidation race"
          git push origin HEAD:phase6-latency-opt-03-run-scoped-local-evidence
