name: Publish 0.1.15 Diagnostic Prerelease

on:
  push:
    branches:
      - release-0.1.15-publisher
    paths:
      - .github/workflows/publish-0.1.15-diagnostic-prerelease.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: e3b27109c92f1f9ba9226a7cae19e3c0b617797c
      RELEASE_BRANCH: release-0.1.15-ios-oauth-diagnostic
      RELEASE_TAG: 0.1.15
    steps:
      - name: Checkout exact verified diagnostic SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Prepare versioned release commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version 0.1.15 --no-git-tag-version
          node - <<'NODE'
          const fs = require('fs');
          const path = 'manifest.json';
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          manifest.version = '0.1.15';
          fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n');
          NODE
          git add manifest.json package.json package-lock.json
          git diff --cached --check
          git commit -m "release: prepare 0.1.15"
          echo "PREP_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Full tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Repository checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -f main.js
          test -f manifest.json
          node -e 'const m=require("./manifest.json"); if(m.version!=="0.1.15") process.exit(1)'
          sha256sum main.js manifest.json | tee release-sha256.txt

      - name: Push immutable release-preparation commit and tag
        shell: bash
        run: |
          set -euo pipefail
          git push origin "$PREP_SHA:refs/heads/$RELEASE_BRANCH"
          git tag "$RELEASE_TAG" "$PREP_SHA"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" main.js manifest.json release-sha256.txt \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "0.1.15 — iOS OAuth Prepared-Launch Diagnostic" \
            --notes "Diagnostic prerelease for the intermittent iOS OAuth external-browser handoff issue. Adds two bounded diagnostic controls: Prepare authorization captures the real PKCE/OAuth authorization request without opening a browser; Launch prepared authorization hands that prepared URL to the existing _external browser target from a fresh physical tap. Existing Authenticate behavior and synchronization, Drive, token-exchange, pairing, and durable-state semantics are unchanged. Source diagnostic implementation SHA: $TARGET_SHA. Release-preparation SHA: $PREP_SHA."

      - name: Verify published prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,name,url,targetCommitish
