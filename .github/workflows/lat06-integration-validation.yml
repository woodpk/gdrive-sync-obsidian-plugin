name: LAT06 Integration Validation

on:
  push:
    branches:
      - st2a-ph6-04-lv-03-lat-06-integration

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify integration ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base 02bc3ba9ded805374303f3b18b0bfc6c7d3ca7c7 HEAD)" = "02bc3ba9ded805374303f3b18b0bfc6c7d3ca7c7"
          git merge-base --is-ancestor 73edc1af3c4bf656fdbc51a6a84ca34bcd0e2cbd HEAD
          git merge-base --is-ancestor 4fb05ed39527afbba3cd2c8c21cca9288e709e62 HEAD
          git merge-base --is-ancestor c7988ea0b585e1cdee1e9720f5eea509088f41e8 HEAD
          git merge-base --is-ancestor a1b7aa2d98e690e1fb8c6be3fbd145d654766b9d HEAD
      - name: Install dependencies
        run: npm ci
      - name: Compile tests
        run: npx tsc -p tsconfig.test.json
      - name: Focused cross-workstream regression
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            .test-build/test/phase6-latency-measurement-foundation.test.js
            .test-build/test/obsidian-local-vault-concurrency.test.js
            .test-build/test/obsidian-local-vault-evidence-reuse.test.js
            .test-build/test/obsidian-local-vault.test.js
            .test-build/test/phase6-alpha-ios-adapter-boundary.test.js
            .test-build/test/phase6-alpha-ios-content-reader.test.js
            .test-build/test/workstreams/local/local-transaction-safety.test.js
            .test-build/test/workstreams/local/local-recovery-matrix.test.js
            .test-build/test/workstreams/orchestration/v1.2-authoritative-boundary.test.js
            .test-build/test/workstreams/orchestration/v1.2-authoritative-commit-lifecycle.test.js
            .test-build/test/workstreams/orchestration/v1.2-production-lifecycle-composition.test.js
            .test-build/test/workstreams/orchestration/v1.2-mutation-lifecycle.test.js
            .test-build/test/workstreams/orchestration/lat04-authoritative-precondition-dedup.test.js
            .test-build/test/phase3-drive.test.js
            .test-build/test/phase3-changes.test.js
            .test-build/test/phase5-group-b-drive-domain.test.js
            .test-build/test/phase5-group-b-scope-transfer.test.js
            .test-build/test/workstreams/orchestration/v1.2-reliable-changes.test.js
            .test-build/test/workstreams/orchestration/v1.2-remote-feed-authority.test.js
            .test-build/test/phase6-b-destructive-safety.test.js
            .test-build/test/phase6-log02-google-http-transport-tracing.test.js
            .test-build/test/phase6-log03-google-drive-semantic-operation-tracing.test.js
            .test-build/test/workstreams/orchestration/log04-execution-diagnostics.test.js
            .test-build/test/phase6-log07-end-to-end-observability-verification.test.js
            .test-build/test/phase6-lat05-remote-planning-fast-path.test.js
          )
          for test_file in "${tests[@]}"; do
            test -f "$test_file"
          done
          node --test "${tests[@]}"
      - name: Full repository gate
        run: npm run check
      - name: Common-base whitespace gate
        run: git diff --check 02bc3ba9ded805374303f3b18b0bfc6c7d3ca7c7..HEAD
