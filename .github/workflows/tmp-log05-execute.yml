name: Temporary LOG-05 Execution

on:
  push:
    branches: [tmp-log05-execution-tooling]
    paths-ignore:
      - dev/log05/last-run.md

permissions:
  contents: write

jobs:
  implement-verify-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-log05-execution-tooling
          path: tooling
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: phase6-logging-log05-authority-state-recovery-tracing
          path: repo
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Verify exact base and apply bounded transform
        shell: bash
        run: |
          set -euo pipefail
          cd repo
          test "$(git rev-parse HEAD)" = "48d9e612b69b43be9941f97630c580c2b8aed929"
          test -z "$(git status --porcelain)"
          python ../tooling/dev/log05/precondition-log05.py
          python ../tooling/dev/log05/apply-log05.py
          python - <<'PY'
          from pathlib import Path
          p=Path('src/product/durable-intent-recovery.ts')
          t=p.read_text(encoding='utf-8')
          start=t.index('async function preflightVerifiedEffects(')
          end=t.index('export async function recoverMatchingDurableIntentToVerifiedReceipt(', start)
          a,s,b=t[:start],t[start:end],t[end:]
          s=s.replace('  if (loaded.status !== "trusted") { return loaded.reason; }\n  let remotePromise','  if (loaded.status !== "trusted") return loaded.reason;\n  let remotePromise',1)
          s=s.replace('    const invalid = validateIntent(intent, loaded.state);\n    if (invalid) { return invalid; }\n    for (const effect of intent.effects) {','    const invalid = validateIntent(intent, loaded.state);\n    if (invalid) return invalid;\n    for (const effect of intent.effects) {',1)
          p.write_text(a+s+b,encoding='utf-8')
          PY
          python ../tooling/dev/log05/correct-log05-contract.py
          git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: repo/package-lock.json
      - name: Verify implementation
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          mkdir -p .log05-verification
          npm ci 2>&1 | tee .log05-verification/npm-ci.log
          npm run typecheck 2>&1 | tee .log05-verification/typecheck.log
          npx tsc -p tsconfig.test.json 2>&1 | tee .log05-verification/test-compile.log
          node --test .test-build/test/workstreams/state/state-authority-v1-1.test.js .test-build/test/workstreams/orchestration/v1.2-durable-intent-recovery.test.js 2>&1 | tee .log05-verification/focused.log
          npm test 2>&1 | tee .log05-verification/full-tests.log
          npm run build 2>&1 | tee .log05-verification/build.log
          npm run check 2>&1 | tee .log05-verification/repo-check.log
          git diff --check 2>&1 | tee .log05-verification/diff-check.log
          wc -c main.js | tee .log05-verification/main-js-size.txt
          sha256sum main.js | tee .log05-verification/main-js-sha256.txt
      - name: Commit implementation and evidence
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          BASE=48d9e612b69b43be9941f97630c580c2b8aed929
          BRANCH=phase6-logging-log05-authority-state-recovery-tracing
          git checkout -- main.js 2>/dev/null || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/diagnostics/authority-state-recovery-diagnostics.ts src/state/persistent-state-store.ts src/product/synchronization-adapters.ts src/product/durable-intent-recovery.ts src/product/durable-intent-recovery-base.ts test/workstreams/state/state-authority-v1-1.test.ts test/workstreams/orchestration/v1.2-durable-intent-recovery.test.ts
          git diff --cached --check
          git commit -m 'feat: add LOG-05 authority state and recovery tracing'
          IMPL=$(git rev-parse HEAD)
          FOCUSED_TESTS=$(grep '^# tests ' .log05-verification/focused.log | tail -1 | awk '{print $3}')
          FOCUSED_PASS=$(grep '^# pass ' .log05-verification/focused.log | tail -1 | awk '{print $3}')
          FULL_TESTS=$(grep '^# tests ' .log05-verification/full-tests.log | tail -1 | awk '{print $3}')
          FULL_PASS=$(grep '^# pass ' .log05-verification/full-tests.log | tail -1 | awk '{print $3}')
          ARTIFACT_SHA=$(awk '{print $1}' .log05-verification/main-js-sha256.txt)
          ARTIFACT_SIZE=$(awk '{print $1}' .log05-verification/main-js-size.txt)
          mkdir -p dev/evidence
          cat > dev/evidence/_ca-output-agt-ca-p6-log05-authority-state-recovery-tracing-01.md <<EOF
          # Phase 6 LOG-05 Authority, State, and Recovery Tracing — Agent Evidence

          - Agent: \`agt-ca-p6-log05-authority-state-recovery-tracing-01\`
          - Work package: \`LOG-05\`
          - Task type: \`IMPLEMENTATION\`
          - Wave: \`W1\`
          - Resolved common base SHA: \`$BASE\`
          - Branch: \`$BRANCH\`
          - Final implementation SHA: \`$IMPL\`
          - Final evidence SHA: reported in the completion response; a commit cannot contain its own SHA.
          - Frozen LOG-01 contract consumed unchanged: \`src/diagnostics/diagnostic-logger.ts\` from \`$BASE\`.

          ## Changed files

          - \`src/diagnostics/authority-state-recovery-diagnostics.ts\`
          - \`src/state/persistent-state-store.ts\`
          - \`src/product/synchronization-adapters.ts\`
          - \`src/product/durable-intent-recovery.ts\`
          - \`src/product/durable-intent-recovery-base.ts\`
          - \`test/workstreams/state/state-authority-v1-1.test.ts\`
          - \`test/workstreams/orchestration/v1.2-durable-intent-recovery.test.ts\`
          - \`dev/evidence/_ca-output-agt-ca-p6-log05-authority-state-recovery-tracing-01.md\`

          ## Instrumented boundaries

          - Trusted/authority state load status, state/persistence revisions, semantic generation, and bounded intent/local-transaction/remote-batch counts.
          - Persistence/semantic CAS start/result with distinct stale-persistence, stale-semantic-authority, and recovery-required classifications.
          - Ordered semantic-generation before/after evidence and adapter convergence-generation rebasing without changing generation logic.
          - BASE transitions and learned remote batch/reduction/retirement progression using safe IDs/counts/cursor-presence only.
          - Durable intent persistence, effect-stage progression, intent retirement, current-vs-intent authority generation, exact validation reasons, physical observation classification, physical-result persistence, receipt reconstruction, and final recovery result.
          - Existing remote-update preverification remains before general verified-effect preflight and base recovery.

          ## Verification

          - \`npm ci\`: PASS
          - \`npm run typecheck\`: PASS
          - \`npx tsc -p tsconfig.test.json\`: PASS
          - Focused state/recovery tests: PASS, \`$FOCUSED_PASS/$FOCUSED_TESTS\`
          - Full automated test suite: PASS, \`$FULL_PASS/$FULL_TESTS\`
          - \`npm run build\`: PASS
          - \`npm run check\`: PASS
          - \`git diff --check\`: PASS
          - Verification build \`main.js\` bytes: \`$ARTIFACT_SIZE\`
          - Verification build \`main.js\` SHA-256: \`$ARTIFACT_SHA\`

          ## Contract preservation and privacy

          - State schema, semantic projection, CAS expected values, persistence/semantic increment algorithms, change-cursor advancement, intent lifecycle, and recovery ordering were not redesigned.
          - Diagnostic emission is optional and fail-safe: diagnostic exceptions are swallowed and cannot change state/CAS/recovery outcomes.
          - LOG-05 does not send raw state envelopes, BASE/mapping/tombstone arrays, learned-change payloads, raw vault paths, file content, OAuth credentials, or secrets to the LOG-01 logger.
          - Focused tests verify bounded load/CAS/generation facts, no false semantic transition for persistence-only journal updates, true semantic transition ordering, stale-persistence vs stale-semantic classification, remote-batch bounded evidence, current-generation recovery, exact stale-generation rejection, receipt reconstruction visibility, no Drive mutation, and raw-path exclusion.
          - No production runtime composition was changed; LOG-03 owns production wiring.
          - No live Drive mutation, B01 rerun/remediation, merge, release, iPhone validation, or Stage 3 work occurred.
          - Mandatory dynamic verification ran in GitHub Actions Node 22 because the supervising ChatGPT container had no network route to clone/install this repository locally.

          ## Stop state

          LOG-05 implementation and evidence are committed on its isolated W1 branch. Local completion is not integration or session approval. Stop for supervisory review.
          EOF
          sed -i 's/^          //' dev/evidence/_ca-output-agt-ca-p6-log05-authority-state-recovery-tracing-01.md
          git add dev/evidence/_ca-output-agt-ca-p6-log05-authority-state-recovery-tracing-01.md
          git diff --cached --check
          git commit -m 'docs: record LOG-05 implementation evidence'
          git push origin HEAD:$BRANCH
