name: Phase 6 Alpha Windows Integration Evidence Finalization

on:
  push:
    branches: [phase6-integration]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'ci: finalize Windows repair integration evidence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase6-integration
          fetch-depth: 0
      - name: Append evidence and remove temporary workflow
        shell: bash
        run: |
          printf '%s' '' | base64 -d >> dev/evidence/_ca-output.md
          printf '%s' '' | base64 -d >> dev/evidence/_ca-output.md
          printf '%s' '' | base64 -d >> dev/evidence/phase6-integration-manifest.md
          rm .github/workflows/phase6-alpha-windows-integration-evidence-finalize.yml
          git config user.name 'phase6-alpha-integration-evidence'
          git config user.email '48619728+woodpk@users.noreply.github.com'
          git add dev/evidence/_ca-output.md dev/evidence/phase6-integration-manifest.md .github/workflows/phase6-alpha-windows-integration-evidence-finalize.yml
          git commit -m 'docs: record approved Windows first-sync repair integration'
          git push origin HEAD:phase6-integration
