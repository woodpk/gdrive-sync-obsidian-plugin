name: Phase 6 Alpha Windows Integration Evidence Finalization

on:
  push:
    branches: [phase6-integration]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase6-integration
          fetch-depth: 0
      - name: Finalize evidence
        shell: bash
        run: bash .github/phase6-alpha-windows-evidence-finalize.sh
