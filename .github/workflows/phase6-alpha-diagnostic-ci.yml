name: Phase 6 Alpha Diagnostic Verification

on:
  pull_request:
    branches: [phase6-integration]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test TypeScript compile
        run: npx tsc -p tsconfig.test.json
      - name: Full tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .ci-evidence
          npm test | tee .ci-evidence/full-tests.tap
      - name: Focused LAT-03 continuation and local safety regressions
        shell: bash
        run: |
          set -o pipefail
          node --test \
            .test-build/test/obsidian-local-vault-evidence-reuse.test.js \
            .test-build/test/obsidian-local-vault-concurrency.test.js \
            .test-build/test/obsidian-local-vault.test.js \
            .test-build/test/phase6-alpha-ios-content-reader.test.js \
            .test-build/test/workstreams/local/local-transaction-safety.test.js \
            .test-build/test/workstreams/local/local-recovery-matrix.test.js \
            | tee .ci-evidence/focused-lat03-continuation-tests.tap
      - name: Focused C1 first-sync conflict-resolution authority tests
        shell: bash
        run: |
          set -o pipefail
          node --test .test-build/test/phase6-a03-first-sync-conflict-resolution-authority.test.js | tee .ci-evidence/focused-c1-tests.tap
      - name: Focused callback, diagnostic, OAuth, and export tests
        shell: bash
        run: |
          set -o pipefail
          node --test .test-build/test/phase3-callback.test.js .test-build/test/phase6-alpha-diagnostic-logging.test.js .test-build/test/phase6-alpha-oauth-diagnostics.test.js .test-build/test/phase6-alpha-ios-oauth-launch.test.js .test-build/test/phase6-alpha-oauth-lifecycle.test.js .test-build/test/phase6-alpha-share-export.test.js | tee .ci-evidence/focused-tests.tap
      - name: Production build
        run: npm run build
      - name: Full repository check
        shell: bash
        run: |
          set -o pipefail
          npm run check | tee .ci-evidence/check.log
      - name: Exact LAT-02 to HEAD diff whitespace check
        run: git diff --check abe4e85b953e2871cae5c2f2e214d721a25007d1..HEAD
      - name: Record artifact identity
        run: |
          wc -c main.js | tee .ci-evidence/main-js-size.txt
          sha256sum main.js | tee .ci-evidence/main-js-sha256.txt
      - name: Upload diagnostic build and verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase6-oauth-housekeeping-verification
          path: |
            main.js
            manifest.json
            .ci-evidence/full-tests.tap
            .ci-evidence/focused-lat03-continuation-tests.tap
            .ci-evidence/focused-c1-tests.tap
            .ci-evidence/focused-tests.tap
            .ci-evidence/check.log
            .ci-evidence/main-js-size.txt
            .ci-evidence/main-js-sha256.txt
          if-no-files-found: error
