name: Phase 6 LOG-03 Exact SHA Verification

on:
  pull_request:
    branches: [phase6-integration]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: 5411d2332881011b5ee6a2437d24a3084099dd7f
      BASE_SHA: 50b263a61334767d2b604b22de341c0c230abdca
    steps:
      - name: Checkout exact LOG-03 implementation SHA
        uses: actions/checkout@v4
        with:
          ref: 5411d2332881011b5ee6a2437d24a3084099dd7f
          fetch-depth: 0
      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Compile tests
        run: npx tsc -p tsconfig.test.json
      - name: Focused LOG-03 tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .ci-evidence
          node --test .test-build/test/phase6-log03-google-drive-semantic-operation-tracing.test.js | tee .ci-evidence/focused-log03-tests.tap
      - name: Full tests
        shell: bash
        run: |
          set -o pipefail
          npm test | tee .ci-evidence/full-tests.tap
      - name: Production build
        run: npm run build
      - name: Exact frozen-base diff check
        run: git diff --check "$BASE_SHA..$TARGET_SHA"
      - name: Record exact verification identity
        run: |
          git rev-parse HEAD | tee .ci-evidence/verified-head.txt
          git diff --name-only "$BASE_SHA..$TARGET_SHA" | tee .ci-evidence/changed-files.txt
          sha256sum main.js | tee .ci-evidence/main-js-sha256.txt
      - name: Upload LOG-03 exact-SHA verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase6-log03-exact-sha-verification
          path: |
            .ci-evidence/focused-log03-tests.tap
            .ci-evidence/full-tests.tap
            .ci-evidence/verified-head.txt
            .ci-evidence/changed-files.txt
            .ci-evidence/main-js-sha256.txt
          if-no-files-found: error
