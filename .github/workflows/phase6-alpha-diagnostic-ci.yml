name: Phase 6 Alpha Diagnostic Verification

on:
  pull_request:
    branches: [phase6-integration]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply bounded LAT-03 continuation repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          helper = Path('.github/workflows/lat03-continuation-02-apply.yml').read_text().splitlines()
          start = helper.index("          python - <<'PY'") + 1
          end = helper.index("          PY", start)
          body = "\n".join(line[10:] if line.startswith("          ") else line for line in helper[start:end])
          exec(compile(body, 'lat03-continuation-02-apply', 'exec'))
          PY
          git checkout 8dae25d3ea620f4fb676b46e72f9fda7fc361e25 -- .github/workflows/phase6-alpha-diagnostic-ci.yml
          rm .github/workflows/lat03-continuation-02-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/local/obsidian-local-vault.ts test/obsidian-local-vault-evidence-reuse.test.ts .github/workflows/phase6-alpha-diagnostic-ci.yml .github/workflows/lat03-continuation-02-apply.yml
          git diff --cached --check
          git commit -m "LAT-03 continuation 02: close async invalidation race"
          git push origin HEAD:phase6-latency-opt-03-run-scoped-local-evidence
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test TypeScript compile
        run: npx tsc -p tsconfig.test.json
      - name: Full tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .ci-evidence
          npm test | tee .ci-evidence/full-tests.tap
      - name: Focused C1 first-sync conflict-resolution authority tests
        shell: bash
        run: |
          set -o pipefail
          node --test .test-build/test/phase6-a03-first-sync-conflict-resolution-authority.test.js | tee .ci-evidence/focused-c1-tests.tap
      - name: Focused callback, diagnostic, OAuth, and export tests
        shell: bash
        run: |
          set -o pipefail
          node --test .test-build/test/phase3-callback.test.js .test-build/test/phase6-alpha-diagnostic-logging.test.js .test-build/test/phase6-alpha-oauth-diagnostics.test.js .test-build/test/phase6-alpha-ios-oauth-launch.test.js .test-build/test/phase6-alpha-oauth-lifecycle.test.js .test-build/test/phase6-alpha-share-export.test.js | tee .ci-evidence/focused-tests.tap
      - name: Production build
        run: npm run build
      - name: Full repository check
        shell: bash
        run: |
          set -o pipefail
          npm run check | tee .ci-evidence/check.log
      - name: Diff whitespace check
        run: git diff --check
      - name: Record artifact identity
        run: |
          wc -c main.js | tee .ci-evidence/main-js-size.txt
          sha256sum main.js | tee .ci-evidence/main-js-sha256.txt
      - name: Upload diagnostic build and verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase6-oauth-housekeeping-verification
          path: |
            main.js
            manifest.json
            .ci-evidence/full-tests.tap
            .ci-evidence/focused-c1-tests.tap
            .ci-evidence/focused-tests.tap
            .ci-evidence/check.log
            .ci-evidence/main-js-size.txt
            .ci-evidence/main-js-sha256.txt
          if-no-files-found: error
