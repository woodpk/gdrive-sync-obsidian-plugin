name: LAT-03 Continuation 02 Final Diff Check

on:
  push:
    branches: [phase6-latency-opt-03-run-scoped-local-evidence]

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase6-latency-opt-03-run-scoped-local-evidence
          fetch-depth: 0
      - name: Exact LAT-02 to HEAD whitespace check
        run: git diff --check abe4e85b953e2871cae5c2f2e214d721a25007d1..HEAD
      - name: Remove temporary validation workflow
        shell: bash
        run: |
          rm .github/workflows/lat03-continuation-02-final-diff.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "LAT-03 continuation 02: remove final diff harness"
          git push origin HEAD:phase6-latency-opt-03-run-scoped-local-evidence
