name: LAT-01 Temporary Frozen-SHA Reproduction

on:
  push:
    branches:
      - phase6-latency-opt-01-measurement-foundation

permissions:
  contents: read

jobs:
  focused-reproduce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen failing SHA
        uses: actions/checkout@v4
        with:
          ref: 177b4d29f60c1ddae1749b65720b944332c1b9b0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Compile test TypeScript
        run: npx tsc -p tsconfig.test.json
      - name: Reproduce focused LAT-01
        id: focused
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p .ci-evidence
          node --test .test-build/test/phase6-latency-measurement-foundation.test.js 2>&1 | tee .ci-evidence/lat01-frozen-177b4d29.log
          status=${PIPESTATUS[0]}
          echo "$status" > .ci-evidence/lat01-exit-code.txt
          exit "$status"
      - name: Upload focused frozen-SHA log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lat01-frozen-177b4d29-focused
          path: |
            .ci-evidence/lat01-frozen-177b4d29.log
            .ci-evidence/lat01-exit-code.txt
          if-no-files-found: error
      - name: Preserve focused result
        if: always()
        shell: bash
        run: |
          status=$(cat .ci-evidence/lat01-exit-code.txt)
          echo "Focused LAT-01 exit code: $status"
          exit "$status"

  full-suite-diagnosis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen failing SHA
        uses: actions/checkout@v4
        with:
          ref: 177b4d29f60c1ddae1749b65720b944332c1b9b0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Compile test TypeScript
        run: npx tsc -p tsconfig.test.json
      - name: Reproduce original full-suite context
        id: full
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p .ci-evidence
          npm test 2>&1 | tee .ci-evidence/full-suite-frozen-177b4d29.log
          status=${PIPESTATUS[0]}
          echo "$status" > .ci-evidence/full-suite-exit-code.txt
          exit "$status"
      - name: Extract first failure context
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.ci-evidence/full-suite-frozen-177b4d29.log')
          text = p.read_text(errors='replace').splitlines()
          needles = ('not ok ', 'AssertionError', 'ERR_ASSERTION', 'failureType:', 'error:')
          hit = next((i for i, line in enumerate(text) if any(n in line for n in needles)), None)
          out = Path('.ci-evidence/first-failure-context.txt')
          if hit is None:
              out.write_text('NO MATCHING FAILURE MARKER FOUND\n')
              print(out.read_text(), end='')
          else:
              lo = max(0, hit - 20)
              hi = min(len(text), hit + 80)
              body = '\n'.join(f'{i+1}: {text[i]}' for i in range(lo, hi)) + '\n'
              out.write_text(body)
              print(body, end='')
          PY
      - name: Upload full-suite diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lat01-frozen-177b4d29-full-suite
          path: |
            .ci-evidence/full-suite-frozen-177b4d29.log
            .ci-evidence/full-suite-exit-code.txt
            .ci-evidence/first-failure-context.txt
          if-no-files-found: error
      - name: Preserve full-suite result
        if: always()
        shell: bash
        run: |
          status=$(cat .ci-evidence/full-suite-exit-code.txt)
          echo "Full-suite exit code: $status"
          exit "$status"
