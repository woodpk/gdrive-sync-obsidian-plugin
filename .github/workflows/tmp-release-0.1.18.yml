name: Temporary 0.1.18 prerelease publisher

on:
  push:
    branches:
      - phase6-prerelease-0.1.18
    paths:
      - .github/workflows/tmp-release-0.1.18.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: 0.1.18
      RELEASE_BRANCH: phase6-prerelease-0.1.18
      PROMOTED_BASE_SHA: 480ccdbd3d28e235e9c83f1020a207c3e39a8f8b
      LAT07_APPROVED_SHA: 6d6b1d192e7cc3fe4fb1dcc919158210e0a2295e
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: phase6-prerelease-0.1.18
          fetch-depth: 0

      - name: Verify exact promoted base ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$PROMOTED_BASE_SHA" HEAD
          test "$(git merge-base "$PROMOTED_BASE_SHA" HEAD)" = "$PROMOTED_BASE_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bump version metadata to 0.1.18
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const specs = [
            ['manifest.json', 1],
            ['package.json', 1],
            ['package-lock.json', 2],
          ];
          for (const [path, expected] of specs) {
            let text = fs.readFileSync(path, 'utf8');
            const needle = '"version": "0.1.9"';
            const count = text.split(needle).length - 1;
            if (count !== expected) {
              throw new Error(`${path}: expected ${expected} occurrences of ${needle}, found ${count}`);
            }
            text = text.split(needle).join('"version": "0.1.18"');
            fs.writeFileSync(path, text);
          }
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (manifest.version !== '0.1.18' || pkg.version !== '0.1.18' || lock.version !== '0.1.18' || lock.packages?.['']?.version !== '0.1.18') {
            throw new Error('version metadata did not converge to 0.1.18');
          }
          NODE
          printf '%s\n' manifest.json package-lock.json package.json > /tmp/expected-files
          git diff --name-only | sort > /tmp/actual-files
          diff -u <(sort /tmp/expected-files) /tmp/actual-files
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Full repository verification
        run: npm run check

      - name: Retain diagnostic OAuth/browser controls regression coverage
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            .test-build/test/phase6-alpha-oauth-diagnostics.test.js \
            .test-build/test/phase6-alpha-ios-oauth-launch.test.js \
            .test-build/test/phase6-alpha-oauth-lifecycle.test.js

      - name: Commit release preparation
        id: prep
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json package.json package-lock.json
          git commit -m 'release: prepare 0.1.18'
          release_sha="$(git rev-parse HEAD)"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          git push origin HEAD:"$RELEASE_BRANCH"

      - name: Build release artifacts and hashes
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          sha256sum main.js manifest.json > release-sha256.txt
          test "$(node -p "require('./manifest.json').version")" = "$RELEASE_VERSION"

      - name: Tag and publish GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail
          release_sha='${{ steps.prep.outputs.release_sha }}'
          git tag "$RELEASE_VERSION" "$release_sha"
          git push origin "refs/tags/$RELEASE_VERSION"
          gh release create "$RELEASE_VERSION" \
            main.js manifest.json release-sha256.txt \
            --prerelease \
            --verify-tag \
            --target "$release_sha" \
            --title '0.1.18 — Phase 6 Latency Optimization Revalidation' \
            --notes "Prerelease for controlled Phase 6 real-device latency revalidation after supervisor-approved LAT-01 through LAT-07 integration. Structural verification passed focused 282/282 and full 822/822 tests before promotion; this release preparation reruns the canonical repository check and diagnostic OAuth/browser regressions. The release preserves serialized physical mutation, authority/CAS and durable-effect safety boundaries, and the diagnostic authorization/browser controls. Approved LAT-07 verification head: $LAT07_APPROVED_SHA. Promoted phase6-integration base: $PROMOTED_BASE_SHA. Real iPhone/iPad latency validation has not yet been performed for this prerelease. The separate known app-switch/lifecycle cancellation defect is not claimed fixed by 0.1.18."

      - name: Remove temporary publisher from release branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-release-0.1.18.yml
          git commit -m 'release: remove temporary 0.1.18 publisher'
          git push origin HEAD:"$RELEASE_BRANCH"
