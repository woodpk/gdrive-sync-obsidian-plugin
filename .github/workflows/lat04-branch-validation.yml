name: LAT-04 Common Base LOG07 Diagnostic

on:
  push:
    branches:
      - phase6-latency-opt-04-precondition-dedup

permissions:
  contents: read

concurrency:
  group: lat04-reject-fix-02
  cancel-in-progress: false

jobs:
  common-base-log07:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 02bc3ba9ded805374303f3b18b0bfc6c7d3ca7c7
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -p tsconfig.test.json
      - name: Run common-base LOG07 verification
        run: node --test .test-build/test/phase6-log07-end-to-end-observability-verification.test.js
