name: LAT-04 Reject Fix 02 Final Validation

on:
  push:
    branches:
      - phase6-latency-opt-04-precondition-dedup

permissions:
  contents: write

concurrency:
  group: lat04-reject-fix-02
  cancel-in-progress: false

jobs:
  repair-verify-close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase6-latency-opt-04-precondition-dedup
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reconstruct bounded Reject Fix 02 source patch
        shell: bash
        run: |
          set -euo pipefail
          COMMON_BASE_SHA=02bc3ba9ded805374303f3b18b0bfc6c7d3ca7c7
          R1_INPUT_SHA=22c7df6f1c879ff790eb546b319c5bfd232335da
          test "$(git merge-base "$COMMON_BASE_SHA" "$R1_INPUT_SHA")" = "$COMMON_BASE_SHA"
          test "$(git merge-base "$R1_INPUT_SHA" HEAD)" = "$R1_INPUT_SHA"
          echo "repair_head=$(git rev-parse HEAD)"
          echo "r1_input=$R1_INPUT_SHA"
          echo "merge_base=$(git merge-base "$COMMON_BASE_SHA" "$R1_INPUT_SHA")"
          echo "status_before_patch:"
          git status --short
          git show 4b70e49f05679f19768152cf6cd959bf926898b2:.github/workflows/lat04-branch-validation.yml > /tmp/lat04-old-workflow.yml
          python - <<'PY'
          from pathlib import Path
          source = Path('/tmp/lat04-old-workflow.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          body = source[start:end]
          indent = min(len(line) - len(line.lstrip()) for line in body if line.strip())
          Path('/tmp/lat04-repair.py').write_text('\n'.join(line[indent:] for line in body) + '\n')
          PY
          python /tmp/lat04-repair.py
          python - <<'PY'
          from pathlib import Path
          path = Path('src/product/authoritative-production-executor-base.ts')
          text = path.read_text()
          old = '''    async execute(operation) {\n      let validation: AuthorityCompletePreconditionValidationResult;'''
          new = '''    async execute(operation: ExecutablePlannedOperation): Promise<ExecutionResult> {\n      let validation: AuthorityCompletePreconditionValidationResult;'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one execute typing target, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/lat04-branch-validation.yml
          rm -f dev/evidence/_lat04-typecheck-debug.txt
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Compile tests
        run: npx tsc -p tsconfig.test.json

      - name: Focused LAT-04 authority destructive and diagnostic tests
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            .test-build/test/workstreams/orchestration/lat04-authoritative-precondition-dedup.test.js \
            .test-build/test/phase2-execution.test.js \
            .test-build/test/workstreams/orchestration/v1.2-authoritative-boundary.test.js \
            .test-build/test/workstreams/orchestration/v1.2-authoritative-commit-lifecycle.test.js \
            .test-build/test/workstreams/orchestration/v1.2-production-authority-path.test.js \
            .test-build/test/workstreams/orchestration/v1.2-production-lifecycle-composition.test.js \
            .test-build/test/workstreams/local/local-transaction-safety.test.js \
            .test-build/test/phase6-b-destructive-safety.test.js \
            .test-build/test/phase6-alpha-ios-sync-diagnostics.test.js | tee /tmp/lat04-focused.tap

      - name: Full repository check
        shell: bash
        run: |
          set -euo pipefail
          npm run check | tee /tmp/lat04-full-check.log

      - name: Final implementation diff check and commit
        shell: bash
        run: |
          set -euo pipefail
          COMMON_BASE_SHA=02bc3ba9ded805374303f3b18b0bfc6c7d3ca7c7
          git diff --check "$COMMON_BASE_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/execution-coordinator.ts \
            src/product/authoritative-production-executor-base.ts \
            src/product/authoritative-production-executor.ts \
            test/workstreams/orchestration/lat04-authoritative-precondition-dedup.test.ts \
            .github/workflows/lat04-branch-validation.yml \
            dev/evidence/_lat04-typecheck-debug.txt
          git commit -m "LAT-04 restore exact validation diagnostic provenance"
          echo "implementation_sha=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Create final LAT-04 evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dev/evidence
          cat > dev/evidence/_ca-output-agt-p6-latency-opt-04.md <<EOF
          # LAT-04 Authoritative Precondition Deduplication Evidence

          - Agent: \`agt-ca-p6-lat04-authoritative-precondition-dedup-01\`
          - Branch: \`phase6-latency-opt-04-precondition-dedup\`
          - COMMON_BASE_SHA: \`02bc3ba9ded805374303f3b18b0bfc6c7d3ca7c7\`
          - R1_INPUT_SHA: \`22c7df6f1c879ff790eb546b319c5bfd232335da\`
          - Final validated implementation/tree parent SHA: \`${implementation_sha}\`
          - Final branch closure SHA: reported in the completion response after this evidence-only commit; embedding a Git commit's own SHA inside that commit is self-referential and not representable.

          ## Final base-to-head changed-file manifest

          - \`src/core/execution-coordinator.ts\`
          - \`src/product/authoritative-production-executor-base.ts\`
          - \`src/product/authoritative-production-executor.ts\`
          - \`src/product/operation-isolation.ts\`
          - \`test/workstreams/orchestration/lat04-authoritative-precondition-dedup.test.ts\`
          - \`dev/evidence/_ca-output-agt-p6-latency-opt-04.md\`

          Temporary validation/debug files \`.github/workflows/lat04-branch-validation.yml\` and \`dev/evidence/_lat04-typecheck-debug.txt\` were removed before final-tree validation and are absent from the final base-to-head diff.

          ## Before / after call chain and validation count

          Before LAT-04, the optimized composition could perform the same full authority-complete validation twice for one unchanged normal physical operation: once in \`AuthorityCompleteExecutionCoordinator.executeOperation()\` and again at the production executor's \`execute()\` boundary. LAT-04 changes the deterministic full-validation count from **2 -> 1** in that composition. The single surviving full validation is \`validateExact()\` at the production executor execute boundary.

          A narrower dispatch guard remains after durable authorization and immediately before physical dispatch. It rechecks volatile ordinary LOCAL observation/token/content-stability and REMOTE revision/object-identity evidence without rerunning BASE/identity/semantic authority resolution. Persisted semantic generation is independently checked again at durable dispatch authorization, so semantic-generation drift fails closed.

          ## Reject/Fix 02 diagnostic-stage correction

          The rejected branch had removed the generic coordinator's original validation try/catch while also moving the optimized production composition to executor-owned validation. Reject/Fix 02 restores the generic catch and adds a private, one-shot execute-boundary throw-provenance handoff. Only an exception thrown while the executor-owned validation boundary is executing can be consumed as \`operation-precondition-validation-failed\`; later pending-journal, content-mutation, uncertain-state-journal, and state-commit failures retain their existing exact stages. No frozen public \`AuthoritativeSynchronizationExecutor\` contract was changed, and the full validation pipeline was not duplicated.

          ## Safety and lifecycle verification

          Focused tests confirm unchanged valid execution; exactly one full authority-resolution pass; LOCAL token race rejection; REMOTE revision race rejection; REMOTE object-identity race rejection; semantic-generation race rejection; stale destructive authority rejection; zero stale physical mutation; verified-not-applied/non-applied guard behavior; and durable lifecycle ordering \`intent-persisted -> dispatch-authorized -> effect-verified -> state-committed\`.

          The direct LAT-04 provenance regression proves an execute-boundary validation throw is reported at \`operation-precondition-validation-failed\` and not \`content-mutation-failed\`. The existing Phase 6 diagnostics test was run unchanged and retains exact precondition, pending-journal, content-mutation, uncertain-state-journal, and state-commit exception stages.

          ## Validation results

          Executed on the final working tree after removing temporary validation/debug files:

          - \`npm ci\`: PASS
          - \`npm run typecheck\`: PASS
          - \`npx tsc -p tsconfig.test.json\`: PASS
          - focused LAT-04 + authority + destructive-safety + Phase 6 diagnostic tests: PASS
          - \`npm run check\`: PASS
          - \`git diff --check 02bc3ba9ded805374303f3b18b0bfc6c7d3ca7c7..HEAD\`: PASS after the evidence closure commit

          No stale-authority or destructive-safety assertion was weakened. Durable intent persistence, dispatch authorization, physical-result classification, verification, canonical commit, and finalization ordering retain their prior meaning. Clean-merge dispatch-guard handling is unchanged from retained LAT-04. Retry/backoff, conflict resolution, local enumeration/concurrency, Drive planning, lifecycle/background behavior, OAuth/PKCE, prepared-authorization diagnostics, and browser diagnostics were not changed.
          EOF

      - name: Re-run full gate on final tree including evidence
        shell: bash
        run: |
          set -euo pipefail
          npm run check | tee /tmp/lat04-final-tree-check.log
          git diff --check 02bc3ba9ded805374303f3b18b0bfc6c7d3ca7c7

      - name: Commit evidence and verify final branch tree
        shell: bash
        run: |
          set -euo pipefail
          git add dev/evidence/_ca-output-agt-p6-latency-opt-04.md
          git commit -m "LAT-04 close Reject Fix 02 evidence"
          FINAL_SHA=$(git rev-parse HEAD)
          echo "final_sha=$FINAL_SHA" >> "$GITHUB_ENV"
          git diff --check 02bc3ba9ded805374303f3b18b0bfc6c7d3ca7c7..HEAD
          test -z "$(git status --short)"
          ! git diff --name-only 02bc3ba9ded805374303f3b18b0bfc6c7d3ca7c7..HEAD | grep -Fx '.github/workflows/lat04-branch-validation.yml'
          ! git diff --name-only 02bc3ba9ded805374303f3b18b0bfc6c7d3ca7c7..HEAD | grep -Fx 'dev/evidence/_lat04-typecheck-debug.txt'
          printf '%s\n' \
            'dev/evidence/_ca-output-agt-p6-latency-opt-04.md' \
            'src/core/execution-coordinator.ts' \
            'src/product/authoritative-production-executor-base.ts' \
            'src/product/authoritative-production-executor.ts' \
            'src/product/operation-isolation.ts' \
            'test/workstreams/orchestration/lat04-authoritative-precondition-dedup.test.ts' | sort > /tmp/expected-final-files.txt
          git diff --name-only 02bc3ba9ded805374303f3b18b0bfc6c7d3ca7c7..HEAD | sort > /tmp/actual-final-files.txt
          diff -u /tmp/expected-final-files.txt /tmp/actual-final-files.txt

      - name: Push final closure
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:phase6-latency-opt-04-precondition-dedup
          echo "LAT04_FINAL_SHA=${final_sha}"
