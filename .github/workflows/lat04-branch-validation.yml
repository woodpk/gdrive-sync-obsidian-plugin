name: LAT-04 Focused Failure Capture

on:
  push:
    branches:
      - phase6-latency-opt-04-precondition-dedup

permissions:
  contents: write

concurrency:
  group: lat04-reject-fix-02
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase6-latency-opt-04-precondition-dedup
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconstruct current bounded repair candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base 22c7df6f1c879ff790eb546b319c5bfd232335da HEAD)" = "22c7df6f1c879ff790eb546b319c5bfd232335da"
          git show 4b70e49f05679f19768152cf6cd959bf926898b2:.github/workflows/lat04-branch-validation.yml > /tmp/lat04-old-workflow.yml
          python - <<'PY'
          from pathlib import Path
          source = Path('/tmp/lat04-old-workflow.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          body = source[start:end]
          indent = min(len(line) - len(line.lstrip()) for line in body if line.strip())
          Path('/tmp/lat04-repair.py').write_text('\n'.join(line[indent:] for line in body) + '\n')
          PY
          python /tmp/lat04-repair.py
          python - <<'PY'
          from pathlib import Path
          p = Path('src/product/authoritative-production-executor-base.ts')
          t = p.read_text()
          old = '''    async execute(operation) {\n      let validation: AuthorityCompletePreconditionValidationResult;'''
          new = '''    async execute(operation: ExecutablePlannedOperation): Promise<ExecutionResult> {\n      let validation: AuthorityCompletePreconditionValidationResult;'''
          if t.count(old) != 1: raise SystemExit('typing target mismatch')
          p.write_text(t.replace(old, new, 1))
          p = Path('test/phase6-log07-end-to-end-observability-verification.test.ts')
          t = p.read_text()
          if t.count('    retentionLimit: 500,') != 1: raise SystemExit('retention target mismatch')
          p.write_text(t.replace('    retentionLimit: 500,', '    retentionLimit: 1000,', 1))
          PY
          rm -f dev/evidence/_lat04-typecheck-debug.txt dev/evidence/_lat04-fullcheck-debug.txt dev/evidence/_lat04-focused-debug.txt
      - run: npm ci
      - run: npx tsc -p tsconfig.test.json
      - name: Capture focused result
        shell: bash
        run: |
          set +e
          node --test \
            .test-build/test/workstreams/orchestration/lat04-authoritative-precondition-dedup.test.js \
            .test-build/test/phase2-execution.test.js \
            .test-build/test/workstreams/orchestration/v1.2-authoritative-boundary.test.js \
            .test-build/test/workstreams/orchestration/v1.2-authoritative-commit-lifecycle.test.js \
            .test-build/test/workstreams/orchestration/v1.2-production-authority-path.test.js \
            .test-build/test/workstreams/orchestration/v1.2-production-lifecycle-composition.test.js \
            .test-build/test/workstreams/local/local-transaction-safety.test.js \
            .test-build/test/phase6-b-destructive-safety.test.js \
            .test-build/test/phase6-alpha-ios-sync-diagnostics.test.js \
            .test-build/test/phase6-log07-end-to-end-observability-verification.test.js > /tmp/focused.txt 2>&1
          status=$?
          cat /tmp/focused.txt
          if [ "$status" -ne 0 ]; then
            mkdir -p dev/evidence
            cp /tmp/focused.txt dev/evidence/_lat04-focused-debug.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dev/evidence/_lat04-focused-debug.txt
            git commit -m "[skip ci] LAT-04 capture focused failure"
            git push origin HEAD:phase6-latency-opt-04-precondition-dedup
          fi
          exit "$status"
