name: LAT-04 Reject Fix 02 Diagnostic

on:
  push:
    branches:
      - phase6-latency-opt-04-precondition-dedup

permissions:
  contents: write

concurrency:
  group: lat04-reject-fix-02
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase6-latency-opt-04-precondition-dedup
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconstruct bounded repair patch
        shell: bash
        run: |
          set -euo pipefail
          COMMON_BASE_SHA=02bc3ba9ded805374303f3b18b0bfc6c7d3ca7c7
          R1_INPUT_SHA=22c7df6f1c879ff790eb546b319c5bfd232335da
          test "$(git merge-base "$COMMON_BASE_SHA" "$R1_INPUT_SHA")" = "$COMMON_BASE_SHA"
          test "$(git merge-base "$R1_INPUT_SHA" HEAD)" = "$R1_INPUT_SHA"
          git show 4b70e49f05679f19768152cf6cd959bf926898b2:.github/workflows/lat04-branch-validation.yml > /tmp/lat04-old-workflow.yml
          python - <<'PY'
          from pathlib import Path
          source = Path('/tmp/lat04-old-workflow.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          body = source[start:end]
          indent = min(len(line) - len(line.lstrip()) for line in body if line.strip())
          Path('/tmp/lat04-repair.py').write_text('\n'.join(line[indent:] for line in body) + '\n')
          PY
          python /tmp/lat04-repair.py
          git diff --check
          rm .github/workflows/lat04-branch-validation.yml
      - name: Install dependencies
        run: npm ci
      - name: Capture typecheck diagnostic
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/lat04-typecheck.txt 2>&1
          status=$?
          cat /tmp/lat04-typecheck.txt
          if [ "$status" -ne 0 ]; then
            mkdir -p dev/evidence
            cp /tmp/lat04-typecheck.txt dev/evidence/_lat04-typecheck-debug.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dev/evidence/_lat04-typecheck-debug.txt
            git commit -m "[skip ci] LAT-04 capture typecheck diagnostic"
            git push origin HEAD:phase6-latency-opt-04-precondition-dedup
            exit "$status"
          fi
