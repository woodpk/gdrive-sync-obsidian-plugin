name: Phase 6 C01 Evidence Finalizer

on:
  pull_request:
    branches:
      - phase6-c01-ios-local-transaction-artifact-path-repair
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  finalize-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: phase6-c01-ios-local-transaction-artifact-path-repair
          fetch-depth: 0

      - name: Verify bounded repair state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "phase6-c01-ios-local-transaction-artifact-path-repair"
          git merge-base --is-ancestor a255d201549f18671113766ff14dde4caa2b8d6c HEAD
          git cat-file -e e5b8f5797e97f4dd102bb19fa3374461a0ab780b^{commit}
          git cat-file -e acf8909e145be7cc3e5db63410cb2be6a355287d^{commit}

      - name: Record evidence and remove finalizer
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d >> dev/evidence/_ca-output.md
          rm .github/workflows/phase6-c01-evidence-finalizer.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/evidence/_ca-output.md .github/workflows/phase6-c01-evidence-finalizer.yml
          git commit -m "docs: record C01 artifact-path repair evidence"
          git push origin HEAD:phase6-c01-ios-local-transaction-artifact-path-repair
