name: PR 31 Continuation Evidence Finalize

on:
  push:
    branches: [phase6-alpha-plan-errors-stability]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase6-alpha-plan-errors-stability
          fetch-depth: 0
      - name: Append execution-history reconciliation and self-remove
        run: |
          export FINALIZER_CREATION_SHA="$GITHUB_SHA"
          python - <<'PY'
          from pathlib import Path
          import os
          creation = os.environ['FINALIZER_CREATION_SHA']
          text = f'''\n\n### Cloud-continuation execution-history reconciliation\n\nThe continuation's repository-side closure history is recorded explicitly:\n\n- `8eada2467fc1d6e92660e3346823eba9e78ce095` — created the first temporary PR31 continuation verifier. Run `33273425975` reached the 35-test selection but produced **31/35** because four runtime-importing relocation tests could not resolve the Obsidian runtime module when the focused files were invoked before the repository's normal full-test harness. The evidence-writing step was skipped. This was a temporary verifier/harness-order failure; no production or test source changed and it is not represented as C1/C2 product failure.\n- `3d3287bcfd647e5687324b30e14e869a30fc612b` — corrected only the temporary verifier order so the normal full repository test harness runs before the same 35-test focused command.\n- continuation verification run `33273517297` — **SUCCESS**: full **358/358 PASS**, focused PR31 repair **35/35 PASS**, typecheck/build/explicit build verification/diff check PASS, five build verifiers PASS, `main.js` `404546` bytes / SHA-256 `c98eb80d9c6d7e90baa925ed8fd8e72e5ca771c0720813e9b8f2fb1e6e42ef01`, Linux `manifest.json` `275` bytes / SHA-256 `79127c33d5e7df64776f0bdd076cf58d37ac53f20de1e4bd533f750273c3e547`.\n- `52f8e8fe6c05798ccb65f4f909504ef3397f4021` — appended the continuation verification/C1/C2 closure to both required evidence files.\n- `b92a2835a26d68ad9e7b3765053c3c7f1ebb8bc2` — removed the temporary continuation verifier from the branch.\n- `{creation}` — created this temporary self-removing evidence-finalizer solely to append this reconciliation. It is removed in the same subsequent evidence commit, so no continuation workflow remains in the final net tree.\n\nThe subsequent evidence-finalization commit cannot contain its own Git hash without self-reference. Its exact SHA is therefore reported in PR #31 metadata and the completion response after GitHub returns it. Across this cloud continuation, **no production source, test source, version metadata, build configuration, dependency, OAuth/Azure behavior, synchronization authority, `phase6-integration`, or `master` was modified**. The final net repository change relative to inherited head `51b270225b94ced2f66e626b97e00853bfdb9218` is limited to these two evidence files.\n\nPhysical iPhone validation: NOT AVAILABLE IN THIS SESSION\n'''
          for raw in [
              'dev/evidence/_ca-output.md',
              'dev/evidence/_ca-output-agt-CA-P6-ALPHA-PLAN-ERRORS-STABILITY-01.md',
          ]:
              p = Path(raw)
              p.write_text(p.read_text(encoding='utf-8') + text, encoding='utf-8')
          PY
          git rm .github/workflows/pr31-continuation-evidence-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/evidence/_ca-output.md dev/evidence/_ca-output-agt-CA-P6-ALPHA-PLAN-ERRORS-STABILITY-01.md
          git diff --cached --check
          git commit -m "docs: finalize PR 31 cloud continuation closure"
          git push origin HEAD:phase6-alpha-plan-errors-stability
