name: LAT-01 Temporary Evidence Precision Fix

on:
  push:
    branches:
      - phase6-latency-opt-01-measurement-foundation

permissions:
  contents: write

jobs:
  fix-evidence:
    if: github.event.head_commit.message != 'Correct LAT-01 frozen failure location evidence'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LAT-01 branch
        uses: actions/checkout@v4
        with:
          ref: phase6-latency-opt-01-measurement-foundation
          fetch-depth: 0
      - name: Verify pre-fix manifest remains bounded
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(dev/evidence/_ca-output-agt-p6-latency-opt-01\.md|test/phase6-latency-measurement-foundation\.test\.ts|\.github/workflows/lat01-temp-evidence-fix\.yml)$'
          unexpected=$(git diff --name-only 02bc3ba9ded805374303f3b18b0bfc6c7d3ca7c7..HEAD | grep -Ev "$allowed" || true)
          if [ -n "$unexpected" ]; then
            printf 'Unexpected diff before evidence correction:\n%s\n' "$unexpected"
            exit 1
          fi
      - name: Correct exact frozen failure location
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('dev/evidence/_ca-output-agt-p6-latency-opt-01.md')
          text = p.read_text()
          old = 'The compiled stack location was `.test-build/test/phase6-latency-measurement-foundation.test.js:119:12`.'
          new = 'The compiled test location was `.test-build/test/phase6-latency-measurement-foundation.test.js:79:25`; the assertion stack location was `.test-build/test/phase6-latency-measurement-foundation.test.js:83:22`.'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one provisional location sentence, found {count}')
          p.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- dev/evidence/_ca-output-agt-p6-latency-opt-01.md
      - name: Commit evidence-only correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dev/evidence/_ca-output-agt-p6-latency-opt-01.md
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git diff --cached --name-only | grep -Fx 'dev/evidence/_ca-output-agt-p6-latency-opt-01.md'
          git commit -m 'Correct LAT-01 frozen failure location evidence'
          git push origin HEAD:phase6-latency-opt-01-measurement-foundation
