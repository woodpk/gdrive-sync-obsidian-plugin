name: LAT-01 Temporary Apply Bounded Fixture Fix

on:
  push:
    branches:
      - phase6-latency-opt-01-measurement-foundation

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event.head_commit.message != 'Fix LAT-01 stability-window fixture counter'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LAT-01 branch
        uses: actions/checkout@v4
        with:
          ref: phase6-latency-opt-01-measurement-foundation
          fetch-depth: 0
      - name: Verify bounded pre-fix diff
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(test/phase6-latency-measurement-foundation\.test\.ts|\.github/workflows/lat01-temp-repro\.yml|\.github/workflows/lat01-temp-apply-fix\.yml)$'
          unexpected=$(git diff --name-only 02bc3ba9ded805374303f3b18b0bfc6c7d3ca7c7..HEAD | grep -Ev "$allowed" || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected diff before bounded fix:"
            echo "$unexpected"
            exit 1
          fi
      - name: Apply exact fixture correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('test/phase6-latency-measurement-foundation.test.ts')
          text = p.read_text()
          old = 'if (call % 2 === 2) {'
          new = 'if (call % 2 === 0) {'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one frozen defect occurrence, found {count}')
          p.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- test/phase6-latency-measurement-foundation.test.ts
      - name: Commit bounded test-only correction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/phase6-latency-measurement-foundation.test.ts
          git diff --cached --name-only | grep -Fx 'test/phase6-latency-measurement-foundation.test.ts'
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m 'Fix LAT-01 stability-window fixture counter'
          git push origin HEAD:phase6-latency-opt-01-measurement-foundation
