name: Rebuild canonical BRAIN BVP 0.1.20-bvp.3 diagnostic

on:
  push:
    branches:
      - release/bvp-0.1.20-bvp.3-canonical-20261116
    paths:
      - .github/workflows/publish-bvp-0.1.20-bvp.3.yml

permissions:
  contents: read

concurrency:
  group: rebuild-bvp-0.1.20-bvp.3-diagnostic
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    env:
      REPOSITORY: woodpk/gdrive-sync-obsidian-plugin
      SOURCE_SHA: dedd783c1ce6efa1abd2bd5f34ed4e499321558e
      SOURCE_TREE: 3529e43d003d0af823b3b115e82948134f1298d2
      VERSION: 0.1.20-bvp.3
      BVP_VALIDATION_PRERELEASE_VERSION: 0.1.20-bvp.3
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out exact canonical source
        uses: actions/checkout@v4
        with:
          repository: woodpk/gdrive-sync-obsidian-plugin
          ref: dedd783c1ce6efa1abd2bd5f34ed4e499321558e
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Confirm exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C source rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          test -z "$(git -C source status --porcelain=v1 --untracked-files=all)"

      - name: Install locked dependencies
        working-directory: source
        run: npm ci --no-audit --no-fund

      - name: Rebuild exact BVP validation package
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          node node_modules/typescript/bin/tsc -p test-platform/tsconfig.json
          node .test-build/bvp/test-platform/src/build-validation-artifact.js
          mkdir -p .diagnostic/rebuilt
          cp .test-build/bvp-live-device/plugin/main.js .diagnostic/rebuilt/main.js
          cp .test-build/bvp-live-device/plugin/manifest.json .diagnostic/rebuilt/manifest.json
          cp .test-build/bvp-live-device/plugin/build-identity.json .diagnostic/rebuilt/build-identity.json
          (
            cd .diagnostic/rebuilt
            sha256sum main.js manifest.json build-identity.json > release-sha256.txt
          )
          node --check .diagnostic/rebuilt/main.js

      - name: Download published comparison artifacts
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          mkdir -p .diagnostic/published-bvp3 .diagnostic/working-bvp1
          gh release download 0.1.20-bvp.3 --repo "$REPOSITORY" --dir .diagnostic/published-bvp3
          gh release download 0.1.20-bvp.1 --repo "$REPOSITORY" --dir .diagnostic/working-bvp1

      - name: Produce deterministic comparison report
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          report=.diagnostic/rebuild-report.txt
          {
            echo "BRAIN BVP 0.1.20-bvp.3 CONTROLLED REBUILD"
            echo "SOURCE_SHA=$SOURCE_SHA"
            echo "SOURCE_TREE=$SOURCE_TREE"
            echo "RUNNER_NODE=$(node --version)"
            echo
            echo "=== REBUILT FILES ==="
            stat -c '%n size=%s' .diagnostic/rebuilt/main.js .diagnostic/rebuilt/manifest.json .diagnostic/rebuilt/build-identity.json .diagnostic/rebuilt/release-sha256.txt
            sha256sum .diagnostic/rebuilt/main.js .diagnostic/rebuilt/manifest.json .diagnostic/rebuilt/build-identity.json .diagnostic/rebuilt/release-sha256.txt
            echo
            echo "=== PUBLISHED BVP.3 FILES ==="
            stat -c '%n size=%s' .diagnostic/published-bvp3/main.js .diagnostic/published-bvp3/manifest.json .diagnostic/published-bvp3/build-identity.json .diagnostic/published-bvp3/release-sha256.txt
            sha256sum .diagnostic/published-bvp3/main.js .diagnostic/published-bvp3/manifest.json .diagnostic/published-bvp3/build-identity.json .diagnostic/published-bvp3/release-sha256.txt
            echo
            echo "=== WORKING BVP.1 FILES ==="
            stat -c '%n size=%s' .diagnostic/working-bvp1/main.js .diagnostic/working-bvp1/manifest.json .diagnostic/working-bvp1/build-identity.json .diagnostic/working-bvp1/release-sha256.txt
            sha256sum .diagnostic/working-bvp1/main.js .diagnostic/working-bvp1/manifest.json .diagnostic/working-bvp1/build-identity.json .diagnostic/working-bvp1/release-sha256.txt
            echo
            echo "=== BYTE COMPARISONS ==="
            if cmp -s .diagnostic/rebuilt/main.js .diagnostic/published-bvp3/main.js; then echo "REBUILT_MAIN_EQUALS_PUBLISHED_BVP3=YES"; else echo "REBUILT_MAIN_EQUALS_PUBLISHED_BVP3=NO"; fi
            if cmp -s .diagnostic/rebuilt/manifest.json .diagnostic/published-bvp3/manifest.json; then echo "REBUILT_MANIFEST_EQUALS_PUBLISHED_BVP3=YES"; else echo "REBUILT_MANIFEST_EQUALS_PUBLISHED_BVP3=NO"; fi
            if cmp -s .diagnostic/rebuilt/build-identity.json .diagnostic/published-bvp3/build-identity.json; then echo "REBUILT_IDENTITY_EQUALS_PUBLISHED_BVP3=YES"; else echo "REBUILT_IDENTITY_EQUALS_PUBLISHED_BVP3=NO"; fi
            if cmp -s .diagnostic/rebuilt/main.js .diagnostic/working-bvp1/main.js; then echo "REBUILT_MAIN_EQUALS_WORKING_BVP1=YES"; else echo "REBUILT_MAIN_EQUALS_WORKING_BVP1=NO"; fi
            echo
            echo "=== RUNTIME STRING CHECKS ==="
            for s in "BRAIN Google Drive Sync" "Sync now" "Authenticate with Google" "BRAIN sync:"; do
              if grep -Fq "$s" .diagnostic/rebuilt/main.js; then echo "PRESENT: $s"; else echo "MISSING: $s"; fi
            done
          } | tee "$report"

      - name: Upload rebuilt package and report
        uses: actions/upload-artifact@v4
        with:
          name: bvp-0.1.20-bvp.3-controlled-rebuild
          path: |
            source/.diagnostic/rebuilt/
            source/.diagnostic/rebuild-report.txt
          if-no-files-found: error
          retention-days: 7
