name: H-U5-P3 Scenario-9 Diagnostic

on:
  push:
    branches:
      - h-u5-p3-group-d-first-sync-proof-h05-final3

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: d48be2891b0527cc9950a09d2cc5f35920293a87
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Compile exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "d48be2891b0527cc9950a09d2cc5f35920293a87"
          npm ci
          npx tsc -p tsconfig.test.json
      - name: Run scenario 9 with read-only runtime diagnostics
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/h-u5-p3-s9-diag.cjs <<'EOF'
          const snap = require(process.cwd() + '/.test-build/src/product/snapshot-assembler.js');
          const proto = snap.ProductSnapshotAssembler.prototype;
          for (const method of ['assemble', 'assembleFull']) {
            const original = proto[method];
            proto[method] = async function(...args) {
              const value = await original.apply(this, args);
              console.error('H_U5_P3_ASSEMBLY=' + JSON.stringify({method, mode:value.mode, nextCursor:value.nextCursor, state:value.input.state.status, snapshots:value.input.snapshots.map(s => ({path:s.path, local:s.local.status, remote:s.remote.status, remoteId:s.remote.status==='present'?s.remote.remoteObjectId:undefined, remoteReason:s.remote.status==='unknown'?s.remote.reason:undefined, base:s.base.status==='trusted'?s.base.entry?.remoteObjectId:undefined}))}));
              return value;
            };
          }
          const base = require(process.cwd() + '/.test-build/src/product/product-controller-base.js');
          const cp = base.IntegratedProductController.prototype;
          const originalAuto = cp.runAutomatic;
          cp.runAutomatic = async function(trigger) {
            try { return await originalAuto.call(this, trigger); }
            finally { console.error('H_U5_P3_SURFACE=' + JSON.stringify({trigger, surface:this.currentSurface()})); }
          };
          EOF
          set +e
          NODE_OPTIONS="--require=/tmp/h-u5-p3-s9-diag.cjs" node --test --test-name-pattern="G2 scenario 9" .test-build/test/phase5-group-d-first-sync-integration.test.js 2>&1 | tee diagnostic.log
          code=${PIPESTATUS[0]}
          set -e
          echo "diagnostic_exit=$code" | tee diagnostic-exit.txt
          exit 0
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-u5-p3-scenario9-diagnostic
          path: |
            diagnostic.log
            diagnostic-exit.txt
          if-no-files-found: error
