name: Publish 0.1.16 Mobile OAuth Fix Prerelease

on:
  push:
    branches:
      - release-0.1.16-publisher
    paths:
      - .github/workflows/publish-0.1.16-mobile-oauth-fix-prerelease.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: a43044d1331c21fa2c876249ce03e597f311b9b5
      RELEASE_BRANCH: release-0.1.16-ios-oauth-fix
      RELEASE_TAG: 0.1.16
    steps:
      - name: Checkout exact merged integration SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Prepare versioned release commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version 0.1.16 --no-git-tag-version
          node - <<'NODE'
          const fs = require('fs');
          const path = 'manifest.json';
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          manifest.version = '0.1.16';
          fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n');
          NODE
          git add manifest.json package.json package-lock.json
          git diff --cached --check
          git commit -m "release: prepare 0.1.16"
          echo "PREP_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Full tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Repository checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -f main.js
          test -f manifest.json
          node -e 'const m=require("./manifest.json"); if(m.version!=="0.1.16") process.exit(1)'
          sha256sum main.js manifest.json | tee release-sha256.txt

      - name: Push immutable release-preparation commit and tag
        shell: bash
        run: |
          set -euo pipefail
          git push origin "$PREP_SHA:refs/heads/$RELEASE_BRANCH"
          git tag "$RELEASE_TAG" "$PREP_SHA"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" main.js manifest.json release-sha256.txt \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "0.1.16 — iOS OAuth Two-Tap Authentication Fix" \
            --notes "Prerelease implementing the production iOS OAuth fresh-tap repair proven by 0.1.15 diagnostics. On mobile, Authenticate now securely prepares the real PKCE/OAuth transaction on the first tap and opens the prepared Google authorization URL on a second fresh tap. Desktop authentication remains unchanged. All diagnostic buttons and functions from 0.1.15 are retained and remain independently usable. Source merged integration SHA: $TARGET_SHA. Release-preparation SHA: $PREP_SHA."

      - name: Verify published prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,name,url,targetCommitish
