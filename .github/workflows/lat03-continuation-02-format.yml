name: LAT-03 Continuation 02 Formatting Cleanup

on:
  push:
    branches: [phase6-latency-opt-03-run-scoped-local-evidence]

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase6-latency-opt-03-run-scoped-local-evidence
          fetch-depth: 0
      - name: Restore normal private-method indentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('src/local/obsidian-local-vault.ts')
          text = path.read_text()
          replacement = '''  private async reusableReadOnlyObservation(path: VaultPath, expectedToken: ObservationToken): Promise<LocalObservation | undefined> {
            const safe = await this.safePath(path, "observe");
            const key = String(safe);
            const cached = this.reusableStableObservations.get(key);
            if (!cached || cached.epoch !== this.observationEpoch || cached.token !== expectedToken) return undefined;
            const generation = this.generationFor(safe);
            if (generation !== cached.generation) {
              this.reusableStableObservations.delete(key);
              return undefined;
            }
            const discardCachedIfSame = (): void => {
              if (this.reusableStableObservations.get(key) === cached) this.reusableStableObservations.delete(key);
            };
            let current: Stat | null;
            try {
              current = await this.adapter.stat(key);
            } catch {
              discardCachedIfSame();
              return undefined;
            }
            const currentGeneration = this.generationFor(safe);
            if (
              this.observationEpoch !== cached.epoch ||
              currentGeneration !== cached.generation ||
              this.reusableStableObservations.get(key) !== cached ||
              !current ||
              current.type !== "file" ||
              !sameStat(current, cached.stat) ||
              statToken(key, current, currentGeneration) !== expectedToken
            ) {
              discardCachedIfSame();
              return undefined;
            }
            return cached.observation;
          }

'''
          pattern = re.compile(
              r'  private async reusableReadOnlyObservation\(path: VaultPath, expectedToken: ObservationToken\): Promise<LocalObservation \| undefined> \{.*?\n\}\n(?=  private async writeIncremental)',
              re.S,
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one formatting target, replaced {count}')
          path.write_text(text)
          PY
          rm .github/workflows/lat03-continuation-02-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "LAT-03 continuation 02: normalize repair formatting"
          git push origin HEAD:phase6-latency-opt-03-run-scoped-local-evidence
