name: One-shot prerelease 0.1.14 publication

on:
  push:
    branches:
      - release-0.1.14-exec

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_INPUT_SHA: 7181853a101e2c320d902642fe0a9be0c9e7ecde
      RELEASE_BRANCH: phase6-real-platform-release-0.1.14
      TAG: 0.1.14
      TITLE: 0.1.14 — Phase 6 Synchronization Preview Grouping

    steps:
      - name: Checkout exact approved integration source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_INPUT_SHA }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare or resume frozen release commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --tags
          test "$(git rev-parse HEAD)" = "$RELEASE_INPUT_SHA"

          gh release view 0.1.13 --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease > /tmp/preceding-release.json
          node - <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('/tmp/preceding-release.json', 'utf8'));
          if (r.tagName !== '0.1.13' || r.isDraft !== false || r.isPrerelease !== true) {
            throw new Error('0.1.13 release authority mismatch');
          }
          NODE

          if git ls-remote --exit-code --heads origin "$RELEASE_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$RELEASE_BRANCH"
            git checkout -B "$RELEASE_BRANCH" "origin/$RELEASE_BRANCH"
          else
            git switch -c "$RELEASE_BRANCH"
            npm version "$TAG" --no-git-tag-version --allow-same-version
            node - <<'NODE'
            const fs = require('fs');
            const path = 'manifest.json';
            const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
            manifest.version = '0.1.14';
            fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n');
            NODE

            changed="$(git diff --name-only)"
            test "$changed" = $'manifest.json\npackage-lock.json\npackage.json'
            git diff --check
            git add manifest.json package.json package-lock.json
            git commit -m "release: prepare 0.1.14"
            git push origin "HEAD:$RELEASE_BRANCH"
          fi

          PREP_SHA="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$RELEASE_INPUT_SHA"
          test "$(node -p "require('./manifest.json').version")" = "$TAG"
          test "$(node -p "require('./package.json').version")" = "$TAG"
          test "$(node -p "require('./package-lock.json').version")" = "$TAG"
          test "$(node -p "require('./package-lock.json').packages[''].version")" = "$TAG"
          test "$(node -p "require('./manifest.json').id")" = "brain-google-drive-sync"
          test "$(node -p "String(require('./manifest.json').isDesktopOnly)")" = "false"

          changed="$(git diff --name-only "$RELEASE_INPUT_SHA...$PREP_SHA")"
          test "$changed" = $'manifest.json\npackage-lock.json\npackage.json'
          git diff --check "$RELEASE_INPUT_SHA...$PREP_SHA"

          remote_prep="$(git ls-remote origin "refs/heads/$RELEASE_BRANCH" | awk '{print $1}')"
          test "$remote_prep" = "$PREP_SHA"
          echo "PREP_SHA=$PREP_SHA" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Compile test TypeScript
        run: npx tsc -p tsconfig.test.json

      - name: Full automated test suite
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          npm test 2>&1 | tee /tmp/full-test.log
          tests="$(awk '/^# tests / {v=$3} END {print v}' /tmp/full-test.log)"
          pass="$(awk '/^# pass / {v=$3} END {print v}' /tmp/full-test.log)"
          fail="$(awk '/^# fail / {v=$3} END {print v}' /tmp/full-test.log)"
          test -n "$tests"
          test "$pass" = "$tests"
          test "$fail" = "0"
          if grep -q '^not ok ' /tmp/full-test.log; then exit 1; fi
          echo "FULL_TEST_COUNT=$tests" >> "$GITHUB_ENV"

      - name: Focused synchronization-preview grouping tests
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          test -f .test-build/test/plan-presentation.test.js
          node --test .test-build/test/plan-presentation.test.js 2>&1 | tee /tmp/preview-test.log
          tests="$(awk '/^# tests / {v=$3} END {print v}' /tmp/preview-test.log)"
          pass="$(awk '/^# pass / {v=$3} END {print v}' /tmp/preview-test.log)"
          fail="$(awk '/^# fail / {v=$3} END {print v}' /tmp/preview-test.log)"
          test -n "$tests"
          test "$pass" = "$tests"
          test "$fail" = "0"
          if grep -q '^not ok ' /tmp/preview-test.log; then exit 1; fi
          echo "PREVIEW_TEST_COUNT=$tests" >> "$GITHUB_ENV"

      - name: Production build
        run: npm run build

      - name: Full repository check
        run: npm run check

      - name: Diff whitespace check
        run: git diff --check

      - name: Record frozen release artifact identity
        shell: bash
        run: |
          set -euo pipefail
          test -s main.js
          node -e "const m=require('./manifest.json'); if(m.version!=='0.1.14'||m.id!=='brain-google-drive-sync'||m.isDesktopOnly!==false) process.exit(1)"
          main_sha="$(sha256sum main.js | awk '{print $1}')"
          manifest_sha="$(sha256sum manifest.json | awk '{print $1}')"
          main_size="$(stat -c %s main.js)"
          manifest_size="$(stat -c %s manifest.json)"
          echo "MAIN_SHA256=$main_sha" >> "$GITHUB_ENV"
          echo "MAIN_SIZE=$main_size" >> "$GITHUB_ENV"
          echo "MANIFEST_SHA256=$manifest_sha" >> "$GITHUB_ENV"
          echo "MANIFEST_SIZE=$manifest_size" >> "$GITHUB_ENV"
          printf 'main.js sha256=%s size=%s\nmanifest.json sha256=%s size=%s\n' "$main_sha" "$main_size" "$manifest_sha" "$manifest_size"

      - name: Create or verify immutable tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --tags
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            existing="$(git rev-parse "$TAG^{commit}")"
            test "$existing" = "$PREP_SHA"
          else
            git tag "$TAG" "$PREP_SHA"
            git push origin "refs/tags/$TAG"
          fi
          git fetch origin --tags
          test "$(git rev-parse "$TAG^{commit}")" = "$PREP_SHA"

      - name: Prepare release notes
        shell: bash
        run: |
          cat > /tmp/release-notes.md <<EOF
          Phase 6 prerelease containing the synchronization-preview presentation improvement merged through PR #80.

          The dry-run preview now groups planned operations into collapsible Vault changes, System / portable configuration, and Unchanged vault paths sections. This is presentation-only: the synchronization plan, execution ordering/authority, safety gates, and durable-effect semantics are unchanged.

          Verification before publication:
          - independent adversarial review: APPROVE
          - full automated suite: ${FULL_TEST_COUNT}/${FULL_TEST_COUNT} PASS
          - focused preview-grouping suite: ${PREVIEW_TEST_COUNT}/${PREVIEW_TEST_COUNT} PASS
          - typecheck: PASS
          - test TypeScript compile: PASS
          - production build: PASS
          - full repository check: PASS
          - release-preparation diff limited to manifest.json, package.json, and package-lock.json
          EOF

      - name: Publish or resume GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.id')"
            body="$(cat /tmp/release-notes.md)"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              -f name="$TITLE" \
              -f body="$body" \
              -F draft=false \
              -F prerelease=true >/dev/null
            gh release upload "$TAG" main.js manifest.json \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG" main.js manifest.json \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes-file /tmp/release-notes.md \
              --prerelease \
              --verify-tag
          fi

      - name: Verify published prerelease and downloaded assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/release-download
          mkdir -p /tmp/release-download
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json databaseId,name,tagName,isDraft,isPrerelease,url,assets > /tmp/release.json
          node - <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('/tmp/release.json', 'utf8'));
          if (r.tagName !== '0.1.14') throw new Error('wrong tag');
          if (r.name !== '0.1.14 — Phase 6 Synchronization Preview Grouping') throw new Error('wrong title');
          if (r.isDraft !== false) throw new Error('release is draft');
          if (r.isPrerelease !== true) throw new Error('release is not prerelease');
          const names = (r.assets || []).map(a => a.name).sort();
          if (JSON.stringify(names) !== JSON.stringify(['main.js','manifest.json'])) {
            throw new Error('wrong custom asset set: ' + JSON.stringify(names));
          }
          NODE
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir /tmp/release-download --pattern main.js --pattern manifest.json
          test "$(sha256sum /tmp/release-download/main.js | awk '{print $1}')" = "$MAIN_SHA256"
          test "$(stat -c %s /tmp/release-download/main.js)" = "$MAIN_SIZE"
          test "$(sha256sum /tmp/release-download/manifest.json | awk '{print $1}')" = "$MANIFEST_SHA256"
          test "$(stat -c %s /tmp/release-download/manifest.json)" = "$MANIFEST_SIZE"
          test "$(node -p "require('/tmp/release-download/manifest.json').version")" = "$TAG"
          test "$(node -p "require('/tmp/release-download/manifest.json').id")" = "brain-google-drive-sync"
          remote_tag="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
          test "$remote_tag" = "$PREP_SHA"

      - name: Record publication verification artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publication-verification
          cp /tmp/release.json publication-verification/release.json
          cp /tmp/release-notes.md publication-verification/release-notes.md
          cp /tmp/full-test.log publication-verification/full-test.log
          cp /tmp/preview-test.log publication-verification/preview-test.log
          cp /tmp/release-download/main.js publication-verification/published-main.js
          cp /tmp/release-download/manifest.json publication-verification/published-manifest.json
          printf '%s  main.js\n' "$MAIN_SHA256" > publication-verification/main-js-sha256.txt
          printf '%s\n' "$MAIN_SIZE" > publication-verification/main-js-size.txt
          printf '%s  manifest.json\n' "$MANIFEST_SHA256" > publication-verification/manifest-sha256.txt
          printf '%s\n' "$MANIFEST_SIZE" > publication-verification/manifest-size.txt
          printf '%s\n' "$PREP_SHA" > publication-verification/prep-sha.txt

      - name: Upload publication verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: prerelease-0.1.14-publication-verification
          path: publication-verification
          if-no-files-found: error
