### Confirmed defect 1 — cross-platform-equivalent relocation

Status: **FIXED**.

`sync-plan-errors-path.ts` now compares complete final CSV locations using the repository's NFC-normalized, case-folded `normalizedComparisonPath` semantics. Literal-different but cross-platform-equivalent source/destination locations are rejected before a durable relocation journal or destination/source filesystem mutation can occur. Persisted relocation journals receive the same defensive rejection. `SyncPlanErrorsCsvPersistence` also rejects an equivalent destination and refuses source cleanup when the source is equivalent to the active CSV.

Regression coverage uses a normalization-aware in-memory adapter whose physical keys are NFC/case-folded, proving case-only and Unicode-equivalent spellings collide meaningfully, no write/rename/remove occurs, no durable journal is accepted, and the original CSV/records survive.

### Confirmed defect 2 — incomplete operational-path validation

Status: **FIXED**.

Canonical/stage/backup path construction is centralized as:

- `<path>`
- `<path>.brain-sync-stage`
- `<path>.brain-sync-backup`

`resolveSyncPlanErrorsPath()` now validates all three complete paths through the existing cross-platform path policy before a directory setting is accepted. Root/default and normal directories remain valid. Persisted relocation journal paths are re-derived through the same resolver, so canonical and transaction-path length violations are rejected before relocation state is accepted.

Regression coverage proves: root/default acceptance; normal-directory acceptance; a directory that fits while the canonical CSV crosses the limit is rejected; a canonical path that fits while backup/stage transaction length crosses the conservative Windows limit is rejected; invalid journal paths are rejected before durable relocation state/filesystem mutation.

### Confirmed defect 3 — valid destination history overwrite

Status: **FIXED**.

Relocation now recovers source and destination independently. A valid pre-existing destination is merged deterministically rather than replaced. Merge identity is the existing attention-record key; matching records use maximum occurrence count rather than incrementing on relocation/restart, earliest first-seen, latest last-seen, and current/unresolved dominance. Every current unresolved record is retained. Resolved records are bounded under the existing `DEFAULT_SYNC_ATTENTION_RETENTION` policy. The merged destination is written, re-read, and validated before active-location commit and source cleanup. Invalid/unrecoverable destination state fails safely without overwrite; source and durable relocation protection remain available for recovery.

Regression coverage proves A+B preservation, no fake occurrence increments, current and resolved-history preservation, bounded resolved history, restart re-merge idempotence, invalid-destination non-overwrite, and source cleanup only after durable validated destination plus active-location commit.

One prior C1 restart assertion was intentionally updated because it expected a valid pre-existing destination record to be discarded. Under this rejection's defect #3 requirement, preserving that valid destination record is now the correct invariant.

