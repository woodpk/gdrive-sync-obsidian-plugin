name: PR31 Rejection Repair Evidence Finalizer

on:
  push:
    branches: [phase6-alpha-plan-errors-stability]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase6-alpha-plan-errors-stability
          fetch-depth: 0
      - name: Append rejection evidence and self-remove
        run: |
          cat .github/pr31-rejection-evidence.md >> dev/evidence/_ca-output.md
          cat .github/pr31-rejection-evidence.md >> dev/evidence/_ca-output-agt-CA-P6-ALPHA-PLAN-ERRORS-STABILITY-01.md
          rm .github/pr31-rejection-evidence.md
          rm .github/workflows/pr31-rejection-evidence-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: append PR 31 rejection repair evidence"
          git push origin HEAD:phase6-alpha-plan-errors-stability
