name: PR31 Rejection Test Adjustment

on:
  push:
    branches: [phase6-alpha-plan-errors-stability]

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase6-alpha-plan-errors-stability
      - name: Update stale destination-discard expectation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('test/phase6-alpha-plan-errors-stability.test.ts')
          text = path.read_text()
          old = '''    assert.equal(vault.files.has(source), false);\n    assert.deepEqual(parseSyncAttentionRecordsCsv(vault.files.get(destination)!).map(record => String(record.path)), ["preserved.md"]);\n    for (const snapshot of recovered.persisted.filter(value => value.syncPlanErrorsRelocation)) {'''
          new = '''    assert.equal(vault.files.has(source), false);\n    const recoveredPaths = parseSyncAttentionRecordsCsv(vault.files.get(destination)!).map(record => String(record.path));\n    const expectedPaths = scenario.destinationExists && !scenario.activeDirectory\n      ? ["preserved.md", "uncommitted-destination.md"]\n      : ["preserved.md"];\n    assert.deepEqual(new Set(recoveredPaths), new Set(expectedPaths), "restart preserves every valid source/destination record");\n    for (const snapshot of recovered.persisted.filter(value => value.syncPlanErrorsRelocation)) {'''
          if old not in text:
              raise SystemExit('target assertion not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/pr31-rejection-test-adjust.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/phase6-alpha-plan-errors-stability.test.ts .github/workflows/pr31-rejection-test-adjust.yml
          git diff --cached --check
          git commit -m "test: preserve valid destination history in restart expectation"
          git push origin HEAD:phase6-alpha-plan-errors-stability
