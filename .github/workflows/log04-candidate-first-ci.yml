name: LOG-04 Attributed Correction Verification

on:
  push:
    branches:
      - ci-log04-continuation-harness
    paths:
      - .github/workflows/log04-candidate-first-ci.yml

permissions:
  contents: write

jobs:
  correct-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4
        with:
          ref: ci-log04-continuation-harness
          fetch-depth: 0
          path: harness

      - name: Checkout exact LOG-04 implementation input
        uses: actions/checkout@v4
        with:
          ref: 3d81e61252f82957f8a0eaf1cd9e9f372ec49f86
          fetch-depth: 0
          path: repo

      - name: Correct, commit, verify, and record evidence
        shell: bash
        run: bash harness/.ci-harness/log04-correct-and-verify.sh
