name: LOG-04 Fresh Exact-SHA Verification

on:
  push:
    branches: [ci-log04-continuation-harness]
    paths: [.github/workflows/log04-candidate-first-ci.yml]

permissions:
  contents: write

jobs:
  verify-exact-sha:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact LOG-04 implementation SHA
        uses: actions/checkout@v4
        with:
          ref: 3d81e61252f82957f8a0eaf1cd9e9f372ec49f86
          fetch-depth: 0
          path: repo

      - name: Verify immutable input and frozen base
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          SHA=3d81e61252f82957f8a0eaf1cd9e9f372ec49f86
          BASE=48d9e612b69b43be9941f97630c580c2b8aed929
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          REMOTE_HEAD=$(git ls-remote origin refs/heads/phase6-logging-log04-sync-execution-durable-effect-tracing | awk '{print $1}')
          test "$REMOTE_HEAD" = "$SHA"
          echo "Verified exact implementation SHA: $SHA"

      - name: npm ci
        working-directory: repo
        run: npm ci

      - name: Typecheck
        working-directory: repo
        run: npm run typecheck

      - name: Compile test tree
        working-directory: repo
        run: npx tsc -p tsconfig.test.json

      - name: Focused LOG-04 suite
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-evidence
          node --test .test-build/test/workstreams/orchestration/log04-execution-diagnostics.test.js 2>&1 | tee .ci-evidence/log04-focused.tap
          TESTS=$(grep -E '^# tests [0-9]+$' .ci-evidence/log04-focused.tap | tail -1 | awk '{print $3}')
          PASS=$(grep -E '^# pass [0-9]+$' .ci-evidence/log04-focused.tap | tail -1 | awk '{print $3}')
          FAIL=$(grep -E '^# fail [0-9]+$' .ci-evidence/log04-focused.tap | tail -1 | awk '{print $3}')
          test "$TESTS" = "10"
          test "$PASS" = "10"
          test "$FAIL" = "0"
          echo "FOCUSED_TESTS=$TESTS" >> "$GITHUB_ENV"
          echo "FOCUSED_PASS=$PASS" >> "$GITHUB_ENV"
          echo "FOCUSED_FAIL=$FAIL" >> "$GITHUB_ENV"

      - name: Complete npm test with preserved stdout stderr and exit status
        working-directory: repo
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .ci-evidence
          set +e
          npm test > .ci-evidence/full-tests.log 2>&1
          STATUS=$?
          set -e
          cat .ci-evidence/full-tests.log
          TESTS=$(grep -E '^# tests [0-9]+$' .ci-evidence/full-tests.log | tail -1 | awk '{print $3}' || true)
          PASS=$(grep -E '^# pass [0-9]+$' .ci-evidence/full-tests.log | tail -1 | awk '{print $3}' || true)
          FAIL=$(grep -E '^# fail [0-9]+$' .ci-evidence/full-tests.log | tail -1 | awk '{print $3}' || true)
          echo "FULL_EXIT=$STATUS" >> "$GITHUB_ENV"
          echo "FULL_TESTS=${TESTS:-N/A}" >> "$GITHUB_ENV"
          echo "FULL_PASS=${PASS:-N/A}" >> "$GITHUB_ENV"
          echo "FULL_FAIL=${FAIL:-N/A}" >> "$GITHUB_ENV"
          printf 'IMPLEMENTATION_SHA=%s\nFULL_EXIT=%s\nFULL_TESTS=%s\nFULL_PASS=%s\nFULL_FAIL=%s\n' \
            3d81e61252f82957f8a0eaf1cd9e9f372ec49f86 "$STATUS" "${TESTS:-N/A}" "${PASS:-N/A}" "${FAIL:-N/A}" \
            > .ci-evidence/full-tests.status
          printf '\nFULL_TEST_EXIT=%s\nFULL_TESTS=%s\nFULL_PASS=%s\nFULL_FAIL=%s\n' "$STATUS" "${TESTS:-N/A}" "${PASS:-N/A}" "${FAIL:-N/A}"
          exit 0

      - name: Persist fresh full-suite output to diagnostic harness
        if: always()
        uses: actions/checkout@v4
        with:
          ref: ci-log04-continuation-harness
          path: harness

      - name: Commit fresh full-suite output to diagnostic harness
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p harness/.ci-harness
          cp repo/.ci-evidence/full-tests.log harness/.ci-harness/log04-fresh-full-tests.log
          cp repo/.ci-evidence/full-tests.status harness/.ci-harness/log04-fresh-full-tests.status
          cd harness
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ci-harness/log04-fresh-full-tests.log .ci-harness/log04-fresh-full-tests.status
          if ! git diff --cached --quiet; then
            git commit -m 'CI: preserve fresh LOG-04 full-suite output'
            git push origin HEAD:ci-log04-continuation-harness
          fi

      - name: Production build after green full suite
        if: env.FULL_EXIT == '0'
        working-directory: repo
        run: npm run build

      - name: Frozen-base diff check and complete changed-file inspection
        if: env.FULL_EXIT == '0'
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          BASE=48d9e612b69b43be9941f97630c580c2b8aed929
          SHA=3d81e61252f82957f8a0eaf1cd9e9f372ec49f86
          git diff --check "$BASE..$SHA"
          echo '=== FROZEN-BASE CHANGED FILE SET ==='
          git diff --name-status "$BASE..$SHA"
          echo '=== FROZEN-BASE DIFF ==='
          git diff --stat "$BASE..$SHA"
          git diff "$BASE..$SHA"
          ACTUAL=$(git diff --name-only "$BASE..$SHA" | sort)
          EXPECTED=$(printf '%s\n' src/product/authoritative-production-executor-base.ts src/product/authority-execution-diagnostics.ts src/product/product-controller-base.ts test/workstreams/orchestration/log04-execution-diagnostics.test.ts | sort)
          test "$ACTUAL" = "$EXPECTED"
          git diff --quiet "$BASE..$SHA" -- src/diagnostics/diagnostic-logger.ts
          git diff --quiet "$BASE..$SHA" -- src/product/operation-isolation.ts
          git diff --quiet "$BASE..$SHA" -- package.json package-lock.json

      - name: Upload preserved verification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log04-exact-sha-verification
          path: repo/.ci-evidence/
          if-no-files-found: warn

      - name: Enforce full-suite gate
        if: always()
        shell: bash
        run: |
          echo "Focused: ${FOCUSED_PASS:-N/A}/${FOCUSED_TESTS:-N/A}; focused fail=${FOCUSED_FAIL:-N/A}"
          echo "Full: ${FULL_PASS:-N/A}/${FULL_TESTS:-N/A}; full fail=${FULL_FAIL:-N/A}; exit=${FULL_EXIT:-N/A}"
          test "${FULL_EXIT:-1}" = "0"
