name: Phase 6 OAuth Branch Retirement

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  retire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retire proven merged OAuth branches and finalize evidence
        run: bash .github/phase6-oauth-retire.sh
