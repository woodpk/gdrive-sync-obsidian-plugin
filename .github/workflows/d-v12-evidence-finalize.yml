name: D v1.2 Evidence Finalizer

on:
  push:
    branches:
      - phase6-sync-orchestration-v1.2-continuation
    paths:
      - .github/workflows/d-v12-evidence-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase6-sync-orchestration-v1.2-continuation
          fetch-depth: 0
      - name: Append required evidence exactly once and remove helper
        shell: bash
        env:
          D0: 
          D1: 
          C0: 
        run: |
          set -euo pipefail
          dedicated='dev/evidence/_ca-output-agt-CA-P6-SYNC-ORCHESTRATION-01.md'
          canonical='dev/evidence/_ca-output.md'
          marker='Phase 6 Workstream D v1.2 D-C4-D-C9 rejection repair closure'
          if grep -Fq "$marker" "$dedicated" || grep -Fq "$marker" "$canonical"; then
            echo 'Evidence marker already present; refusing duplicate append.' >&2
            exit 1
          fi
          printf '%s%s' "$D0" "$D1" | base64 -d >> "$dedicated"
          printf '%s' "$C0" | base64 -d >> "$canonical"
          git rm .github/workflows/d-v12-evidence-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dedicated" "$canonical"
          git commit -m 'docs(D-E1): close D-C4 through D-C9 repair evidence'
          git push origin HEAD:phase6-sync-orchestration-v1.2-continuation
